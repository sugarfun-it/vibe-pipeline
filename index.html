<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>vibe-pipeline</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#d4956d" />
    <!-- 初始 body bg 對齊 theme,避免 React mount 前 white flash。
         placeholder 不依賴外部 asset(避免 PWA offline / SW 沒 cache 時破圖) -->
    <style>
      html { background: #f7f4ee; }
      html:not(.light) { background: #1c1916; }
      body { margin: 0; }
      #vp-mount-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: 'Noto Sans TC', system-ui, sans-serif;
        font-size: 13px; letter-spacing: 0.1em;
        color: #d4956d;
        animation: vp-pulse 1.4s ease-in-out infinite;
      }
      @keyframes vp-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      /* React mount 取代 #root 子節點時 fade in,消「啪」一下切換感 */
      #root > *:not(#vp-mount-loader) {
        animation: vp-fade-in 180ms ease-out;
      }
      @keyframes vp-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
    <script>
      // Set theme class synchronously before any CSS or React loads (no first-paint flash).
      // Priority: URL ?theme=  →  localStorage  →  default light
      // (URL 留 pixel-diff / 分享連結 override;真正記住偏好走 localStorage)
      (function () {
        var p = new URLSearchParams(location.search);
        var urlTheme = p.get("theme");
        var stored = null;
        try { stored = localStorage.getItem("vibe-pipeline:theme"); } catch (e) {}
        var dark = (urlTheme || stored) === "dark";
        if (!dark) document.documentElement.classList.add("light");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- React mount 前 placeholder:避免 PWA reload 白屏一閃。React mount 後整段被 root.render 取代。
           不放 img / 外部 asset(避免 PWA offline / network 不可達時破圖) -->
      <div id="vp-mount-loader">vibe-pipeline</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 自救:unregister SW + 清所有快取 + reload。
      // stale SW serve 到指向「已不存在資產(JS 404)」的舊 shell 時,plain reload 沒用
      // (SW 還在攔截),必須清掉 SW + 快取才會從 server 抓新版。
      window.__vpRecover = function () {
        var reload = function () { location.reload(); };
        try {
          var jobs = [];
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
          }
          Promise.all(jobs).then(reload, reload);
        } catch (e) { reload(); }
      };
      // 10 秒 React 還沒 mount(main.tsx 載失敗 / network 卡 / SW stale)。
      setTimeout(function () {
        var el = document.getElementById('vp-mount-loader');
        if (!el) return; // React 已 mount,placeholder 不存在
        var KEY = 'vp-sw-recovered';
        var hasSW = ('serviceWorker' in navigator) && !!navigator.serviceWorker.controller;
        var recovered = false;
        try { recovered = !!sessionStorage.getItem(KEY); } catch (e) {}
        // 有 SW 在控(stale-shell 嫌疑)且本 session 沒救過 → 自動清快取 + reload,一次為限防 loop。
        if (hasSW && !recovered) {
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          el.textContent = '更新中…';
          window.__vpRecover();
          return;
        }
        // 沒 SW(純 server / network 問題)或自救後仍失敗 → 給手動「清快取重試」鈕。
        el.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:10px">' +
          '<div>vibe-pipeline 載入失敗</div>' +
          '<button type="button" onclick="__vpRecover()" style="padding:6px 14px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px">清除快取並重試</button>' +
          '</div>';
        el.style.animation = 'none';
        el.style.opacity = '0.85';
      }, 10000);
    </script>
  </body>
</html>
