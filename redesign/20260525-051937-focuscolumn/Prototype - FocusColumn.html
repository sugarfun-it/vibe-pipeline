<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FocusColumn — vibe-pipeline reverse handoff prototype</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ============================================================================
 * FocusColumn — CSS SSOT(verbatim source 連接)
 *
 * 來源(verbatim,不挑 snippet):
 *   1. src/styles/tokens.css        — tokens + .btn / .chip / .sr-only / .mono / .pulse / .blink / .fade-up / scrollbar
 *   2. src/styles/board.css         — .meta-row / .meta-atom / .meta-sep utility
 *   3. src/features/pipeline/focus.css      — FocusColumn 容器 / header / banner / overflow / title-edit / focus-diff-chip / focus-empty
 *   4. src/features/pipeline/ticketCard.css — TicketCard / iter-stages / verdict / status-pill
 *   5. src/features/pipeline/syncStatus.css — SyncStatusBar (sync-chip 各狀態)
 *   6. src/features/qa/qa.css       — .qadr-thinking-dots(RunButton sync-busy / spawning 用)
 *
 * 凡同 selector 重複定義,後出現的覆寫前者(同 cascade,跟 source 一致)。
 * ========================================================================= */

/* ─── 1. tokens.css ────────────────────────────────────────────────────── */

:root {
  /* dark (default) */
  --bg: #0c0e12;
  --bg-elevated: #14171c;
  --panel: #161a20;
  --panel-2: #1c2027;
  --hover: rgba(232, 228, 217, 0.04);
  --selected: rgba(216, 162, 90, 0.10);
  --line: rgba(232, 228, 217, 0.06);
  --line-2: rgba(232, 228, 217, 0.12);

  --fg: #e8e3d6;
  --fg-mute: #8b8475;
  --fg-faint: #595448;

  --accent: #d8a25a;
  --accent-soft: rgba(216, 162, 90, 0.12);

  --running: #7e94c8;
  --running-soft: rgba(126, 148, 200, 0.14);
  --iter: #b099d8;
  --iter-soft: rgba(176, 153, 216, 0.14);
  --done: #7eaa7f;
  --done-soft: rgba(126, 170, 127, 0.14);
  --failed: #c47b78;
  --failed-soft: rgba(196, 123, 120, 0.14);
  --paused: #d8a25a;
  --paused-soft: rgba(216, 162, 90, 0.14);
  --queued: #5fb3a8;
  --queued-soft: rgba(95, 179, 168, 0.14);
  --draft: #6e6a5e;

  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;

  --radius-xs: 4px;
  --radius-control: 6px;
  --radius-card: 8px;
  --radius-panel: 10px;
  --control-h: 32px;
  --control-h-sm: 26px;
  --control-pad-x: 12px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-md: 0 12px 32px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
  --shadow-lg: 0 32px 80px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.35);

  --shadow-popover: 0 2px 6px rgba(0,0,0,0.35), 0 12px 28px rgba(0,0,0,0.45);
  --shadow-overlay: var(--shadow-lg);
  --scrim: color-mix(in srgb, #000 45%, transparent);
  --scrim-modal: color-mix(in srgb, #000 55%, transparent);
  --scrim-drawer: color-mix(in srgb, #000 40%, transparent);

  --z-overlay-base: 50;
  --z-popover: 100;
  --z-drawer: 200;
  --z-banner: 300;
  --z-settings: 1500;
  --z-modal: 1700;
  --z-toast: 2200;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  --accent-fg: rgba(255,255,255,0.95);
  --danger-fg: #fff5f3;
  --danger-bg-soft: var(--failed-soft);
  --danger-border: color-mix(in srgb, var(--failed) 55%, var(--line-2));
  --success-fg: #f1faf1;
  --status-dark-fg: #0c0e12;

  --warning-fg: #1c1208;
  --info-fg: #f1f4fa;
  --banner-success-fg: #0e1f0f;
  --banner-ready-fg: var(--status-dark-fg);
  --qa-thinking-fg: var(--fg-mute);
  --inverse-fg: #1c1916;
  --on-accent-fg: var(--accent-fg);

  --bg-callout: color-mix(in srgb, var(--fg-mute) 6%, var(--panel-2));
  --callout-border: var(--line);
  --bg-warning-soft: color-mix(in srgb, var(--paused) 8%, var(--panel-2));
  --warning-border: color-mix(in srgb, var(--paused) 40%, var(--line-2));
  --bg-success-soft: color-mix(in srgb, var(--done) 8%, var(--panel-2));
  --success-border: color-mix(in srgb, var(--done) 40%, var(--line-2));
  --bg-danger-soft: var(--failed-soft);
  --danger-soft-border: color-mix(in srgb, var(--failed) 40%, var(--line-2));
  --bg-info-soft: color-mix(in srgb, var(--running) 8%, var(--panel-2));
  --info-border: color-mix(in srgb, var(--running) 40%, var(--line-2));

  --focus-ring-offset: 2px;
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --qr-plate: #ffffff;

  --font-ui: "Geist", "Inter Tight", -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}

html.light {
  --bg: #f7f3e8;
  --bg-elevated: #ffffff;
  --panel: #ffffff;
  --panel-2: #faf6ea;
  --hover: rgba(28, 25, 22, 0.04);
  --selected: rgba(181, 117, 26, 0.08);
  --line: rgba(28, 25, 22, 0.07);
  --line-2: rgba(28, 25, 22, 0.14);

  --fg: #1c1916;
  --fg-mute: #6e6658;
  --fg-faint: #a8a292;

  --accent: #b5751a;
  --accent-soft: rgba(181, 117, 26, 0.12);

  --running: #4a6db0;
  --running-soft: rgba(74, 109, 176, 0.10);
  --iter: #7551b8;
  --iter-soft: rgba(117, 81, 184, 0.10);
  --done: #3a8a4a;
  --done-soft: rgba(58, 138, 74, 0.10);
  --failed: #b04040;
  --failed-soft: rgba(176, 64, 64, 0.10);
  --paused: #b5751a;
  --paused-soft: rgba(181, 117, 26, 0.12);
  --queued: #2e8a80;
  --queued-soft: rgba(46, 138, 128, 0.10);
  --draft: #a8a292;

  --shadow-sm: 0 1px 2px rgba(28,25,22,0.08);
  --shadow-md: 0 12px 32px rgba(28,25,22,0.14), 0 2px 6px rgba(28,25,22,0.08);
  --shadow-lg: 0 32px 80px rgba(28,25,22,0.22), 0 4px 12px rgba(28,25,22,0.12);
  --shadow-popover: 0 2px 6px rgba(28,25,22,0.10), 0 12px 28px rgba(28,25,22,0.18);
  --shadow-overlay: var(--shadow-lg);
  --scrim: color-mix(in srgb, #1c1916 35%, transparent);
  --scrim-modal: color-mix(in srgb, #1c1916 45%, transparent);
  --scrim-drawer: color-mix(in srgb, #1c1916 30%, transparent);

  --accent-fg: #ffffff;
  --danger-fg: #ffffff;
  --danger-bg-soft: var(--failed-soft);
  --danger-border: var(--failed);
  --success-fg: #ffffff;
  --status-dark-fg: #1c1916;

  --warning-fg: #1c1208;
  --info-fg: #ffffff;
  --banner-success-fg: #0e1f0f;
  --banner-ready-fg: var(--status-dark-fg);
  --qa-thinking-fg: var(--fg-mute);
  --inverse-fg: #ffffff;
  --on-accent-fg: var(--accent-fg);

  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --qr-plate: #ffffff;
}

* { box-sizing: border-box; }

html, body, #root {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

.mono { font-family: var(--font-mono); font-feature-settings: "ss01", "cv11"; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  padding: 2px 7px; border-radius: 4px;
  background: var(--panel-2); color: var(--fg-mute);
  border: 1px solid var(--line);
  white-space: nowrap;
  flex-shrink: 0;
}
.chip-state { padding-left: 5px; }
.chip-state .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.icon-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--fg-mute); transition: background 120ms, color 120ms;
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--control-h, 32px);
  padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--line-2); color: var(--fg);
  background: var(--panel-2);
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.btn:hover:not(:disabled):not([aria-disabled="true"]):not(.btn-primary):not(.btn-danger):not(.btn-queued):not(.btn-accent) {
  background: var(--hover); border-color: var(--line-2);
}
.btn:active:not(:disabled) { transform: translateY(0.5px); }
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  color: var(--fg-faint);
}
.btn:disabled:hover { background: var(--panel); border-color: var(--line); }
.btn-primary {
  background: var(--accent); color: rgba(255,255,255,0.95); border-color: var(--accent);
  font-weight: 500;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-accent {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-mute); }
.btn-ghost:hover { background: var(--hover); color: var(--fg); }
.btn-danger {
  background: transparent;
  color: var(--failed);
  border-color: color-mix(in srgb, var(--failed) 45%, transparent);
  font-weight: 500;
}
.btn-danger:hover { background: var(--failed-soft); border-color: var(--failed); }

.btn-queued {
  background: color-mix(in srgb, var(--queued) 14%, var(--panel-2));
  border-color: color-mix(in srgb, var(--queued) 45%, var(--line-2));
  color: var(--queued);
  font-weight: 500;
}
.btn-queued:hover:not(:disabled):not([aria-disabled="true"]) {
  background: color-mix(in srgb, var(--queued) 22%, var(--panel-2));
  border-color: color-mix(in srgb, var(--queued) 60%, var(--line-2));
}
.btn-queued:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.btn[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
  color: var(--fg-mute);
  background: var(--panel-2);
  border-color: var(--line);
}
.btn[aria-disabled="true"]:hover {
  background: var(--panel-2);
  border-color: var(--line);
  filter: none;
  transform: none;
}
.btn[aria-disabled="true"]:active { transform: none; }
.btn[aria-disabled="true"]:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

html.light .dotgrid {
  background-image: radial-gradient(rgba(28,25,22,0.06) 1px, transparent 1.5px);
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}
.pulse { animation: pulseDot 1.6s ease-in-out infinite; }

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.3; }
}
.blink { animation: blink 1.1s steps(2) infinite; }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.9s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; }
  .pulse { animation: none; opacity: 0.85; }
  .blink { animation: none; opacity: 0.85; }
  .fade-up { animation: none; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 280ms ease-out both; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ─── 2. board.css (meta-row utility,FocusColumn 用到) ──────────────── */

.meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-1, 4px) var(--space-2, 8px);
  min-width: 0;
}
.meta-atom {
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.meta-sep {
  color: var(--fg-faint);
  user-select: none;
}

/* ─── 3. focus.css(FocusColumn 主 CSS) ─────────────────────────────── */

.focus {
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
  overflow-y: auto;
  padding: 22px 28px 28px;
  background: var(--bg);
}
.focus-head { margin-bottom: 16px; position: relative; z-index: 5; }
.focus-head-top {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}
.focus-head-title-row,
.focus-head-meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.focus-head-title-spacer,
.focus-head-meta-spacer {
  flex: 1 1 auto;
  min-width: 0;
}
.focus-actions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.focus-run-wrap {
  display: inline-flex;
  align-items: center;
}
.focus-actions[data-show-merge-banner="1"] .focus-run-wrap[data-pipeline-state="ready"],
.focus-actions[data-show-merge-banner="1"] .focus-run-wrap[data-pipeline-state="merged"] {
  display: none;
}
.focus-head,
.focus-list,
.focus .banner {
  width: 100%;
}
.focus-title {
  margin: 0;
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
}
.focus-count { font-size: 11.5px; color: var(--fg-mute); }

.focus-list { display: flex; flex-direction: column; gap: 10px; }
.focus-list:has(> .focus-empty) {
  flex: 1 1 auto;
  min-height: 0;
}

.banner {
  display: flex; align-items: center; gap: var(--space-3, 14px);
  padding: var(--space-3, 12px) var(--space-3, 14px);
  border-radius: var(--radius-panel, 10px);
  border: 1px solid;
  margin-top: var(--space-3, 12px);
  position: relative;
  z-index: var(--z-banner, 5);
}
.banner-paused {
  background: var(--paused-soft);
  border-color: color-mix(in srgb, var(--paused) 30%, transparent);
}
.banner-ready {
  background: var(--done-soft);
  border-color: color-mix(in srgb, var(--done) 30%, transparent);
}
.banner-icon { display: inline-flex; flex-shrink: 0; color: currentColor; }
.banner-paused .banner-icon { color: var(--paused); }
.banner-body { flex: 1; min-width: 0; }
.banner-title { font-size: 13px; font-weight: 600; color: var(--fg); }
.banner-desc { font-size: 11.5px; color: var(--fg-mute); margin-top: 2px; }

.banner[data-state="ready"],
.banner--ready {
  background: var(--done-soft);
  border-color: color-mix(in srgb, var(--done) 35%, transparent);
  color: var(--done);
}
.banner[data-state="merging"],
.banner--merging {
  background: color-mix(in srgb, var(--running) 12%, transparent);
  border-color: color-mix(in srgb, var(--running) 35%, transparent);
  color: var(--running);
}
.banner[data-state="merged"],
.banner--merged {
  background: color-mix(in srgb, var(--done) 8%, transparent);
  border-color: color-mix(in srgb, var(--done) 45%, var(--line-2));
  color: var(--done);
}
.banner[data-state="failed"],
.banner--failed {
  background: var(--danger-bg-soft, color-mix(in srgb, var(--failed) 12%, transparent));
  border-color: var(--danger-border, color-mix(in srgb, var(--failed) 45%, var(--line-2)));
  color: var(--failed);
}
.banner[data-state="paused"],
.banner--paused {
  background: var(--paused-soft);
  border-color: color-mix(in srgb, var(--paused) 30%, transparent);
  color: var(--paused);
}
.banner[data-state] .banner-icon,
.banner--ready .banner-icon,
.banner--merging .banner-icon,
.banner--merged .banner-icon,
.banner--failed .banner-icon { color: currentColor; }
.banner[data-state] .banner-title,
.banner--ready .banner-title,
.banner--merging .banner-title,
.banner--merged .banner-title,
.banner--failed .banner-title { color: var(--fg); }
.banner[data-state] .banner-desc,
.banner--ready .banner-desc,
.banner--merging .banner-desc,
.banner--merged .banner-desc,
.banner--failed .banner-desc { color: var(--fg-mute); }

[data-density="compact"] .focus-list { gap: 6px; }
[data-density="compact"] .focus { padding: 16px 24px 24px; }

.focus-diff-chip {
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: transparent;
}

.focus-diff-added { color: var(--done); }
.focus-diff-sep {
  color: var(--fg-faint);
  margin: 0 4px;
}
.focus-diff-deleted { color: var(--failed); }
.focus-diff-files {
  color: var(--fg-mute);
  margin-left: 6px;
}

.focus-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 48px 24px;
  flex: 1 1 auto;
  min-height: 0;
  color: var(--fg-mute);
  text-align: center;
}

.focus-empty-title {
  margin: 0;
  font-size: 14px;
  color: var(--fg);
  font-weight: 500;
}

.focus-empty-desc {
  font-size: 12px;
  line-height: 1.6;
  max-width: min(360px, calc(100% - 16px));
}

.focus-empty-cta {
  margin-top: 4px;
}

.focus-overflow {
  position: relative;
  display: inline-block;
}

.focus-overflow-menu {
  min-width: 180px;
  max-width: min(280px, calc(100vw - 16px));
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: var(--z-popover, 100);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.focus-overflow-item {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 6px 10px;
  border: 0;
  border-radius: 4px;
  text-align: left;
  color: var(--fg);
  background: transparent;
  cursor: pointer;
  font: inherit;
  font-size: 12.5px;
}

.focus-overflow-item:hover:not(:disabled) {
  background: var(--hover);
}

.focus-overflow-item:disabled {
  color: var(--fg-faint);
  cursor: not-allowed;
  opacity: 0.55;
}

.focus-overflow-item.is-danger {
  color: var(--failed);
}

.focus-overflow-item.is-danger:disabled {
  color: var(--fg-faint);
}

.focus-overflow-item-icon {
  display: inline-flex;
  justify-content: center;
}

.focus-overflow-item-label {
  white-space: nowrap;
}

.focus-overflow-item-hint {
  font-size: 10px;
  color: var(--fg-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.focus-title-edit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.focus-title-input {
  font-size: inherit;
  font-weight: inherit;
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  color: var(--fg);
  min-width: 200px;
}

.focus-title-input.is-invalid {
  border-color: var(--failed);
}

.focus-title-edit-btn {
  padding: 2px 6px;
  font-size: 12px;
}

.focus-modal-text {
  margin: 6px 0;
}

.focus-modal-text--mt {
  margin: 12px 0 6px;
  font-size: 13px;
}

.focus-modal-files {
  margin: 8px 0;
  padding-left: 18px;
  font-size: 12px;
  color: var(--fg-mute);
  max-height: 200px;
  overflow-y: auto;
  word-break: break-all;
  overflow-wrap: anywhere;
}
.focus-modal-files li {
  line-height: 1.45;
  padding: 1px 0;
}

.focus-runs-chip {
  font-size: 11px;
  color: var(--fg-mute);
  border: 1px solid var(--line);
  background: transparent;
  padding-block: 1px;
}

.run-btn-stop-now {
  background: transparent;
  color: var(--failed);
  border: 1px solid color-mix(in srgb, var(--failed) 45%, transparent);
}
.run-btn-stop-now:hover {
  background: var(--failed-soft);
  border-color: var(--failed);
}

.btn.run-btn-empty[aria-disabled="true"] {
  color: var(--fg-mute);
  background: var(--bg-elevated);
  border: 1px solid var(--line-2);
  opacity: 1;
}

@media (max-width: 767.98px) {
  .focus {
    padding: 14px 14px 18px !important;
  }
  .focus-title {
    font-size: 18px !important;
  }
  .focus-head { margin-bottom: 10px !important; }
  .focus-head-top {
    gap: 6px !important;
    margin-bottom: 8px !important;
  }
  .focus-count {
    font-size: 11px !important;
  }

  .focus-head-title-row,
  .focus-head-meta-row {

  }
  .focus-head-title-row {

  }
  .focus-actions {
    gap: 6px;
  }

  .run-btn-empty-label-full { display: none; }
  .run-btn-empty-label-short { display: inline; }

  .focus-title-edit-btn,
  .focus-overflow > .btn {
    padding-inline: 8px;
  }

  .focus-title-edit-confirm,
  .focus-title-edit-cancel {
    padding: 0;
    border-radius: var(--radius-control, 6px);
    display: inline-flex;
    align-items: center;

  .run-btn-empty.run-btn-empty-merged {

  .focus-actions[data-show-merge-banner="1"] .focus-run-wrap[data-pipeline-state="ready"],
  .focus-actions[data-show-merge-banner="1"] .focus-run-wrap[data-pipeline-state="merged"] {

  .focus-actions {

  .focus-actions .focus-run-wrap[data-sync-active="1"] {

    padding: 0;

  .focus-actions .focus-run-wrap[data-sync-active="1"] > button {
    display: none;
  }

  .focus-actions[data-empty-mode="1"][data-has-active-draft="0"] .focus-add-ticket {

  .banner.banner-merged .banner-desc {

  .banner-desc .banner-meta-sep {

  .banner.banner-merged .banner-body {
    min-width: 0;
  }

  .banner.banner-merged {
    padding: var(--space-3, 12px) var(--space-4, 14px);
    border-radius: var(--radius-control, 6px);

    margin-top: var(--space-2, 8px);

  }

  .banner[data-state="ready"],
  .banner[data-state="failed"],

  .banner[data-state="ready"] .banner-body,
  .banner[data-state="failed"] .banner-body,
  .banner[data-state="merging"] .banner-body {

  .banner[data-state="ready"] > .btn,
  .banner[data-state="failed"] > .btn,
  .banner[data-state="merging"] > .btn {

@media (min-width: 768px) {
  .run-btn-empty-label-full { display: inline; }
  .run-btn-empty-label-short { display: none; }
}

/* ─── 4. ticketCard.css(TicketCard / iter-stages / status-pill) ──────── */

.ticket {
  position: relative;
  padding: 12px 16px 14px 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  transition: border-color 120ms, background 120ms, transform 120ms, box-shadow 120ms;
  animation: fadeUp 280ms ease-out both;
  --ticket-num-width: 22px;
  --ticket-header-gap: 8px;
  --ticket-content-indent: calc(var(--ticket-num-width) + var(--ticket-header-gap));
}
.ticket:hover { border-color: var(--line-2); background: var(--panel-2); }
.ticket.is-clickable:hover {
  border-color: var(--line-2);
  background: var(--hover);
}
.ticket.is-clickable:hover .ticket-card__chevron { color: var(--fg); transform: translateX(2px); }
.ticket.is-clickable:active {
  transform: translateY(0.5px);
  border-color: var(--accent);
  background: var(--hover);
}
.ticket.is-clickable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-color: var(--accent);
}
.ticket.is-paused { border-color: color-mix(in srgb, var(--paused) 35%, var(--line-2)); }
.ticket.is-draft { opacity: 0.6; }
.ticket.is-draft:hover { opacity: 1; }

.ticket.is-running { background: color-mix(in srgb, var(--running) 7%, var(--panel)); }
.ticket.is-paused  { background: color-mix(in srgb, var(--paused)  6%, var(--panel)); }
.ticket.is-done    { background: color-mix(in srgb, var(--done)    5%, var(--panel)); }
.ticket.is-failed  { background: color-mix(in srgb, var(--failed)  8%, var(--panel)); }

.ticket.is-splitting {
  border-color: color-mix(in srgb, var(--accent) 50%, var(--line-2));
  animation: ticket-splitting-pulse 1.4s ease-in-out infinite;
}
@keyframes ticket-splitting-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); }
  50%      { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
}
.chip.ticket-splitting {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: color-mix(in srgb, var(--accent) 12%, var(--panel-2));
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line-2));
  color: var(--accent);
  font-weight: 600;
}
.ticket-splitting-spinner {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-top-color: var(--accent);
  animation: ticket-splitting-spin 700ms linear infinite;
}
@keyframes ticket-splitting-spin {
  to { transform: rotate(360deg); }
}

.ticket-band {
  position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 4px; border-radius: 2px;
}

.ticket-row {
  display: flex; align-items: center; gap: 10px;
}
.ticket-card__header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--ticket-header-gap);
}
.ticket-card__trailing {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ticket-card__chevron {
  color: var(--fg-mute);
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  transition: color 120ms, transform 120ms;
}
.ticket-card__sub {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  margin-left: var(--ticket-content-indent);
  flex-wrap: wrap;
}
.ticket-card__titleline {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
}
.ticket-card__titleline > .ticket-mode {
  flex: 0 0 auto;
  align-self: center;
}
.ticket-num {
  font-size: 11px; color: var(--fg-mute); width: var(--ticket-num-width); flex-shrink: 0;
}
.ticket-title {
  flex: 1; font-size: 13.5px; font-weight: 500;
  color: var(--fg);
  letter-spacing: 0;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.ticket-goal {
  margin-top: 6px;
  margin-left: var(--ticket-content-indent);
  font-size: 12px;
  line-height: 1.4;
  color: var(--fg-mute);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ticket-mode {
  background: var(--panel-2);
  font-size: 10.5px;
  color: var(--fg-mute);
}
.ticket-mode.is-iter {
  background: var(--iter-soft);
  color: var(--iter);
  border-color: transparent;
  font-weight: 600;
}
button.ticket-mode {
  font-family: inherit;
  cursor: pointer;
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.ticket-mode.is-toggle {
  border-color: var(--line);
}
.ticket-mode.is-toggle:hover {
  border-color: var(--accent);
  background: var(--hover);
}
.ticket-mode.is-iter.is-toggle:hover {
  background: color-mix(in srgb, var(--iter) 24%, transparent);
}
.ticket-mode.is-toggle:active { transform: translateY(0.5px); }

.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  background: color-mix(in srgb, currentColor 12%, transparent);
}
.status-pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.ticket-meta {
  font-size: 10.5px; color: var(--fg-mute);
}

.ticket-iter {
  display: flex; align-items: center; gap: 18px;
  margin-top: 10px;
  margin-left: var(--ticket-content-indent);
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 11.5px;
  flex-wrap: wrap;
}
.iter-stages { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.iter-stage {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono); font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--line-2);
  color: var(--fg-faint);
  background: transparent;
}
.iter-stage.is-past { color: var(--fg-mute); border-color: transparent; background: var(--panel); }
.iter-stage.is-active {
  color: var(--fg); border-color: var(--iter);
  background: var(--iter-soft);
  font-weight: 600;
}
.iter-stage.is-paused { color: var(--paused); border-color: var(--paused); background: var(--paused-soft); }
.iter-stage-arrow { color: var(--fg-faint); font-size: 11px; }
.ticket-iter-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 4px;
}
.ticket-iter-summary {
  margin-left: var(--ticket-content-indent);
}
.iter-round-num {
  font-size: 10px; color: var(--fg-mute);
  min-width: 24px;
}
.ticket-card__progress {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 32px;
  padding: 6px 10px;
  margin-top: 8px;
  border-radius: var(--radius-control, 6px);
  background: color-mix(in srgb, var(--done) 7%, transparent);
  border: 1px solid color-mix(in srgb, var(--done) 18%, transparent);
  font-size: 11.5px;
  box-shadow: none;
}
.ticket.is-failed .ticket-card__progress {
  background: color-mix(in srgb, var(--failed) 7%, transparent);
  border-color: color-mix(in srgb, var(--failed) 22%, transparent);
}
.ticket-card__round-summary .ticket-card__round-text {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex-wrap: wrap;
}
.ticket-card__round-flow {
  color: var(--fg-mute);
  font-size: 11px;
}
.ticket-card__round-verdict {
  font-weight: 600;
  font-size: 11px;
}
.ticket-card__round-verdict.is-pass { color: var(--done); }
.ticket-card__round-verdict.is-fail { color: var(--failed); }
.ticket-card__round-verdict.is-part { color: var(--paused); }
.ticket-card__round-verdict.is-unknown { color: var(--fg-mute); }
.ticket-card__round-elapsed {
  margin-left: 0;
  color: var(--fg-mute);
}
.ticket-iter-summary {
  margin-top: 6px;
  font-size: 10.5px;
  color: var(--fg-mute);
  font-family: var(--font-mono);
}

.iter-stage-mark {
  display: inline-flex;
  align-items: center;
  font-size: 9px;
  line-height: 1;
  font-family: var(--font-mono);
}
.iter-stage-mark.is-running {
  color: var(--iter);
  animation: iter-stage-mark-pulse 1.2s ease-in-out infinite;
}
.iter-stage-mark.is-paused {
  color: var(--paused);
  opacity: 0.9;
}
.iter-stage-mark.is-past-mark {
  color: var(--done);
  opacity: 0.85;
}
.iter-stage-mark.is-future-mark {
  color: var(--fg-faint);
  opacity: 0.55;
}
.iter-stage-mark.is-result-pass {
  color: var(--done);
  font-weight: 600;
}
.iter-stage-mark.is-result-fail {
  color: var(--failed);
  font-weight: 600;
}
.iter-stage-mark.is-result-part {
  color: var(--paused);
  font-weight: 600;
}
.iter-stage-mark.is-failed-mark {
  color: var(--failed);
  font-weight: 600;
  opacity: 0.9;
}
.ticket.is-failed .iter-stage.is-active {
  border-color: var(--failed);
  background: color-mix(in srgb, var(--failed) 12%, transparent);
  color: var(--fg);
}
@keyframes iter-stage-mark-pulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.18); }
}

.verdicts { display: inline-flex; align-items: center; gap: 4px; }

.verdict-pip.is-pass { background: var(--done); }
.verdict-pip.is-warn { background: var(--paused); }
.verdict-pip.is-fail { background: var(--failed); }

.iter-meta {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: auto;
  font-size: 10.5px; color: var(--fg-mute);
}
.iter-meta strong { color: var(--fg); font-weight: 600; }

.ticket-livelog {
  margin-top: 8px;
  margin-left: var(--ticket-content-indent);
  padding: 7px 10px;
  font-size: 11px;
  color: var(--fg-mute);
  background: #0a0c10;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex; align-items: center; gap: 8px;
}
html.light .ticket-livelog { background: #1c1916; color: #fbf8f1; border-color: #1c1916; }
.livelog-cursor { color: var(--running); }

.ticket-paused-actions {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; padding-top: 10px;
  margin-left: var(--ticket-content-indent);
  border-top: 1px dashed var(--line);
  flex-wrap: wrap;
}
.paused-reason {
  flex: 1; min-width: 180px;
  font-size: 11.5px; color: var(--paused);
}
.ticket-paused-actions.is-failed-reason {
  border-top-color: color-mix(in srgb, var(--failed) 35%, var(--line));
}
.paused-reason.is-failed {
  color: var(--failed);
}

[data-density="compact"] .ticket { padding: 9px 14px 10px 20px; }
[data-density="compact"] .ticket-iter { padding: 6px 9px; gap: 12px; margin-top: 7px; }
[data-density="compact"] .ticket-title { font-size: 12.5px; }

@media (max-width: 767.98px) {
  .ticket-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 8px;
  }
  .ticket-row > .chip,
  .ticket-row > .status-pill,
  .ticket-row > .ticket-mode,
  .ticket-row > .ticket-meta {
    grid-column: 1 / -1;
    justify-self: start;
  }
  .ticket-card__header {
    grid-template-columns: auto minmax(0, 1fr) auto;
  }
  .ticket-card__header > .ticket-card__trailing {
    grid-column: auto;
    justify-self: end;
  }
  .ticket-card__header .ticket-title {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.35;
  }
  .ticket-card__titleline {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .ticket-card__titleline > .ticket-mode {
    align-self: flex-start;
  }
  .ticket-card__description {
    margin-top: 6px;
  }
  .ticket.is-failed .ticket-iter-row,
  .ticket.is-done .ticket-iter-row {
    padding: 5px 8px;
    gap: 10px;
    margin-top: 3px;
    font-size: 11px;
  }
  .ticket.is-failed .ticket-iter-row .iter-stage,
  .ticket.is-done .ticket-iter-row .iter-stage {
    font-size: 10px;
    padding: 1px 6px;
  }
  .ticket.is-failed .ticket-iter-row .iter-meta,
  .ticket.is-done .ticket-iter-row .iter-meta {
    font-size: 10px;
  }
}

@media (max-width: 480px) {
  .ticket {
    padding: 10px 12px 12px 18px;
  }
  .ticket-card__progress {
    margin-top: 6px;
    padding: 5px 8px;
  }
  .ticket {
    --ticket-num-width: 20px;
    --ticket-header-gap: 10px;
  }
}

@media (hover: none) {
  .ticket.is-draft {
    opacity: 1;
  }
}

/* ─── 5. syncStatus.css(SyncStatusBar chip 各狀態) ───────────────────── */

.sync-chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 28px;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 600;
  padding: 4px 12px; border-radius: 7px;
  border: 1px solid var(--queued);
  background: color-mix(in srgb, var(--queued) 14%, transparent);
  color: var(--queued);
  cursor: pointer;
  white-space: nowrap;
  max-width: 100%;
  flex-shrink: 1;
  min-width: 0;
  transition: background 120ms, transform 80ms, box-shadow 120ms;
}
.sync-chip:hover {
  background: color-mix(in srgb, var(--queued) 24%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--queued) 18%, transparent);
}
.sync-chip:active { transform: translateY(0.5px); }
.sync-chip:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  box-shadow: none;
}
.sync-chip:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}
@media (pointer: coarse) {
  button.sync-chip {
    min-height: 40px;
    padding-top: 10px;
    padding-bottom: 10px;
  }
}
.sync-chip .sync-chip-arrow {
  font-size: 13px;
  line-height: 1;
}

.sync-chip.sync-chip-busy {
  cursor: default;
  color: var(--queued);
}
.sync-chip.sync-chip-conflict {
  border-color: var(--accent, #d4956d);
  background: color-mix(in srgb, var(--accent, #d4956d) 14%, transparent);
  color: var(--accent, #d4956d);
}
.sync-chip.sync-chip-failed {
  border-color: var(--failed);
  background: color-mix(in srgb, var(--failed) 14%, transparent);
  color: var(--failed);
}
.sync-chip.sync-chip-done {
  border-color: var(--done);
  background: color-mix(in srgb, var(--done) 14%, transparent);
  color: var(--done);
}
.sync-chip-icon {
  margin-left: 6px;
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  padding: 0;
  border-radius: 5px;
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background 100ms, filter 100ms;
}
.sync-chip-icon svg {
  width: 13px; height: 13px;
}
.sync-chip-icon:hover {
  background: color-mix(in srgb, currentColor 18%, transparent);
}
.sync-chip-icon::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 10px;
}
.sync-chip-icon:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 10px;
  border-radius: 5px;
}
.sync-chip.sync-chip-conflict .sync-chip-icon.sync-chip-primary {
  background: var(--accent, #d4956d);
  color: var(--accent-fg, #fff);
  border-color: var(--accent, #d4956d);
}
.sync-chip.sync-chip-failed .sync-chip-icon.sync-chip-primary {
  background: var(--failed);
  color: var(--danger-fg, #fff);
  border-color: var(--failed);
}
.sync-chip-icon.sync-chip-primary:hover {
  filter: brightness(1.1);
}
.sync-chip.sync-chip-failed .sync-chip-icon.sync-chip-ghost {
  color: var(--fg-mute);
  border-color: color-mix(in srgb, var(--fg-mute) 40%, transparent);
}
.sync-chip.sync-chip-failed .sync-chip-icon.sync-chip-ghost:hover {
  color: var(--fg);
  background: color-mix(in srgb, var(--fg-mute) 14%, transparent);
}

.sync-thinking-dots {
  display: inline-flex;
  gap: 3px;
  align-items: center;
}
.sync-thinking-dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.4;
  animation: sync-thinking-dot 1.2s infinite ease-in-out;
}

function fmtElapsed(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function normalizeVerdict(v) {
  if (v == null) return "UNKNOWN";
  const k = typeof v === "string" ? v.toUpperCase() : String(v);
  if (k === "PASS" || k === "1") return "PASS";
  if (k === "FAIL" || k === "-1") return "FAIL";
  if (k === "PARTIAL" || k === "0") return "PARTIAL";
  return "UNKNOWN";
}

function fmtVerdict(v) {
  const n = normalizeVerdict(v);
  if (n === "UNKNOWN") return "未知";
  if (n === "PARTIAL") return "部分通過";
  if (n === "PASS") return "通過";
  if (n === "FAIL") return "失敗";
  return String(v);
}
function verdictToken(v) {
  const n = normalizeVerdict(v);
  if (n === "UNKNOWN") return "unknown";
  if (n === "PARTIAL") return "part";
  if (n === "PASS") return "pass";
  if (n === "FAIL") return "fail";
  return "unknown";
}

};

// ─── IterStages (matches src/features/pipeline/IterStages.tsx verbatim) ──

function IterStages({ stage, status, stages = ["doer", "critic", "✓"], lastVerdict }) {
  const raw = String(stage);
  const normalized =
    raw === "doer" || raw === "critic" || raw === "✓"
      ? raw
      : raw === "done" || /done|complete|pass|finish|✓/i.test(raw)
      ? "✓"
      : /crit|review|judge|check/i.test(raw)
      ? "critic"
      : /exec|run|do|work/i.test(raw)
      ? "doer"
      : "doer";
  let idx = stages.indexOf(normalized === "done" ? "✓" : normalized);
  if (idx === -1) idx = 0;
  const currentName = STAGE_LABEL[stages[idx] ?? "doer"];
  const isResultStage = stages[idx] === "✓";
  const statusText = status === "running" ? "執行中" : status === "paused" ? "已暫停" : status === "done" ? "已完成" : "";
  const resultText = isResultStage ? `,結果:${fmtVerdict(lastVerdict)}` : "";
  const ariaSummary = `目前階段:${currentName}${statusText ? `,狀態:${statusText}` : ""}${resultText}`;
  return (
    <div className="iter-stages" role="group" aria-label={ariaSummary}>
      {stages.map((s, i) => {
        const isPast = i < idx;
        const isCurrent = i === idx;
        const isFuture = i > idx;
        const isResult = s === "✓";
        let mark = null;
        if (isPast) {
          mark = { text: "✓", cls: "is-past-mark", srLabel: "完成" };
        } else if (isCurrent) {
          if (isResult) {
            const v = fmtVerdict(lastVerdict);
            const tok = verdictToken(lastVerdict);
            const verdictLabel = tok === "pass" ? "通過" : tok === "fail" ? "未通過" : tok === "part" ? "部分通過" : "結果未知";
            mark = { text: v, cls: "is-result-" + tok, srLabel: verdictLabel };
          } else if (status === "running") {
            mark = { text: "▶", cls: "is-running", srLabel: "執行中" };
          } else if (status === "paused") {
            mark = { text: "⏸", cls: "is-paused", srLabel: "已暫停" };
          } else if (status === "failed" || status === "failed_iter_limit" || status === "failed_transient") {
            mark = { text: "✕", cls: "is-failed-mark", srLabel: "失敗" };
          }
        } else if (isFuture) {
          mark = { text: "?", cls: "is-future-mark", srLabel: "待進行" };
        }
        return (
          <span key={s} style={{ display: "contents" }}>
            <span className={"iter-stage" + (isPast ? " is-past" : "") + (isCurrent ? " is-active" : "") + (isFuture ? " is-future" : "") + (status === "paused" && isCurrent ? " is-paused" : "")}>
              {STAGE_LABEL[s]}
              {mark && (<>
                <span className={"iter-stage-mark " + mark.cls} aria-hidden>{mark.text}</span>
                {mark.srLabel && <span className="sr-only">{` ${mark.srLabel}`}</span>}
              </>)}
            </span>
            {i < stages.length - 1 && <span aria-hidden className="iter-stage-arrow"><ArrowRightIcon /></span>}
          </span>
        );
      })}
    </div>
  );
}

// ─── TicketCard (matches src/features/pipeline/TicketCard.tsx verbatim) ──

function TicketCard({ ticket, tick, index, isSplitting = false, onSelect }) {
  const onClick = onSelect ? () => onSelect(ticket) : undefined;
  const isIter = ticket.mode === "iter" || ticket.mode === "merge" || ticket.mode === "sync";
  const hasCritic = ticket.mode === "iter";
  const stageList = hasCritic ? ["doer", "critic", "✓"] : ["doer", "✓"];
  const isRunning = ticket.status === "running";
  const isPaused = ticket.status === "paused";
  const isDraft = ticket.status === "draft" || ticket.status === "ready";
  const isDone = ticket.status === "done";
  const isFailed = ticket.status === "failed" || ticket.status === "failed_iter_limit" || ticket.status === "failed_transient";
  const isTerminal = isDone || isFailed;
  const isRoundComplete = (r) => Boolean(r.endedAt && (!hasCritic || r.criticVerdict));

  void tick;
  let elapsed;
  const rs = ticket.iter?.rounds ?? [];
  if (rs.length > 0) {
    const completedSec = rs.reduce((sum, r) => sum + (isRoundComplete(r) && r.startedAt ? Math.max(0, r.endedAt - r.startedAt) : 0), 0) / 1000;
    const inProg = rs.find((r) => !isRoundComplete(r));
    const inProgEndCap = isRunning ? Date.now() : isTerminal ? (ticket.endedAt ?? inProg?.endedAt) : undefined;
    const liveSec = inProg?.startedAt && typeof inProgEndCap === "number" ? Math.max(0, (inProgEndCap - inProg.startedAt) / 1000) : 0;
    elapsed = Math.round(completedSec + liveSec);
  } else {
    const ts = ticket.startedAt;
    const te = ticket.endedAt;
    if (typeof ts === "number") {
      const end = isRunning ? Date.now() : (te ?? Date.now());
      elapsed = Math.max(0, Math.round((end - ts) / 1000));
    } else {
      elapsed = ticket.iter?.totalElapsed ?? 0;
    }
  }
  const completedRoundsForLabel = rs.filter((r) => isRoundComplete(r));
  const inProgForLabel = rs.find((r) => !isRoundComplete(r));
  const lastCompletedN = completedRoundsForLabel[completedRoundsForLabel.length - 1]?.n;
  const iterCurrentLabel = ticket.iter ? (inProgForLabel?.n ?? lastCompletedN ?? Math.max(1, ticket.iter.current)) : 0;
  const accent = TICKET_STATUS_COLOR[ticket.status] || "var(--draft)";
  const statusLabel = TICKET_STATUS_LABEL[ticket.status] ?? ticket.status;
  const accessibleState = isSplitting ? "AI 拆分中" : statusLabel;
  const modeLabel = MODE_LABELS[ticket.mode] ?? ticket.mode;
  const summaryText = isTerminal
    ? `共 ${iterCurrentLabel} 輪 · 總耗時 ${fmtElapsed(elapsed)}`
    : isPaused
    ? `第 ${iterCurrentLabel} 輪 · 已暫停 · 已耗時 ${fmtElapsed(elapsed)}`
    : `第 ${iterCurrentLabel} 輪 · 已耗時 ${fmtElapsed(elapsed)}`;
  const completedRoundCount = rs.filter((r) => isRoundComplete(r)).length;
  const hideSummary = isTerminal && completedRoundCount <= 1 && rs.length <= 1;

  const ariaLabelParts = [];
  if (onClick) {
    ariaLabelParts.push(`開啟 ticket #${String(ticket.n).padStart(2, "0")} ${ticket.title}`);
    ariaLabelParts.push(modeLabel);
    ariaLabelParts.push(accessibleState);
    if (ticket.goal) ariaLabelParts.push(ticket.goal);
    if (isIter && ticket.iter && ((ticket.iter.rounds?.length ?? 0) > 0 || isRunning || isPaused || isTerminal)) {
      ariaLabelParts.push(summaryText);
    }
    if (isPaused && ticket.reason) ariaLabelParts.push(`暫停原因:${ticket.reason}`);
  }
  const ariaLabel = onClick ? ariaLabelParts.join("，") : undefined;

  return (
    <div
      className={"ticket"
        + (onClick ? " is-clickable" : "")
        + (isDraft ? " is-draft" : "")
        + (isPaused ? " is-paused" : "")
        + (isRunning ? " is-running" : "")
        + (ticket.status === "done" ? " is-done" : "")
        + ((ticket.status === "failed" || ticket.status === "failed_iter_limit" || ticket.status === "failed_transient") ? " is-failed" : "")
        + (isSplitting ? " is-splitting" : "")}
      style={{
        animationDelay: `${index * 40}ms`,
        cursor: onClick ? "pointer" : undefined,
        ["--ticket-accent"]: accent
      }}
      onClick={onClick}
      role={onClick ? "button" : undefined}
      tabIndex={onClick ? 0 : undefined}
      aria-label={ariaLabel}
    >
      <span className="ticket-band" aria-hidden style={{ background: accent }} />
      <div className="ticket-row ticket-card__header">
        <span className="ticket-num mono">{String(ticket.n).padStart(2, "0")}</span>
        <div className="ticket-card__titleline">
          {modeLabel && (
            <span className={"chip ticket-mode" + (isIter ? " is-iter" : "")}>{modeLabel}</span>
          )}
          <div className="ticket-title">{ticket.title}</div>
        </div>
        <div className="ticket-card__trailing">
          {isSplitting ? (
            <span className="chip ticket-splitting">
              <span className="ticket-splitting-spinner" aria-hidden />
              AI 拆分中
            </span>
          ) : (
            <StatusPill status={ticket.status} />
          )}
          {onClick && <ChevronRightIcon className="ticket-card__chevron" />}
        </div>
      </div>

      {ticket.meta && !isIter && (
        <div className="ticket-card__sub">
          <span className="ticket-meta mono">{ticket.meta}</span>
        </div>
      )}
      {ticket.goal && <div className="ticket-goal ticket-card__description">{ticket.goal}</div>}

      {isIter && ticket.iter && ((ticket.iter.rounds?.length ?? 0) > 0 || ticket.status === "running" || ticket.status === "paused" || ticket.status === "done" || ticket.status === "failed" || ticket.status === "failed_iter_limit" || ticket.status === "failed_transient") && (() => {
        const rounds = ticket.iter.rounds ?? [];
        const hasIncompleteRound = rounds.some((r) => !isRoundComplete(r));
        const inProgress = (ticket.status === "running" || ticket.status === "paused" || isFailed) && hasIncompleteRound && ticket.iter.stage !== "✓" && ticket.iter.stage !== "done";
        return (<>
          {rounds.filter((r) => isRoundComplete(r)).map((r) => (
            <div key={r.n} className="ticket-iter ticket-iter-row">
              <span className="iter-round-num mono">第 {r.n} 輪</span>
              <IterStages stage="✓" status="done" stages={stageList} lastVerdict={r.criticVerdict} />
              <span className="iter-meta mono">
                {r.startedAt ? fmtElapsed(Math.round((r.endedAt - r.startedAt) / 1000)) : "—"}
              </span>
            </div>
          ))}
          {inProgress && (() => {
            const inProg = rounds.find((r) => !isRoundComplete(r));
            const completed = rounds.filter((r) => isRoundComplete(r));
            const lastEnded = completed[completed.length - 1]?.endedAt;
            const roundStart = inProg?.startedAt ?? lastEnded ?? ticket.startedAt;
            const roundEnd = isTerminal ? (ticket.endedAt ?? inProg?.endedAt ?? Date.now()) : Date.now();
            const live = typeof roundStart === "number" ? Math.max(0, Math.round((roundEnd - roundStart) / 1000)) : 0;
            const roundNum = inProg?.n ?? ticket.iter?.current ?? completed.length + 1;
            return (
              <div className="ticket-iter ticket-iter-row">
                <span className="iter-round-num mono">#{roundNum}</span>
                <IterStages stage={ticket.iter.stage} status={ticket.status} stages={stageList} />
                <span className="iter-meta mono">{fmtElapsed(live)}</span>
              </div>
            );
          })()}
          {rounds.length === 0 && !inProgress && (
            <div className="ticket-iter ticket-iter-row">
              <span className="iter-round-num mono">#1</span>
              <IterStages stage="doer" status={ticket.status} stages={stageList} />
            </div>
          )}
          {!hideSummary && (
            <div className="ticket-iter-summary mono">{summaryText}</div>
          )}
        </>);
      })()}

      {!isIter && (ticket.status === "running" || ticket.status === "paused" || ticket.status === "done" || ticket.status === "failed" || ticket.status === "failed_iter_limit" || ticket.status === "failed_transient") && (() => {
        const sa = ticket.startedAt;
        const ea = ticket.endedAt;
        const ms = sa ? (ea ?? Date.now()) - sa : 0;
        const elapsedStr = sa ? fmtElapsed(Math.max(0, Math.round(ms / 1000))) : null;
        const terminalStage = isTerminal ? "✓" : "doer";
        const terminalStatus = isTerminal && ticket.status !== "done" ? "failed" : ticket.status;
        const verdictHint = isTerminal ? (ticket.status === "done" ? "PASS" : "FAIL") : undefined;
        return (
          <div className="ticket-iter ticket-iter-row">
            <span className="iter-round-num mono">#1</span>
            <IterStages stage={terminalStage} status={terminalStatus} stages={["doer", "✓"]} lastVerdict={verdictHint} />
            {elapsedStr && <span className="iter-meta mono">{elapsedStr}</span>}
          </div>
        );
      })()}

      {isRunning && ticket.liveLog && (
        <div className="ticket-livelog mono" role="status" aria-live="polite" aria-atomic="true">
          <span className="livelog-cursor blink" aria-hidden>▸</span> {ticket.liveLog}
        </div>
      )}

      {(isPaused || isFailed) && ticket.reason && (
        <div className={"ticket-paused-actions" + (isFailed ? " is-failed-reason" : "")}>
          <span className={"paused-reason" + (isFailed ? " is-failed" : "")}>{ticket.reason}</span>
        </div>
      )}
    </div>
  );
}

function StatusPill({ status }) {
  const c = TICKET_STATUS_COLOR[status] ?? STATE_COLOR[status];
  const label = TICKET_STATUS_LABEL[status] ?? status;
  const isLive = status === "running";
  return (
    <span className="status-pill mono" style={{ color: c }}>
      <span className={"status-pill-dot" + (isLive ? " pulse" : "")} style={{ background: c }} aria-hidden />
      {label}
    </span>
  );
}

// ─── RunButton (matches src/features/pipeline/RunButton.tsx verbatim) ───

function RunButton({ pipeline, onRun, onStop, spawning = false, queuePosition, syncActive = false }) {
  const s = pipeline.state;
  const noTickets = pipeline.tickets.length === 0;
  if (s === "running") {
    return (
      <button type="button" className="btn btn-danger run-btn-stop-now" onClick={() => onStop?.(pipeline.id)} aria-label="停止 pipeline" title={syncActive ? "同步進行中,但 runner 仍可停止" : undefined}>
        <StopIcon /> 停止
      </button>
    );
  }
  if (s === "queued") {
    const hasPos = !!(queuePosition && queuePosition > 0);
    const posLabel = hasPos ? `順位 ${queuePosition}` : "排隊中";
    const ariaLabel = hasPos ? `取消排隊(目前順位 ${queuePosition})` : "取消排隊";
    return (
      <button type="button" className="btn btn-queued" onClick={() => onStop?.(pipeline.id)} aria-label={ariaLabel}>
        <HourglassIcon /> {posLabel} · 取消
      </button>
    );
  }
  if (syncActive) {
    const reason = "同步收尾後可執行 ticket";
    return (<>
      <button type="button" className="btn run-btn-sync-busy" aria-disabled="true" aria-label={`助理處理中 — ${reason}`} title={reason}>
        <span className="qadr-thinking-dots" aria-hidden><span /><span /><span /></span>{" "}助理處理中
      </button>
      <span className="sr-only" role="status" aria-live="polite">助理處理中</span>
    </>);
  }
  if (spawning && (s === "planning" || s === "paused" || s === "failed" || s === "ready" || s === "merged")) {
    const reason = "啟動 runner(約 1-5 秒)";
    return (<>
      <button type="button" className="btn" aria-disabled="true" aria-label={`啟動中 — ${reason}`} title={reason}>
        <span className="qadr-thinking-dots" aria-hidden><span /><span /><span /></span>{" "}啟動中
      </button>
      <span className="sr-only" role="status" aria-live="polite">啟動中</span>
    </>);
  }
  if (s === "planning" || s === "paused" || s === "failed" || s === "ready" || s === "merged") {
    const hasRunnableReal = pipeline.tickets.some((t) => t.mode !== "merge" && t.mode !== "sync" && (t.status === "draft" || t.status === "ready" || t.status === "paused" || t.status === "failed_transient"));
    if (noTickets || !hasRunnableReal) {
      const reason = noTickets ? "上方「+ 新增 ticket」開 QA 建第一張" : "目前 ticket 都已完成或永久失敗;新增或修復 ticket 後即可執行";
      return (
        <button type="button" className={"btn run-btn-empty" + (s === "merged" ? " run-btn-empty-merged" : "")} aria-disabled="true" aria-label={`無可執行 ticket — ${reason}`} title={reason}>
          <span className="run-btn-empty-label-full" aria-hidden>無可執行 ticket</span>
          <span className="run-btn-empty-label-short" aria-hidden>無 ticket</span>
        </button>
      );
    }
    const label = s === "paused" ? "繼續" : s === "failed" ? "重試" : "執行";
    const ariaLabel = s === "paused" ? "繼續執行 pipeline" : s === "failed" ? "重試 pipeline" : "執行 pipeline";
    return (
      <button type="button" className="btn btn-primary" onClick={() => onRun?.(pipeline.id)} aria-label={ariaLabel}>
        <PlayIcon /> {label}
      </button>
    );
  }
  return null;
}

// ─── ReadyBanner (matches src/features/pipeline/ReadyBanner.tsx verbatim) ──

const BANNER_M = {
  merged: (base) => `已合併入 ${base}`,
  failedWithRetry: "合併失敗 — 修正工作區後重試",
  failedNoAction: "合併失敗 — 請至執行紀錄查看錯誤並修正工作區",
  merging: "正在合併,處理衝突中",
  mergeQueued: "合併已排入佇列,即將開始",
  ready: "所有 ticket 已完成",
  commits: (n) => `${n} 個 commit`
};

function ReadyBanner({ pipeline, onMerge }) {
  const [pending, setPending] = useState(false);
  const titleId = useId();
  const descId = useId();
  const commitCount = pipeline.tickets.reduce((sum, t) => sum + (t.commits?.length ?? 0), 0);
  const baseBranch = pipeline.baseBranch || "main";
  const isMerged = pipeline.state === "merged";
  const failedMerge = pipeline.tickets.find((t) => t.mode === "merge" && (t.status === "failed" || t.status === "failed_iter_limit" || t.status === "failed_transient" || t.status === "paused"));
  const runningMergeTicket = pipeline.tickets.find((t) => t.mode === "merge" && t.status === "running");
  const queuedMergeTicket = pipeline.tickets.find((t) => t.mode === "merge" && t.status === "ready");
  const mergingTicket = runningMergeTicket || queuedMergeTicket;
  const isMerging = !!mergingTicket && !isMerged;
  const isQueued = !runningMergeTicket && !!queuedMergeTicket && !isMerged;

  const variant = isMerged ? "merged" : isMerging ? "merging" : failedMerge ? "failed" : "ready";
  const variantClass = variant === "merged" ? "banner-ready banner-merged" : variant === "ready" ? "banner-ready" : "banner-paused";
  const iconColor = variant === "merged" ? "var(--done)" : variant === "failed" ? "var(--failed)" : variant === "merging" ? "var(--running)" : "var(--done)";
  const Icon = variant === "failed" ? WarnIcon : variant === "merging" ? SpinnerIcon : CheckCircleIcon;
  const hasRetry = variant === "failed" && !!onMerge;
  const title = variant === "merged" ? BANNER_M.merged(baseBranch) : variant === "failed" ? (hasRetry ? BANNER_M.failedWithRetry : BANNER_M.failedNoAction) : variant === "merging" ? (isQueued ? BANNER_M.mergeQueued : BANNER_M.merging) : BANNER_M.ready;
  const liveRole = variant === "failed" ? "alert" : variant === "merging" ? "status" : "group";
  const ariaLive = variant === "failed" ? "assertive" : variant === "merging" ? "polite" : undefined;
  const showButton = !!onMerge && (variant === "ready" || variant === "failed");
  const buttonLabel = variant === "failed" ? "重試合併" : `合併入 ${baseBranch}`;
  const buttonAriaLabel = variant === "failed" ? `重試合併 pipeline ${pipeline.branch} 進 ${baseBranch}` : `合併 pipeline ${pipeline.branch} 進 ${baseBranch}`;

  return (
    <div
      className={`banner fade-up ${variantClass}`}
      data-state={variant}
      role={liveRole}
      aria-live={ariaLive}
      aria-labelledby={(variant === "merged" || variant === "ready") ? titleId : undefined}
      aria-describedby={(variant === "merged" || variant === "ready") ? descId : undefined}
      aria-busy={(variant === "merging" && !isQueued) ? true : undefined}
    >
      <span className="banner-icon" aria-hidden style={{ color: iconColor }}><Icon /></span>
      <div className="banner-body">
        <div className="banner-title" id={titleId}>{title}</div>
        <div className="banner-desc mono meta-row" id={descId}>
          <span className="meta-atom">{pipeline.branch} → {baseBranch}</span>
          <span className="meta-sep banner-meta-sep" aria-hidden> · </span>
          <span className="meta-atom">{BANNER_M.commits(commitCount)}</span>
        </div>
      </div>
      {showButton && (
        <button type="button" className="btn btn-primary" disabled={pending} aria-disabled={pending || undefined} aria-label={buttonAriaLabel} onClick={() => { setPending(true); setTimeout(() => setPending(false), 1200); onMerge?.(pipeline.id); }}>
          <MergeIcon /> {buttonLabel}
        </button>
      )}
    </div>
  );
}

// ─── SyncStatusBar (matches src/features/pipeline/SyncStatusBar.tsx verbatim) ─

function SyncStatusBar({ pipeline, behindFallback, pipelineBusy, tick, onStart, onConfirmAi, onCancel, onDismiss }) {
  const j = pipeline.syncJob;
  if (!j) {
    if (behindFallback === null || behindFallback <= 0) return null;
    const baseLabel = pipeline.baseBranch || "base";
    const ariaLabel = pipelineBusy
      ? `落後 ${baseLabel} ${behindFallback} 個 commit。同步功能停用中:pipeline 執行中,需等停止或 ready 才能同步`
      : `落後 ${baseLabel} ${behindFallback} 個 commit。按下開始同步:先嘗試 git merge,衝突才呼叫助理`;
    return (
      <button type="button" className="sync-chip"
        title={pipelineBusy ? `落後 ${baseLabel} ${behindFallback} 個 commit(pipeline 在跑,等停止後或 ready 才能同步)` : `落後 ${baseLabel} ${behindFallback} 個 commit · 點擊先試合併,衝突才呼叫助理`}
        aria-label={ariaLabel} disabled={pipelineBusy} onClick={onStart}>
        <span className="sync-chip-arrow" aria-hidden>⇣</span>
        落後 {behindFallback} · 同步
      </button>
    );
  }
  if (j.state === "merging") {
    const baseLabel = pipeline.baseBranch || "base";
    return (
      <span className="sync-chip sync-chip-busy" role="status" aria-live="polite"
        aria-label={`正在合併 ${baseLabel},落後 ${j.behindCount} 個 commit,同步中`}
        title={`合併 ${baseLabel} 進行中(落後 ${j.behindCount} 個 commit)`}>
        <span className="sync-thinking-dots" aria-hidden><span /><span /><span /></span>{" "}同步中
      </span>
    );
  }
  if (j.state === "conflict_await") {
    const files = j.conflictFiles ?? [];
    const n = files.length;
    const tipPreview = files.slice(0, 8).join("\n");
    const tipMore = files.length > 8 ? `\n…還有 ${files.length - 8} 個檔案` : "";
    return (
      <span className="sync-chip sync-chip-conflict" role="status" aria-live="polite"
        title={`等待處理衝突 ${n} 個檔案(落後 ${j.behindCount} 個 commit):\n${tipPreview}${tipMore}\n\n按 ✓ 交給助理 / ✕ 取消並中止合併`}>
        <span className="sync-chip-arrow" aria-hidden>!</span>
        等待處理衝突（{n} 個檔案）
        <button type="button" className="sync-chip-icon sync-chip-primary" onClick={onConfirmAi} title="交給助理解衝突" aria-label="交給助理解衝突"><CheckIconSm /></button>
        <button type="button" className="sync-chip-icon" onClick={onCancel} title="取消並中止合併" aria-label="取消並中止合併"><CloseIcon /></button>
      </span>
    );
  }
  if (j.state === "ai_running") {
    const elapsedSec = Math.max(0, Math.round((Date.now() - j.startedAt) / 1000));
    void tick;
    const files = j.conflictFiles ?? [];
    const tipPreview = files.slice(0, 8).join("\n");
    const tipMore = files.length > 8 ? `\n…還有 ${files.length - 8} 個檔案` : "";
    return (
      <span className="sync-chip sync-chip-busy" role="status" aria-live="polite" aria-label="助理處理中"
        title={`助理處理中 · 已歷時 ${fmtElapsed(elapsedSec)}\n衝突檔(${files.length}):\n${tipPreview}${tipMore}`}>
        <span className="sync-thinking-dots" aria-hidden><span /><span /><span /></span>{" "}助理處理中 · <span aria-hidden>{fmtElapsed(elapsedSec)}</span>
        <button type="button" className="sync-chip-icon" onClick={onCancel} title="取消" aria-label="取消助理處理"><CloseIcon /></button>
      </span>
    );
  }
  if (j.state === "failed") {
    const files = j.conflictFiles ?? [];
    const tipPreview = files.length > 0 ? `\n衝突檔(${files.length}):\n${files.slice(0, 8).join("\n")}${files.length > 8 ? `\n…還有 ${files.length - 8} 個檔案` : ""}` : "";
    const shortReason = (j.reason || "(未知)").slice(0, 200);
    return (
      <span className="sync-chip sync-chip-failed" role="status" aria-live="polite"
        title={`同步失敗(落後 ${j.behindCount} 個 commit)\n原因:${shortReason}${tipPreview}`}>
        <span className="sync-chip-arrow" aria-hidden>✕</span>
        同步失敗
        <button type="button" className="sync-chip-icon sync-chip-primary" onClick={onStart} title="重試同步" aria-label="重試同步"><RefreshIcon /></button>
        <button type="button" className="sync-chip-icon sync-chip-ghost" onClick={onDismiss} title="關" aria-label="關閉同步失敗提示"><CloseIcon /></button>
      </span>
    );
  }
  const doneTitle = j.mergeCommit ? `同步完成(merge commit ${j.mergeCommit.hash.slice(0, 7)})\n${j.mergeCommit.subject}` : j.behindCount > 0 ? `同步完成(整合 ${j.behindCount} 個 commit)` : "已是最新,無需同步";
  return (
    <span className="sync-chip sync-chip-done" role="status" aria-live="polite" title={doneTitle}>
      <span className="sync-chip-arrow" aria-hidden>✓</span>
      已同步
      <button type="button" className="sync-chip-icon" onClick={onDismiss} title="關" aria-label="關閉同步完成提示"><CloseIcon /></button>
    </span>
  );
}

// ─── FocusTitle (matches src/features/pipeline/FocusTitle.tsx verbatim) ──

function FocusTitle({ pipeline, onRename, existingNames, editingExternal, onEditingChange }) {
  const [editingInternal, setEditingInternal] = useState(false);
  const editing = editingExternal !== undefined ? editingExternal : editingInternal;
  const setEditing = (v) => { setEditingInternal(v); onEditingChange?.(v); };
  const [draft, setDraft] = useState(pipeline.name);
  const inputRef = useRef(null);
  useEffect(() => { setDraft(pipeline.name); setEditingInternal(false); }, [pipeline.id, pipeline.name]);
  useEffect(() => { if (editing) inputRef.current?.select(); }, [editing]);

  const trimmed = draft.trim();
  const formatOk = /^[a-z0-9][a-z0-9-_]*$/.test(trimmed);
  const taken = trimmed !== pipeline.name && existingNames.includes(trimmed);
  const valid = trimmed.length > 0 && formatOk && !taken;
  const lockedByState = pipeline.state === "running" || pipeline.state === "queued";

  function commit() {
    if (!valid || trimmed === pipeline.name) { setEditing(false); setDraft(pipeline.name); return; }
    onRename?.(pipeline.id, trimmed);
    setEditing(false);
  }
  const errorMsg = taken ? "名稱已存在" : !formatOk ? "只能 a-z / 0-9 / - / _,首字英數" : "";
  const errorId = "focus-title-error";

  if (editing) {
    return (
      <span className="focus-title-edit" role="group" aria-label="重新命名 pipeline">
        <input ref={inputRef} className={"mono focus-title-input" + (valid ? "" : " is-invalid")} value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setEditing(false); setDraft(pipeline.name); } }}
          spellCheck={false} autoComplete="off" aria-label="pipeline 名稱" aria-invalid={!valid} aria-describedby={errorMsg ? errorId : undefined} />
        {errorMsg && (
          <span id={errorId} role="status" aria-live="polite" style={{ fontSize: 11, color: "var(--failed)", marginLeft: 4, whiteSpace: "nowrap" }}>{errorMsg}</span>
        )}
        <button type="button" className="btn btn-primary focus-title-edit-confirm" onClick={commit} disabled={!valid || trimmed === pipeline.name}
          title={taken ? "名稱已存在" : !formatOk ? "只能 a-z / 0-9 / - / _,首字英數" : "儲存 pipeline 名稱"} aria-label="儲存 pipeline 名稱"><CheckIconSm /></button>
        <button type="button" className="btn focus-title-edit-cancel" onClick={() => { setEditing(false); setDraft(pipeline.name); }} title="取消 (Esc)" aria-label="取消重新命名"><CloseIcon /></button>
      </span>
    );
  }
  return (
    <h2 className="focus-title focus-title-edit">
      {pipeline.name}
      {onRename && (
        <button type="button" className="btn btn-ghost focus-title-edit-btn" onClick={() => setEditing(true)} disabled={lockedByState}
          title={lockedByState ? "running 中不能改名" : "改名"} aria-label={lockedByState ? "running 中無法重新命名" : "重新命名 pipeline"}><PencilIcon /></button>
      )}
    </h2>
  );
}

  return (
    <div className="focus-overflow">
      <button type="button" className="btn" onClick={() => setOpen(!open)} title="更多操作" aria-label="更多 pipeline 操作" aria-haspopup="menu" aria-expanded={open}>

          {onShowHistory && (
            <MenuItem icon={<HistoryIcon />} label="執行紀錄" hint="" onClick={() => { setOpen(false); onShowHistory(); }} />
          )}
          {onRevealWorktree && (() => {
            const hasWorktree = typeof pipeline.hasWorktree === "boolean" ? pipeline.hasWorktree : pipeline.state !== "planning" && pipeline.state !== "merged";
            const hint = hasWorktree ? "" : pipeline.state === "planning" ? "未建立" : pipeline.state === "merged" ? "已合併" : "已清除";
            return (
              <MenuItem icon={<FolderIcon />} label="開啟 worktree" hint={hint} disabled={!hasWorktree} onClick={() => { setOpen(false); onRevealWorktree(pipeline.id); }} />

      )}
    </div>
  );
}

// ─── useFocusPipeline (matches src/features/pipeline/useFocusPipeline.ts) ─
// fetch / useApi / useTimeout 全 stub — fixture 直接從 props 灌

function useFocusPipeline({ pipeline, diffStat, runs, behind }) {
  const totalCost = runs.reduce((sum, r) => sum + (r.costUsd ?? 0), 0);
  const stateColor = STATE_COLOR[pipeline.state];
  const stateLabel = STATE_LABEL[pipeline.state];
  const realTickets = pipeline.tickets.filter((t) => t.mode !== "sync");
  const done = realTickets.filter((t) => t.status === "done").length;
  const total = realTickets.length;
  const allDone = done === total && pipeline.state === "ready";
  const failedMergeTicket = pipeline.tickets.find((t) => t.mode === "merge" && (t.status === "failed" || t.status === "failed_iter_limit" || t.status === "failed_transient" || t.status === "paused"));
  const noWorktreeDiff = diffStat !== null && diffStat !== undefined && diffStat.files === 0 && diffStat.added === 0 && diffStat.deleted === 0;
  const showMergeBanner = (allDone && !noWorktreeDiff) || pipeline.state === "merged" || !!failedMergeTicket;
  const syncActive = !!pipeline.syncJob && (pipeline.syncJob.state === "merging" || pipeline.syncJob.state === "conflict_await" || pipeline.syncJob.state === "ai_running");
  const lockedByState = pipeline.state === "running" || pipeline.state === "queued" || syncActive;
  return { totalCost, stateColor, stateLabel, done, total, noWorktreeDiff, showMergeBanner, syncActive, lockedByState };
}

    document.documentElement.className = theme === "light" ? "light" : "";
    document.documentElement.setAttribute("data-density", density);
  }, [theme, density]);

  // compose pipeline
  const tickets = SCENARIO_TICKETS[scenario];
  const splittingTicketId = splittingActive ? (tickets.find((t) => t.id === "t-splitting")?.id ?? null) : null;
  const pipeline = useMemo(() => ({
    id: "pl-demo",
    name: "feat-ui-refresh",
    branch: "pipeline/feat-ui-refresh",
    baseBranch: "main",
    state: pipelineState,
    tickets,
    autoMerge,
    hasWorktree: pipelineState !== "planning" && pipelineState !== "merged",
    syncJob: SYNC_JOB_FIXTURES[syncKey],
    createdAt: nowMinus(7 * 86400)
  }), [pipelineState, scenario, autoMerge, syncKey, splittingActive]);

  const diffStat = DIFF_FIXTURES[diffKey];
  const runs = RUN_FIXTURES[runsKey];
  const behind = behindFallback === "" ? null : Number(behindFallback);

  return (
    <div className="proto-shell">
      {/* fake sidebar — 對齊 BoardScreen 真實版面感(non-FocusColumn,僅供視覺脈絡) */}
      <aside className="proto-rail">
        <div className="proto-rail-title">PROJECT</div>
        <div className="proto-rail-item active">
          <span className="proto-rail-dot" style={{ background: "var(--accent)" }} />
          <span>vibe-pipeline</span>
        </div>
        <div className="proto-rail-title" style={{ marginTop: 18 }}>PIPELINES</div>
        <div className="proto-rail-item active">
          <span className="proto-rail-dot" style={{ background: STATE_COLOR[pipelineState] }} />
          <span>{pipeline.name}</span>
        </div>
        <div className="proto-rail-item">
          <span className="proto-rail-dot" style={{ background: "var(--done)" }} />
          <span>hotfix-toast-z</span>
        </div>
        <div className="proto-rail-item">
          <span className="proto-rail-dot" style={{ background: "var(--draft)" }} />
          <span>chore-tokens</span>
        </div>
      </aside>

      <FocusColumn
        pipeline={pipeline}
        tick={tick}
        hasActiveDraft={hasActiveDraft}
        existingNames={["hotfix-toast-z", "chore-tokens"]}
        projectHash="abc123def"
        queuePosition={queuePosition === "" ? undefined : Number(queuePosition)}
        splittingTicketId={splittingTicketId}
        diffStat={diffStat}
        runs={runs}
        behind={behind}
        spawning={spawning}
        onRun={(id) => console.log("[demo] run", id)}
        onStop={(id) => console.log("[demo] stop", id)}
        onAddTicket={(id) => console.log("[demo] addTicket", id)}
        onDelete={(id) => console.log("[demo] delete", id)}
        onRename={(id, n) => console.log("[demo] rename", id, n)}
        onResetPipeline={(id) => console.log("[demo] reset", id)}
        onRevealWorktree={(id) => console.log("[demo] reveal", id)}
        onMerge={(id) => console.log("[demo] merge", id)}
        onSync={(id) => console.log("[demo] sync", id)}
        onSyncConfirmAi={(id) => console.log("[demo] syncConfirmAi", id)}
        onSyncCancel={(id) => console.log("[demo] syncCancel", id)}
        onSyncDismiss={(id) => console.log("[demo] syncDismiss", id)}
        onToggleAutoMerge={(id, next) => setAutoMerge(next)}
        onTicketClick={(t) => console.log("[demo] ticket click", t.id)}
        historyOpen={historyOpen} setHistoryOpen={setHistoryOpen}
        diffOpen={diffOpen} setDiffOpen={setDiffOpen}
        overflowOpen={overflowOpen} setOverflowOpen={setOverflowOpen}
        titleEditing={titleEditing} setTitleEditing={setTitleEditing}
      />

      <div className="proto-demo-panel">
        <h4>Theme / Density</h4>
        <label><input type="radio" name="theme" checked={theme === "dark"} onChange={() => setTheme("dark")} /> dark</label>
        <label><input type="radio" name="theme" checked={theme === "light"} onChange={() => setTheme("light")} /> light</label>
        <label><input type="radio" name="density" checked={density === "normal"} onChange={() => setDensity("normal")} /> normal density</label>
        <label><input type="radio" name="density" checked={density === "compact"} onChange={() => setDensity("compact")} /> compact density</label>

        <h4>pipeline.state(7)</h4>
        <select value={pipelineState} onChange={(e) => setPipelineState(e.target.value)}>
          {["planning", "running", "queued", "paused", "ready", "failed", "merged"].map((s) => (
            <option key={s} value={s}>{s} — {STATE_LABEL[s]}</option>
          ))}
        </select>

        <h4>tickets scenario(11)</h4>
        <select value={scenario} onChange={(e) => setScenario(e.target.value)}>
          {Object.keys(SCENARIO_TICKETS).map((k) => (
            <option key={k} value={k}>{k} — {SCENARIO_LABELS[k]}</option>
          ))}
        </select>

        <h4>syncJob.state(6)</h4>
        <select value={syncKey} onChange={(e) => setSyncKey(e.target.value)}>
          {Object.keys(SYNC_JOB_FIXTURES).map((k) => (
            <option key={k} value={k}>{SYNC_LABELS[k]}</option>
          ))}
        </select>

        <h4>behindFallback(syncJob=none 時)</h4>
        <select value={behindFallback} onChange={(e) => setBehindFallback(e.target.value)}>
          <option value="">null(完全不顯)</option>
          <option value="0">0(不顯)</option>
          <option value="3">3 個 commit 落後</option>
          <option value="12">12 個 commit 落後</option>
        </select>

        <h4>diffStat</h4>
        <select value={diffKey} onChange={(e) => setDiffKey(e.target.value)}>
          {Object.keys(DIFF_FIXTURES).map((k) => <option key={k} value={k}>{k}</option>)}
        </select>

        <h4>runs(累積執行紀錄)</h4>
        <select value={runsKey} onChange={(e) => setRunsKey(e.target.value)}>
          {Object.keys(RUN_FIXTURES).map((k) => <option key={k} value={k}>{k}</option>)}
        </select>

        <h4>RunButton 周邊</h4>
        <label><input type="checkbox" checked={spawning} onChange={(e) => setSpawning(e.target.checked)} /> spawning(啟動 runner 中)</label>
        <label>
          queuePosition:
          <select value={queuePosition} onChange={(e) => setQueuePosition(e.target.value)} style={{ width: 80, marginLeft: 6 }}>
            <option value="">undefined</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="5">5</option>
          </select>
        </label>

        <h4>FocusColumn flags</h4>
        <label><input type="checkbox" checked={hasActiveDraft} onChange={(e) => setHasActiveDraft(e.target.checked)} /> hasActiveDraft</label>
        <label><input type="checkbox" checked={autoMerge} onChange={(e) => setAutoMerge(e.target.checked)} /> pipeline.autoMerge</label>
        <label><input type="checkbox" checked={splittingActive} onChange={(e) => setSplittingActive(e.target.checked)} /> splittingTicketId active</label>

        <h4>Drawer / Modal / Popover</h4>
        <label><input type="checkbox" checked={overflowOpen} onChange={(e) => setOverflowOpen(e.target.checked)} /> overflow menu open</label>
        <label><input type="checkbox" checked={historyOpen} onChange={(e) => setHistoryOpen(e.target.checked)} /> history drawer open</label>
        <label><input type="checkbox" checked={diffOpen} onChange={(e) => setDiffOpen(e.target.checked)} /> diff modal open</label>
        <label><input type="checkbox" checked={titleEditing} onChange={(e) => setTitleEditing(e.target.checked)} /> title rename mode</label>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemoApp />);
</script>
</body>
</html>
