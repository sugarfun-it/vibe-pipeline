/* ───────────────────────────────────────────────────────────────
   QADrawer — CSS SSOT (verbatim concat of source files used by
   src/features/qa/QADrawer.tsx). No rewrites, no rebalancing.

   Source bundle order matches main.tsx + drawer/qa.css imports:
     1. src/styles/tokens.css       — :root / html.light tokens, .chip, .btn, etc
     2. src/styles/drawer.css       — .drawer-stage / .drawer / .drawer-head / .drawer-body / .drawer-foot
     3. src/styles/board.css §chip  — .vp-chip family + .ticket-mode (subset used by QA)
     4. src/features/qa/qa.css      — QADrawer-only content styles (qadr-*)

/* ═══════════════════════════════════════════════════════════════
   [1] src/styles/tokens.css — full file (single source of truth
   for colour / spacing / radius / shadow / chip / btn / icon-btn /
   typography / sr-only / keyframes).
   ═══════════════════════════════════════════════════════════════ */

/* vibe-flow prototype — tokens & primitives */
:root {
  /* dark (default) */
  --bg: #0c0e12;
  --bg-elevated: #14171c;
  --panel: #161a20;
  --panel-2: #1c2027;
  --hover: rgba(232, 228, 217, 0.04);
  --selected: rgba(216, 162, 90, 0.10);
  --line: rgba(232, 228, 217, 0.06);
  --line-2: rgba(232, 228, 217, 0.12);

  --fg: #e8e3d6;
  --fg-mute: #8b8475;
  --fg-faint: #595448;

  --accent: #d8a25a;
  --accent-soft: rgba(216, 162, 90, 0.12);

  --running: #7e94c8;
  --running-soft: rgba(126, 148, 200, 0.14);
  --iter: #b099d8;
  --iter-soft: rgba(176, 153, 216, 0.14);
  --done: #7eaa7f;
  --done-soft: rgba(126, 170, 127, 0.14);
  --failed: #c47b78;
  --failed-soft: rgba(196, 123, 120, 0.14);
  --paused: #d8a25a;
  --paused-soft: rgba(216, 162, 90, 0.14);
  --queued: #5fb3a8;
  --queued-soft: rgba(95, 179, 168, 0.14);
  --draft: #6e6a5e;

  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;

  --radius-xs: 4px;
  --radius-control: 6px;
  --radius-card: 8px;
  --radius-panel: 10px;
  --control-h: 32px;
  --control-h-sm: 26px;
  --control-pad-x: 12px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-md: 0 12px 32px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
  --shadow-lg: 0 32px 80px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.35);

  --shadow-popover: 0 2px 6px rgba(0,0,0,0.35), 0 12px 28px rgba(0,0,0,0.45);
  --shadow-overlay: var(--shadow-lg);
  --scrim: color-mix(in srgb, #000 45%, transparent);
  --scrim-modal: color-mix(in srgb, #000 55%, transparent);
  --scrim-drawer: color-mix(in srgb, #000 40%, transparent);

  --z-overlay-base: 50;
  --z-popover: 100;
  --z-drawer: 200;
  --z-banner: 300;
  --z-settings: 1500;
  --z-modal: 1700;
  --z-toast: 2200;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  --accent-fg: rgba(255,255,255,0.95);
  --danger-fg: #fff5f3;
  --danger-bg-soft: var(--failed-soft);
  --danger-border: color-mix(in srgb, var(--failed) 55%, var(--line-2));
  --success-fg: #f1faf1;
  --status-dark-fg: #0c0e12;

  --warning-fg: #1c1208;
  --info-fg: #f1f4fa;
  --banner-success-fg: #0e1f0f;
  --banner-ready-fg: var(--status-dark-fg);
  --qa-thinking-fg: var(--fg-mute);
  --inverse-fg: #1c1916;
  --on-accent-fg: var(--accent-fg);

  --bg-callout: color-mix(in srgb, var(--fg-mute) 6%, var(--panel-2));
  --callout-border: var(--line);
  --bg-warning-soft: color-mix(in srgb, var(--paused) 8%, var(--panel-2));
  --warning-border: color-mix(in srgb, var(--paused) 40%, var(--line-2));
  --bg-success-soft: color-mix(in srgb, var(--done) 8%, var(--panel-2));
  --success-border: color-mix(in srgb, var(--done) 40%, var(--line-2));
  --bg-danger-soft: var(--failed-soft);
  --danger-soft-border: color-mix(in srgb, var(--failed) 40%, var(--line-2));
  --bg-info-soft: color-mix(in srgb, var(--running) 8%, var(--panel-2));
  --info-border: color-mix(in srgb, var(--running) 40%, var(--line-2));

  --focus-ring-offset: 2px;
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --qr-plate: #ffffff;

  --font-ui: "Geist", "Inter Tight", -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}

html.light {
  --bg: #f7f3e8;
  --bg-elevated: #ffffff;
  --panel: #ffffff;
  --panel-2: #faf6ea;
  --hover: rgba(28, 25, 22, 0.04);
  --selected: rgba(181, 117, 26, 0.08);
  --line: rgba(28, 25, 22, 0.07);
  --line-2: rgba(28, 25, 22, 0.14);

  --fg: #1c1916;
  --fg-mute: #6e6658;
  --fg-faint: #a8a292;

  --accent: #b5751a;
  --accent-soft: rgba(181, 117, 26, 0.12);

  --running: #4a6db0;
  --running-soft: rgba(74, 109, 176, 0.10);
  --iter: #7551b8;
  --iter-soft: rgba(117, 81, 184, 0.10);
  --done: #3a8a4a;
  --done-soft: rgba(58, 138, 74, 0.10);
  --failed: #b04040;
  --failed-soft: rgba(176, 64, 64, 0.10);
  --paused: #b5751a;
  --paused-soft: rgba(181, 117, 26, 0.12);
  --queued: #2e8a80;
  --queued-soft: rgba(46, 138, 128, 0.10);
  --draft: #a8a292;

  --shadow-sm: 0 1px 2px rgba(28,25,22,0.08);
  --shadow-md: 0 12px 32px rgba(28,25,22,0.14), 0 2px 6px rgba(28,25,22,0.08);
  --shadow-lg: 0 32px 80px rgba(28,25,22,0.22), 0 4px 12px rgba(28,25,22,0.12);
  --shadow-popover: 0 2px 6px rgba(28,25,22,0.10), 0 12px 28px rgba(28,25,22,0.18);
  --shadow-overlay: var(--shadow-lg);
  --scrim: color-mix(in srgb, #1c1916 35%, transparent);
  --scrim-modal: color-mix(in srgb, #1c1916 45%, transparent);
  --scrim-drawer: color-mix(in srgb, #1c1916 30%, transparent);

  --accent-fg: #ffffff;
  --danger-fg: #ffffff;
  --danger-bg-soft: var(--failed-soft);
  --danger-border: var(--failed);
  --success-fg: #ffffff;
  --status-dark-fg: #1c1916;

  --warning-fg: #1c1208;
  --info-fg: #ffffff;
  --banner-success-fg: #0e1f0f;
  --banner-ready-fg: var(--status-dark-fg);
  --qa-thinking-fg: var(--fg-mute);
  --inverse-fg: #ffffff;
  --on-accent-fg: var(--accent-fg);

  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --qr-plate: #ffffff;
}

* { box-sizing: border-box; }

html, body, #root {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

.mono { font-family: var(--font-mono); font-feature-settings: "ss01", "cv11"; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  padding: 2px 7px; border-radius: 4px;
  background: var(--panel-2); color: var(--fg-mute);
  border: 1px solid var(--line);
  white-space: nowrap;
  flex-shrink: 0;
}
.chip-state { padding-left: 5px; }
.chip-state .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.icon-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--fg-mute); transition: background 120ms, color 120ms;
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--control-h, 32px);
  padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--line-2); color: var(--fg);
  background: var(--panel-2);
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.btn:hover:not(:disabled):not([aria-disabled="true"]):not(.btn-primary):not(.btn-danger):not(.btn-queued):not(.btn-accent) {
  background: var(--hover); border-color: var(--line-2);
}
.btn:active:not(:disabled) { transform: translateY(0.5px); }
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  color: var(--fg-faint);
}
.btn:disabled:hover { background: var(--panel); border-color: var(--line); }
.btn-primary {
  background: var(--accent); color: rgba(255,255,255,0.95); border-color: var(--accent);
  font-weight: 500;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-accent {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-mute); }
.btn-ghost:hover { background: var(--hover); color: var(--fg); }

.btn-queued {
  background: color-mix(in srgb, var(--queued) 14%, var(--panel-2));
  border-color: color-mix(in srgb, var(--queued) 45%, var(--line-2));
  color: var(--queued);
  font-weight: 500;
}
.btn-queued:hover:not(:disabled):not([aria-disabled="true"]) {
  background: color-mix(in srgb, var(--queued) 22%, var(--panel-2));
  border-color: color-mix(in srgb, var(--queued) 60%, var(--line-2));
}
.btn-queued:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.btn[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
  color: var(--fg-mute);
  background: var(--panel-2);
  border-color: var(--line);
}
.btn[aria-disabled="true"]:hover {
  background: var(--panel-2);
  border-color: var(--line);
  filter: none;
  transform: none;
}
.btn[aria-disabled="true"]:active { transform: none; }
.btn[aria-disabled="true"]:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}
.pulse { animation: pulseDot 1.6s ease-in-out infinite; }

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.3; }
}
.blink { animation: blink 1.1s steps(2) infinite; }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.9s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; }
  .pulse { animation: none; opacity: 0.85; }
  .blink { animation: none; opacity: 0.85; }
  .fade-up { animation: none; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 280ms ease-out both; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }


/* ═══════════════════════════════════════════════════════════════
   [2] src/styles/drawer.css — full file (drawer-stage / scrim /
   surface / head / body / foot canonical contract; QADrawer is
   one of the 6 callers of this shell).
   ═══════════════════════════════════════════════════════════════ */

.drawer-stage {
  position: absolute; inset: 0;
  overflow: hidden;
  z-index: var(--z-drawer, 200);
}
.drawer-stage--modal {
  position: fixed; inset: 0;
  z-index: var(--z-modal, 1000);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6, 24px);
  overflow: hidden;
}

.drawer-scrim {
  position: absolute; inset: 0;
  background: var(--scrim-drawer);
  z-index: 1;
  width: 100%; height: 100%;
  border: 0;
  cursor: pointer;
  padding: 0;
}
.drawer-stage--modal > .drawer-scrim {
  background: var(--scrim-modal);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.drawer-stage[data-blur="1"] > .drawer-scrim {
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

.drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 600px; max-width: calc(100vw - 80px);
  background: var(--bg-elevated);
  border-left: 1px solid var(--line-2);
  border-top-left-radius: var(--radius-panel);
  border-bottom-left-radius: var(--radius-panel);
  box-shadow: var(--shadow-overlay);
  display: flex; flex-direction: column;
  z-index: 2;
  animation: drawerSlide 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes drawerSlide {
  from { transform: translateX(36px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

.drawer--modal {
  position: relative;
  top: auto; right: auto; bottom: auto;
  width: 100%;
  max-width: 540px;
  max-height: calc(100dvh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel, 10px);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-overlay);
  animation: drawerModalIn 180ms ease-out both;
  overflow: hidden;
}
@keyframes drawerModalIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .drawer,
  .drawer--modal { animation: none; }
}

.drawer-head {
  flex-shrink: 0;
  position: relative;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
.drawer-crumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--fg-mute);
  min-height: 28px;
  margin-bottom: 8px;
}
.drawer-crumb .sep { color: var(--fg-faint); }
.drawer-crumb-spacer { flex: 1; }

.drawer-titlerow {
  display: flex; align-items: center; gap: 10px;
}
.drawer-title {
  margin: 0;
  font-size: 18px; font-weight: 600;
  letter-spacing: -0.015em;
  flex: 1; min-width: 0;
}
.drawer-meta,
.drawer-status-row {
  margin-top: 4px;
  font-size: 11px; color: var(--fg-mute);
  display: flex; gap: 8px; flex-wrap: wrap;
  align-items: center;
}
.drawer-meta .sep { color: var(--fg-faint); }

.drawer-close,
.drawer-head .create-x {
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center; justify-content: center;
  padding: 0;
  border-radius: var(--radius-control, 6px);
  border: 1px solid transparent;
  background: transparent;
  color: var(--fg-mute);
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.drawer-close:hover,
.drawer-head .create-x:hover {
  background: var(--hover);
  color: var(--fg);
}
.drawer-close:focus-visible,
.drawer-head .create-x:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.statechip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.drawer-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 16px 20px;
}

.drawer-foot {
  flex-shrink: 0;
  position: sticky;
  bottom: 0;
  z-index: 1;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--panel-2);
  display: flex; align-items: center; gap: 10px;
}

.drawer-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-2, 8px);
  align-items: center;
  width: 100%;
}
.drawer-actions--single {
  grid-template-columns: 1fr;
}

@media (max-width: 767.98px) {
  .drawer-scrim {
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .drawer-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    z-index: var(--z-modal, 1000);
  }
  .drawer-stage--modal {
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    align-items: center;
  }
  .drawer {
    position: fixed;
    inset: 0;
    width: 100vw;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    border-left: 0;
    border-radius: 0;
    box-shadow: none;
    animation: none;
  }
  .drawer--modal {
    position: relative;
    inset: auto;
    width: calc(100vw - 32px);
    max-width: calc(100vw - 32px);
    height: auto;
    max-height: calc(100dvh - 64px);
    border-left: 1px solid var(--line);
    border-radius: var(--radius-panel, 10px);
    box-shadow: var(--shadow-overlay);
  }
  .drawer-head {
    padding: 12px 16px;
  }
  .drawer-body {
    padding: 12px 16px;
  }
  .drawer-foot {
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .drawer-close,
  .drawer-head .create-x {
    min-width: 44px;
    min-height: 44px;
  }
}


/* ═══════════════════════════════════════════════════════════════
   [3] src/styles/board.css — subset: .vp-chip family + .ticket-mode
   (QADrawer uses .vp-chip .vp-chip--action for starter chips and
   .chip.ticket-mode for split-proposal mode chip).
   ═══════════════════════════════════════════════════════════════ */

.vp-chip,
.chip,
.status-pill,
.statechip,
.tdrw-status-chip,
.tdrw-run-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 22px;
  padding: 2px 7px;
  border-radius: var(--radius-xs, 4px);
  font: 500 11px/1.4 var(--font-mono);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--fg-mute);
  white-space: nowrap;
  box-sizing: border-box;
}
.vp-chip-dot,
.status-pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.vp-chip--success { color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, var(--line-2)); background: color-mix(in srgb, var(--done) 12%, transparent); }
.vp-chip--warning { color: var(--paused); border-color: color-mix(in srgb, var(--paused) 40%, var(--line-2)); background: color-mix(in srgb, var(--paused) 12%, transparent); }
.vp-chip--danger  { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 40%, var(--line-2)); background: color-mix(in srgb, var(--failed) 12%, transparent); }
.vp-chip--info    { color: var(--iter); border-color: color-mix(in srgb, var(--iter) 40%, var(--line-2)); background: color-mix(in srgb, var(--iter) 12%, transparent); }

.vp-chip--state,
.vp-chip--readonly {
  cursor: default;
}
.vp-chip--action {
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms, transform 80ms;
}
.vp-chip--action:hover:not(:disabled):not([aria-disabled="true"]) {
  background: var(--hover);
  border-color: var(--line);
  color: var(--fg);
}
.vp-chip--action:active:not(:disabled):not([aria-disabled="true"]) {
  transform: translateY(0.5px);
}
.vp-chip--action:disabled,
.vp-chip--action[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.48;
}
.vp-chip--toggle {
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.vp-chip--toggle[aria-pressed="true"],
.vp-chip--toggle.is-on {
  color: var(--accent);
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
// ────────────────────────────────────────────────────────────────
// QADrawer — JSX SSOT (DOM/className verbatim from
// src/features/qa/QADrawer.tsx). Stubs API calls + Overlay focus
// trap; no real fetch / portal / inert sibling logic. All states
// surfaced via the bottom-left demo panel (props injection).
//
// All shipping behaviour:
//  - 3 top-level views: bootstrap / chat / review (showReview gate)
//  - viewOverride sticky tri-state (null / "chat" / "review")
//  - SpecChecklist in head with 4 per-chip states (filled × expanded)
//  - chat body: welcome bubble + starter chips OR turns + thinking
//    + InlineMultiSelect (when last AI turn has multi options)
//  - spec-ready-bar shown when 5/5 but user is still in chat
//  - Composer: single quick-reply chips + textarea + send + cancel
//    link, busy state (lock textarea + send)
//  - close-confirm inline alert when textarea has unsent text
//  - SpecReview: 5 fields + split-proposal (when ≥2 splitInto) +
//    iter-only fields when mode=iter
//  - All copy/constant strings verbatim (zh-Hant)
// ────────────────────────────────────────────────────────────────

const { useEffect, useId, useRef, useState } = React;

// ── Constants verbatim from src/features/qa/QADrawer.tsx ────────
const FIRST_AI_MESSAGE = "描述需求、完成標準與限制條件，我會整理成需求單規格。";
const FIRST_AI_OPTIONS = [
  "建立功能需求",
  "整理錯誤回報",
  "盤點可建立的需求單",
];
const BOOTSTRAP_LABEL = "啟動需求整理";

// shared/types.ts — FIELD_LABELS (used both inline below and in checklist)
const FIELD_LABELS = [
  { key: "title", label: "標題" },
  { key: "goal", label: "目標" },
  { key: "acceptance", label: "驗收" },
  { key: "prompt", label: "提示詞" },
  { key: "mode", label: "模式" },
];

// ── Icons verbatim from src/ui/icons.tsx ────────────────────────
function ArrowRightIcon(p) {
  return (
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M5 12h14" />
      <path d="m13 6 6 6-6 6" />
    </svg>
  );
}
function CheckIconSm(p) {
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M4 12.5 9.5 18 20 6" />
    </svg>
  );
}

// ── Overlay stub — keeps stage / scrim / drawer DOM shape so all
// CSS hooks (`drawer-stage`, `drawer-scrim`, `drawer`, etc) match
// source. Drops portal + inert sibling logic (not needed for static
// preview). ESC = onRequestClose. Scrim click = onRequestClose.
function Overlay({
  role = "dialog",
  onRequestClose,
  labelledBy,
  stageClassName,
  surfaceClassName,
  children,
}) {
  const surfaceRef = useRef(null);
  useEffect(() => {
    function onKey(e) {
      if (e.key !== "Escape") return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      onRequestClose();
    }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onRequestClose]);
  return (
    <div className={"drawer-stage" + (stageClassName ? " " + stageClassName : "")}>
      <div
        className="drawer-scrim"
        onClick={onRequestClose}
        aria-hidden="true"
      />
      <div
        ref={surfaceRef}
        className={"drawer" + (surfaceClassName ? " " + surfaceClassName : "")}
        role={role}
        aria-modal="true"
        aria-labelledby={labelledBy}
        tabIndex={-1}
      >
        {children}
      </div>
    </div>
  );
}

// ── isSpecComplete: verbatim ─────────────────────────────────────
function isSpecComplete(s) {
  if (!s) return false;
  return (
    !!s.title &&
    !!s.goal &&
    Array.isArray(s.acceptance) &&
    s.acceptance.length > 0 &&
    !!s.prompt &&
    (s.mode === "step" || s.mode === "iter")
  );
}

// ── ThinkingDots: verbatim ───────────────────────────────────────
function ThinkingDots() {
  return (
    <span className="qadr-thinking-dots" aria-hidden="true">
      <span />
      <span />
      <span />
    </span>
  );
}

// ── Bubble: verbatim ────────────────────────────────────────────
function Bubble({ kind, message }) {
  return (
    <div className={"qadr-bubble qadr-bubble-" + kind}>
      <div className="qadr-bubble-role mono">{kind === "user" ? "你" : "助理"}</div>
      <div className="qadr-bubble-msg">{message}</div>
    </div>
  );
}

// ── lastAiOptions: verbatim ─────────────────────────────────────
function lastAiOptions(draft) {
  if (!draft) return { options: [], mode: "single" };
  if (draft.turns.length === 0) return { options: FIRST_AI_OPTIONS, mode: "single" };
  const last = draft.turns[draft.turns.length - 1];
  if (last.role !== "ai") return { options: [], mode: "single" };
  return { options: last.options ?? [], mode: last.optionsMode ?? "single" };
}

// ── InlineMultiSelect: verbatim ─────────────────────────────────
function InlineMultiSelect({ options, busy, onSendMulti }) {
  const [picked, setPicked] = useState(new Set());
  const sendBtnRef = useRef(null);
  const statusId = "qadr-inline-multi-status";
  useEffect(() => { setPicked(new Set()); }, [options]);
  useEffect(() => {
    const id = requestAnimationFrame(() => {
      sendBtnRef.current?.scrollIntoView({ block: "end", behavior: "auto" });
    });
    return () => cancelAnimationFrame(id);
  }, [picked.size]);

  function toggle(i) {
    setPicked((s) => {
      const next = new Set(s);
      if (next.has(i)) next.delete(i);
      else next.add(i);
      return next;
    });
  }
  function send() {
    if (busy || picked.size === 0) return;
    const chosen = Array.from(picked).sort((a, b) => a - b).map((i) => options[i]);
    onSendMulti(chosen);
    setPicked(new Set());
  }

  return (
    <div
      className="qadr-inline-multi"
      role="group"
      aria-label="多選回覆"
      aria-describedby={statusId}
    >
      <div
        className="qadr-options qadr-options-multi"
        role="group"
        aria-label="多選回覆選項"
      >
        {options.map((o, i) => {
          const checked = picked.has(i);
          return (
            <button
              key={`${i}-${o}`}
              type="button"
              role="checkbox"
              aria-checked={checked}
              className={"btn qadr-option qadr-option-multi" + (checked ? " is-picked" : "")}
              onClick={() => toggle(i)}
              disabled={busy}
            >
              <span className="qadr-option-check" aria-hidden>
                {checked ? <CheckIconSm /> : null}
              </span>
              <span>{o}</span>
            </button>
          );
        })}
      </div>
      <div id={statusId} role="status" aria-live="polite" className="qadr-multi-status">
        {picked.size === 0 ? "尚未選擇任何選項" : `已選 ${picked.size} 項`}
      </div>
      <button
        ref={sendBtnRef}
        className="btn btn-primary qadr-multi-send"
        onClick={send}
        disabled={busy || picked.size === 0}
        type="button"
      >
        送出已選（{picked.size}）
      </button>
    </div>
  );
}

// ── Composer: verbatim ──────────────────────────────────────────
function Composer({ options, optionsMode = "single", busy, onSend, onCancel, onTextChange, inputRef }) {
  const [text, setText] = useState("");
  const taRef = useRef(null);
  const setTaRef = (el) => {
    taRef.current = el;
    if (inputRef) inputRef.current = el;
  };
  const taId = "qadr-composer-textarea";

  function send(value) {
    const v = value.trim();
    if (!v || busy) return;
    onSend(v);
    setText("");
    onTextChange?.("");
    if (taRef.current) taRef.current.style.height = "auto";
  }

  return (
    <div className="qadr-composer">
      {options.length > 0 && optionsMode === "single" && (
        <div className="qadr-options">
          {options.map((o) => (
            <button
              type="button"
              key={o}
              className="btn qadr-option"
              onClick={() => send(o)}
              disabled={busy}
            >
              {o}
            </button>
          ))}
        </div>
      )}
      <div className="qadr-composer-row">
        <label
          htmlFor={taId}
          style={{
            position: "absolute",
            width: 1, height: 1, padding: 0, margin: -1,
            overflow: "hidden", clip: "rect(0,0,0,0)",
            whiteSpace: "nowrap", border: 0,
          }}
        >
          描述要建立的需求單內容
        </label>
        <textarea
          ref={setTaRef}
          id={taId}
          className="qadr-input qadr-input-multiline"
          value={text}
          placeholder={busy ? "助理回覆後即可繼續補充…" : "描述要建立的需求單內容…"}
          rows={1}
          aria-label="描述要建立的需求單內容"
          aria-describedby={busy ? "qadr-thinking-status" : undefined}
          onChange={(e) => {
            setText(e.target.value);
            onTextChange?.(e.target.value);
            const ta = e.target;
            ta.style.height = "auto";
            const max = parseFloat(getComputedStyle(ta).lineHeight) * 8;
            ta.style.height = Math.min(ta.scrollHeight, max) + "px";
          }}
          onKeyDown={(e) => {
            if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
              e.preventDefault();
              send(text);
            }
          }}
          disabled={busy}
        />
        <button
          type="button"
          className="qadr-send"
          onClick={() => send(text)}
          disabled={busy || !text.trim()}
          aria-disabled={busy || !text.trim() ? "true" : undefined}
          title={!text.trim() ? "輸入內容後可送出（Enter）" : "送出（Enter）"}
          aria-label="送出訊息"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 12h14M13 5l7 7-7 7" />
          </svg>
        </button>
      </div>
      <div className="qadr-composer-footer">
        <button
          className="qadr-cancel-link"
          onClick={onCancel}
          disabled={busy}
          type="button"
          title="放棄當前草稿，本次對話不會保留"
        >
          捨棄草稿
        </button>
        <div className="qadr-composer-hint mono" aria-hidden="true">
          Enter 送出 · Shift+Enter 換行
        </div>
      </div>
    </div>
  );
}

// ── Field: verbatim ─────────────────────────────────────────────
function Field({ label, htmlId, children }) {
  return (
    <div className="qadr-field">
      <div className="qadr-field-label" id={htmlId ? `${htmlId}-label` : undefined}>
        {label}
      </div>
      {children}
    </div>
  );
}

// ── SpecChecklist: verbatim ─────────────────────────────────────
function SpecChecklist({ spec }) {
  const [expanded, setExpanded] = useState(null);
  const filled = (key) => {
    if (!spec) return false;
    const v = spec[key];
    if (v == null || v === "") return false;
    if (Array.isArray(v) && v.length === 0) return false;
    if (key === "mode") return v === "step" || v === "iter";
    return true;
  };
  const doneCount = FIELD_LABELS.filter((f) => filled(f.key)).length;
  const expandedField = expanded ? FIELD_LABELS.find((f) => f.key === expanded) : null;
  const expandedValue = expanded && spec ? spec[expanded] : undefined;

  function toggle(key) {
    setExpanded((cur) => (cur === key ? null : key));
  }
  const baseId = useId();
  const panelId = `${baseId}-chip-panel`;
  return (
    <div className="qadr-checklist">
      <div
        className="qadr-checklist-row"
        role="group"
        aria-label={`規格進度 ${doneCount} / ${FIELD_LABELS.length}`}
      >
        {FIELD_LABELS.map((f) => {
          const isFilled = filled(f.key);
          const isOpen = expanded === f.key;
          return (
            <button
              key={f.key}
              type="button"
              className={"qadr-chip" + (isFilled ? " is-filled" : "") + (isOpen ? " is-expanded" : "")}
              title={`${f.label}・${isFilled ? "已填" : "未填"}`}
              aria-label={`${f.label}（${isFilled ? "已填" : "未填"}）`}
              aria-expanded={isOpen}
              aria-controls={isOpen ? panelId : undefined}
              onClick={() => toggle(f.key)}
            >
              <span className="qadr-chip-dot" aria-hidden />
              <span className="qadr-chip-label">{f.label}</span>
            </button>
          );
        })}
        <span className="qadr-checklist-count mono" aria-hidden>
          {doneCount}/{FIELD_LABELS.length}
        </span>
      </div>
      {expandedField && (
        <div
          className="qadr-chip-panel"
          id={panelId}
          role="region"
          aria-label={`${expandedField.label}內容`}
        >
          <div className="qadr-chip-panel-label mono">{expandedField.label}</div>
          <div className="qadr-chip-panel-value">
            {!filled(expandedField.key) ? (
              <span className="qadr-chip-panel-empty">（未填）</span>
            ) : Array.isArray(expandedValue) ? (
              <ul className="qadr-chip-panel-list">
                {expandedValue.map((v) => (
                  <li key={String(v)}>{v}</li>
                ))}
              </ul>
            ) : (
              <span>{String(expandedValue)}</span>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── SpecReview: verbatim ────────────────────────────────────────
function SpecReview({ spec, splitInto, busy, onCancel, onFinalize, onResumeChat }) {
  const [edited, setEdited] = useState(spec);
  useEffect(() => { setEdited(spec); }, [spec]);
  const hasSplit = Array.isArray(splitInto) && splitInto.length >= 2;
  const [useSplit, setUseSplit] = useState(false);
  return (
    <div className="qadr-spec">
      <div className="qadr-spec-head">最終預覽 — 微調後送出建立需求單。</div>
      {hasSplit && (
        <section className="qadr-split-proposal" aria-labelledby="qadr-split-title">
          <header className="qadr-split-header">
            <h3 id="qadr-split-title" className="qadr-split-title">
              助理評估這張需求單範圍橫跨 {splitInto.length} 件獨立工作
            </h3>
            <p className="qadr-split-subtitle">
              若拆分送出，會建立 {splitInto.length} 張獨立需求單分別執行；
              若不拆分，以下方單張 spec 為準。
            </p>
          </header>
          <ol className="qadr-split-list">
            {splitInto.map((s, i) => (
              <li key={i} className="qadr-split-item">
                <span className="qadr-split-num mono">#{i + 1}</span>
                <span className="qadr-split-item-title">{s.title}</span>
                <span className={"chip ticket-mode qadr-split-mode-chip" + (s.mode === "iter" ? " is-iter" : "")}>
                  {s.mode === "iter" ? "迭代" : "單次"}
                </span>
              </li>
            ))}
          </ol>
          <div className="qadr-split-toggle">
            <label className="qadr-split-toggle-label">
              <input
                type="checkbox"
                checked={useSplit}
                onChange={(e) => setUseSplit(e.target.checked)}
                aria-describedby="qadr-split-outcome"
              />
              <span>
                <strong>送出時拆成 {splitInto.length} 張獨立需求單</strong>
                <span className="qadr-split-toggle-hint">
                  （取消勾選 = 合 1 張下方 spec）
                </span>
              </span>
            </label>
            <div id="qadr-split-outcome" className="qadr-split-outcome" role="status" aria-live="polite">
              {useSplit
                ? `目前送出會建立 ${splitInto.length} 張獨立需求單。`
                : "目前送出會建立 1 張合併需求單（以下方 spec 為準）。"}
            </div>
          </div>
        </section>
      )}
      <Field label="標題">
        <input
          className="qadr-input"
          value={edited.title}
          onChange={(e) => setEdited({ ...edited, title: e.target.value })}
        />
      </Field>
      <Field label="目標">
        <textarea
          className="qadr-input qadr-textarea"
          rows={3}
          value={edited.goal}
          onChange={(e) => setEdited({ ...edited, goal: e.target.value })}
        />
      </Field>
      <Field label="驗收">
        <textarea
          className="qadr-input qadr-textarea"
          rows={Math.max(4, edited.acceptance.length + 1)}
          value={edited.acceptance.join("\n")}
          onChange={(e) =>
            setEdited({ ...edited, acceptance: e.target.value.split("\n").filter(Boolean) })
          }
        />
      </Field>
      <Field label="提示詞">
        <textarea
          className="qadr-input qadr-textarea"
          rows={10}
          value={edited.prompt}
          onChange={(e) => setEdited({ ...edited, prompt: e.target.value })}
        />
      </Field>
      <Field label="模式" htmlId="qadr-mode-group">
        <div className="qadr-choice-row" role="radiogroup" aria-labelledby="qadr-mode-group-label">
          <label className="qadr-radio-label">
            <input type="radio" name="qadr-mode"
              checked={edited.mode === "iter"}
              onChange={() => setEdited({ ...edited, mode: "iter" })} />
            迭代任務 (iter)
          </label>
          <label className="qadr-radio-label">
            <input type="radio" name="qadr-mode"
              checked={edited.mode === "step"}
              onChange={() => setEdited({ ...edited, mode: "step" })} />
            單次任務 (step)
          </label>
        </div>
      </Field>
      {edited.mode === "iter" && (
        <>
          <Field label="迭代上限輪數">
            <input
              className="qadr-input qadr-iter-limit-input"
              type="number"
              min={1}
              max={5}
              value={edited.iterLimit ?? 5}
              onChange={(e) => {
                const v = Math.max(1, Math.min(5, Number(e.target.value) || 5));
                setEdited({ ...edited, iterLimit: v });
              }}
            />
          </Field>
          <Field label="達上限後" htmlId="qadr-stoplimit-group">
            <div className="qadr-choice-row" role="radiogroup" aria-labelledby="qadr-stoplimit-group-label">
              <label className="qadr-radio-label">
                <input type="radio" name="qadr-iter-stop"
                  checked={(edited.iterStopAtLimit ?? true) === true}
                  onChange={() => setEdited({ ...edited, iterStopAtLimit: true })} />
                整條 pipeline 暫停 (建議)
              </label>
              <label className="qadr-radio-label">
                <input type="radio" name="qadr-iter-stop"
                  checked={(edited.iterStopAtLimit ?? true) === false}
                  onChange={() => setEdited({ ...edited, iterStopAtLimit: false })} />
                標記為失敗，跳下一張
              </label>
            </div>
          </Field>
        </>
      )}
      <div className="qadr-spec-actions">
        <button type="button" className="btn" onClick={onCancel} disabled={busy}>
          捨棄草稿
        </button>
        {onResumeChat && (
          <button
            type="button"
            className="btn"
            onClick={onResumeChat}
            disabled={busy}
            title="退回對話跟 AI 補充 / 修正細節,送出新訊息後 AI 會再整理 spec"
          >
            <ArrowRightIcon aria-hidden style={{ transform: "scaleX(-1)" }} /> 繼續討論
          </button>
        )}
        <span style={{ flex: 1 }} />
        <button
          type="button"
          className="btn btn-primary"
          onClick={() => onFinalize(edited, useSplit ? splitInto : undefined)}
          disabled={busy}
        >
          {busy ? (
            <>
              <span className="qadr-thinking-dots">
                <span /><span /><span />
              </span>{" "}
              送出中…
            </>
          ) : useSplit && hasSplit ? (
            `送出建立 ${splitInto.length} 張需求單`
          ) : hasSplit ? (
            "送出建立 1 張合併需求單"
          ) : (
            "送出建立需求單"
          )}
        </button>
      </div>
    </div>
  );
}

// ── QADrawer (main): verbatim ───────────────────────────────────
function QADrawer({ pipelineName, draft, busy, onSendTurn, onFinalize, onCancel, onClose }) {
  const transcriptRef = useRef(null);
  const drawerRef = useRef(null);
  const closeBtnRef = useRef(null);
  const composerTextRef = useRef("");
  const composerInputRef = useRef(null);
  const titleId = "qadr-title";

  const [viewOverride, setViewOverride] = useState(null);
  useEffect(() => { setViewOverride(null); }, [draft?.draftId]);

  const specComplete = isSpecComplete(draft?.spec ?? null);
  const showReview =
    specComplete &&
    (viewOverride === "review" || (draft?.complete === true && viewOverride !== "chat"));
  const hasAnyTurn = (draft?.turns.length ?? 0) > 0;

  useEffect(() => {
    if (!draft) return;
    if (showReview) return;
    const id = requestAnimationFrame(() => {
      composerInputRef.current?.focus({ preventScroll: true });
    });
    return () => cancelAnimationFrame(id);
  }, [draft?.draftId, showReview]);

  const showChecklist = !!draft && (hasAnyTurn || specComplete);

  const prevTurnsLenRef = useRef(-1);
  useEffect(() => { prevTurnsLenRef.current = -1; }, [draft?.draftId]);
  useEffect(() => {
    if (showReview) return;
    const turnsLen = draft?.turns.length ?? 0;
    const prev = prevTurnsLenRef.current;
    prevTurnsLenRef.current = turnsLen;
    const id = requestAnimationFrame(() => {
      const el = transcriptRef.current;
      if (!el) return;
      if (prev === -1) { el.scrollTo({ top: 0 }); return; }
      if (turnsLen > prev) el.scrollTo({ top: el.scrollHeight });
    });
    return () => cancelAnimationFrame(id);
  }, [draft?.turns.length, draft?.draftId, showReview]);

  const [pendingClose, setPendingClose] = useState(false);
  const pendingCancelBtnRef = useRef(null);
  const requestClose = () => {
    if (composerTextRef.current.trim().length > 0) {
      setPendingClose(true);
      return;
    }
    onClose();
  };
  useEffect(() => {
    if (!pendingClose) return;
    const id = requestAnimationFrame(() => {
      pendingCancelBtnRef.current?.focus({ preventScroll: true });
    });
    const onKey = (e) => {
      if (e.key === "Escape") {
        e.stopPropagation();
        setPendingClose(false);
      }
    };
    window.addEventListener("keydown", onKey, true);
    return () => {
      cancelAnimationFrame(id);
      window.removeEventListener("keydown", onKey, true);
    };
  }, [pendingClose]);

  return (
    <Overlay
      role="dialog"
      onRequestClose={requestClose}
      labelledBy={titleId}
      stageClassName="qadr-stage"
      surfaceClassName="qadr-drawer"
    >
      <div className="drawer-head qadr-head">
        <div className="drawer-crumb qadr-crumb">
          <span className="qadr-crumb-text">
            <span className="mono qadr-crumb-project" title={pipelineName}>
              {pipelineName}
            </span>
            <span className="sep qadr-crumb-current-sep">/</span>
            <span className="qadr-crumb-current">新需求單</span>
          </span>
          <button type="button"
            ref={closeBtnRef}
            className="drawer-close create-x"
            onClick={requestClose}
            title={hasAnyTurn ? "關閉並保留草稿（下次可接續）" : "關閉並取消空白草稿"}
            aria-label={hasAnyTurn ? "關閉並保留草稿" : "關閉並取消空白草稿"}
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div className="drawer-titlerow">
          <div className="drawer-title" id={titleId}>
            {draft?.spec?.title
              || (draft
                ? hasAnyTurn
                  ? "收斂中…"
                  : "新需求單"
                : "新需求單")}
          </div>
        </div>
        <div className="drawer-meta mono">
          <span>{draft ? `${draft.turns.length} 輪對話` : "啟動中…"}</span>
          {draft && (
            <>
              <span className="sep">·</span>
              <span
                className="qadr-draft-status"
                title={`draftId: ${draft.draftId}`}
                aria-label={hasAnyTurn ? "草稿已自動保留,關閉後可接續" : "尚未對話,關閉會自動取消空白草稿"}
              >
                {hasAnyTurn ? "草稿已自動保留" : "空白草稿"}
              </span>
            </>
          )}
        </div>
        {showChecklist && <SpecChecklist spec={draft?.spec ?? null} />}
      </div>

      {pendingClose && (
        <section
          className="qadr-close-confirm"
          role="group"
          aria-labelledby="qadr-close-confirm-msg"
        >
          <p
            id="qadr-close-confirm-msg"
            className="qadr-close-confirm-msg"
            role="status"
            aria-live="polite"
          >
            輸入框還有未送出的內容，要關閉嗎？（草稿仍會保留，下次可接續）
          </p>
          <div className="qadr-close-confirm-actions">
            <button
              ref={pendingCancelBtnRef}
              type="button"
              className="btn"
              onClick={() => setPendingClose(false)}
            >
              繼續編輯
            </button>
            <button
              type="button"
              className="btn btn-primary"
              onClick={() => {
                setPendingClose(false);
                onClose();
              }}
            >
              關閉並保留草稿
            </button>
          </div>
        </section>
      )}

      {showReview ? (
        <div className="drawer-body qadr-body qadr-spec-body">
          <SpecReview
            spec={draft.spec}
            splitInto={draft?.splitInto}
            busy={busy}
            onCancel={onCancel}
            onFinalize={onFinalize}
            onResumeChat={() => setViewOverride("chat")}
          />
        </div>
      ) : (
        <>
          {specComplete && !showReview && (
            <div className="qadr-spec-ready-bar">
              <span
                className="qadr-spec-ready-bar-text"
                role="status"
                aria-live="polite"
              >
                規格已備齊，可隨時送出建立需求單。
              </span>
              <button
                type="button"
                className="btn btn-primary qadr-spec-ready-bar-btn"
                onClick={() => setViewOverride("review")}
                disabled={busy}
              >
                查看最終預覽
                <ArrowRightIcon aria-hidden focusable="false" />
              </button>
            </div>
          )}
          <div
            className="drawer-body qadr-body"
            ref={transcriptRef}
            aria-busy={
              (!draft && busy) ||
              (draft &&
                (busy || draft.turns[draft.turns.length - 1]?.role === "user"))
                ? true
                : undefined
            }
          >
            {!draft && busy && (
              <div className="qadr-bootstrap" role="status" aria-live="polite">
                <ThinkingDots />
                <span className="qadr-bootstrap-label">{BOOTSTRAP_LABEL}</span>
                <span className="qadr-bootstrap-sub">
                  正在準備這次的需求對話，稍候即可開始描述。
                </span>
              </div>
            )}
            {draft && (() => {
              const lastTurn = draft.turns[draft.turns.length - 1];
              const waitingForAI = lastTurn?.role === "user";
              const showThinking = busy || waitingForAI;
              const emptyTurns = draft.turns.length === 0;
              const last = lastAiOptions(draft);
              const showInlineMulti =
                !emptyTurns &&
                !showThinking &&
                last.mode === "multi" &&
                last.options.length > 0;
              return (
                <>
                  <Bubble kind="ai" message={FIRST_AI_MESSAGE} />
                  {emptyTurns && (
                    <div className="qadr-empty-starter">
                      <div className="qadr-starter-label" id="qadr-starter-label">
                        快速起點（可直接點選，或在下方輸入自訂內容）
                      </div>
                      <div
                        className="qadr-suggestions"
                        role="group"
                        aria-labelledby="qadr-starter-label"
                      >
                        {FIRST_AI_OPTIONS.map((o) => (
                          <button
                            type="button"
                            key={o}
                            className="vp-chip vp-chip--action qadr-suggestion"
                            onClick={() => onSendTurn(o)}
                            disabled={busy}
                          >
                            {o}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                  {draft.turns.map((t) => (
                    <Bubble key={t.ts + ":" + t.role} kind={t.role} message={t.message} />
                  ))}
                  {showInlineMulti && (
                    <InlineMultiSelect
                      options={last.options}
                      busy={busy}
                      onSendMulti={(picks) => onSendTurn(picks.join("、"))}
                    />
                  )}
                  {showThinking && (
                    <div
                      className="qadr-loading"
                      role="status"
                      aria-live="polite"
                      id="qadr-thinking-status"
                    >
                      <span>助理思考中</span>
                      <ThinkingDots />
                    </div>
                  )}
                </>
              );
            })()}
          </div>
          {draft && (
            <div className="drawer-foot qadr-foot">
              {draft.spec && (() => {
                const missing = FIELD_LABELS.filter((f) => {
                  const v = draft.spec?.[f.key];
                  if (v == null || v === "") return true;
                  if (Array.isArray(v) && v.length === 0) return true;
                  if (f.key === "mode") return v !== "step" && v !== "iter";
                  return false;
                });
                if (missing.length === 0) return null;
                const filled = FIELD_LABELS.length - missing.length;
                const labels = missing.map((m) => m.label);
                const srSentence = `規格已完成 ${filled} / ${FIELD_LABELS.length}，待補：${labels.join("、")}。`;
                return (
                  <div
                    className="qadr-progress mono"
                    role="status"
                    aria-live="polite"
                    aria-label={srSentence}
                  >
                    <span aria-hidden="true">
                      規格 {filled}/{FIELD_LABELS.length} · 待補
                    </span>
                    {missing.map((m, i) => (
                      <span key={m.key} className="qadr-progress-missing" aria-hidden="true">
                        {m.label}
                        {i < missing.length - 1 ? "" : ""}
                      </span>
                    ))}
                  </div>
                );
              })()}
              {(() => {
                const last = lastAiOptions(draft);
                const isFirstTurn = draft.turns.length === 0;
                const composerOptions =
                  isFirstTurn || last.mode === "multi" ? [] : last.options;
                const lastTurn = draft.turns[draft.turns.length - 1];
                const waitingForAI = lastTurn?.role === "user";
                const composerBusy = busy || waitingForAI;
                return (
                  <Composer
                    options={composerOptions}
                    optionsMode={last.mode}
                    busy={composerBusy}
                    onSend={(msg) => { onSendTurn(msg); }}
                    onCancel={onCancel}
                    onTextChange={(v) => { composerTextRef.current = v; }}
                    inputRef={composerInputRef}
                  />
                );
              })()}
            </div>
          )}
        </>
      )}
    </Overlay>
  );
}

          <div className="demo-row">
            <select
              value={scenario}
              onChange={(e) => { setShowCloseConfirmDemo(false); setScenario(e.target.value); }}
            >
              <option value="bootstrap">1. bootstrap (no draft, busy)</option>
              <option value="welcome">2. welcome (empty turns + starters)</option>
              <option value="dialogSingle">3. dialog + single quick reply</option>
              <option value="dialogMulti">4. dialog + InlineMultiSelect</option>
              <option value="thinking">5. waitingForAI (助理思考中)</option>
              <option value="ready">6. spec 5/5 + ready-bar (chat view)</option>
              <option value="reviewSimple">7. review (no split)</option>
              <option value="reviewSplit">8. review + split-proposal (3)</option>
            </select>
          </div>
        </div>

        <div className="demo-section">
          <h4>Flags</h4>
          <div className="demo-row">
            <label>
              <input type="checkbox" checked={busy} onChange={(e) => setBusy(e.target.checked)} />
              busy (lock composer / actions)
            </label>
          </div>
          <div className="demo-row">
            <label>
              <input
                type="checkbox"
                checked={showCloseConfirmDemo}
                onChange={(e) => setShowCloseConfirmDemo(e.target.checked)}
                disabled={!draft}
              />
              show close-confirm inline
            </label>
          </div>
        </div>

        <div className="demo-section">
          <h4>Theme</h4>
          <div className="demo-row">
            <button
              className={"demo-btn" + (theme === "dark" ? " is-on" : "")}
              onClick={() => setTheme("dark")}
            >dark</button>
            <button
              className={"demo-btn" + (theme === "light" ? " is-on" : "")}
              onClick={() => setTheme("light")}
            >light</button>
          </div>
        </div>

        <div className="demo-section">
          <h4>Pipeline name</h4>
          <div className="demo-row">
            <input
              type="text"
              value={pipelineName}
              onChange={(e) => setPipelineName(e.target.value)}
              style={{ width: "100%" }}
            />
          </div>
        </div>

        <div className="demo-section">
          <h4>Notes</h4>
          <div style={{ fontSize: 10, color: "var(--fg-mute)", lineHeight: 1.5 }}>
            scenario 7-8 自動進 review 視圖(complete=true)。在 review 內按「繼續討論」可回 chat 視圖,
            然後若 spec 仍 5/5 會看到 ready-bar 出現(viewOverride sticky)。
          </div>
        </div>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
