/* =========================================================================
   drawer.css — verbatim from src/styles/drawer.css
   ========================================================================= */
.drawer-stage {
  position: absolute; inset: 0;
  overflow: hidden;
  z-index: var(--z-drawer, 200);
}
.drawer-stage--modal {
  position: fixed; inset: 0;
  z-index: var(--z-modal, 1000);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6, 24px);
  overflow: hidden;
}
.drawer-scrim {
  position: absolute; inset: 0;
  background: var(--scrim-drawer);
  z-index: 1;
  width: 100%; height: 100%;
  border: 0;
  cursor: pointer;
  padding: 0;
}
.drawer-stage--modal > .drawer-scrim {
  background: var(--scrim-modal);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.drawer-stage[data-blur="1"] > .drawer-scrim {
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 600px; max-width: calc(100vw - 80px);
  background: var(--bg-elevated);
  border-left: 1px solid var(--line-2);
  border-top-left-radius: var(--radius-panel);
  border-bottom-left-radius: var(--radius-panel);
  box-shadow: var(--shadow-overlay);
  display: flex; flex-direction: column;
  z-index: 2;
  animation: drawerSlide 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes drawerSlide {
  from { transform: translateX(36px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}
.drawer--modal {
  position: relative;
  top: auto; right: auto; bottom: auto;
  width: 100%;
  max-width: 540px;
  max-height: calc(100dvh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel, 10px);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-overlay);
  animation: drawerModalIn 180ms ease-out both;
  overflow: hidden;
}
@keyframes drawerModalIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .drawer,
  .drawer--modal { animation: none; }
}
.drawer-head {
  flex-shrink: 0;
  position: relative;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
.drawer-crumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--fg-mute);
  min-height: 28px;
  margin-bottom: 8px;
}
.drawer-crumb .sep { color: var(--fg-faint); }
.drawer-crumb-spacer { flex: 1; }
.drawer-titlerow { display: flex; align-items: center; gap: 10px; }
.drawer-title {
  margin: 0;
  font-size: 18px; font-weight: 600;
  letter-spacing: -0.015em;
  flex: 1; min-width: 0;
}
.drawer-meta,
.drawer-status-row {
  margin-top: 4px;
  font-size: 11px; color: var(--fg-mute);
  display: flex; gap: 8px; flex-wrap: wrap;
  align-items: center;
}
.drawer-meta .sep { color: var(--fg-faint); }
.drawer-close,
.drawer-head .create-x {
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center; justify-content: center;
  padding: 0;
  border-radius: var(--radius-control, 6px);
  border: 1px solid transparent;
  background: transparent;
  color: var(--fg-mute);
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.drawer-close:hover,
.drawer-head .create-x:hover {
  background: var(--hover);
  color: var(--fg);
}
.drawer-close:focus-visible,
.drawer-head .create-x:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.statechip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.drawer-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 16px 20px;
}
.drawer-foot {
  flex-shrink: 0;
  position: sticky;
  bottom: 0;
  z-index: 1;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--panel-2);
  display: flex; align-items: center; gap: 10px;
}
.drawer-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-2, 8px);
  align-items: center;
  width: 100%;
}
.drawer-actions--single { grid-template-columns: 1fr; }
.kbd-inline {
  font-family: var(--font-mono); font-size: 10px;
  padding: 1px 5px; border-radius: 3px;
  border: 1px solid var(--line-2);
  color: var(--fg-mute);
}
@media (max-width: 767.98px) {
  .drawer-scrim {
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .drawer-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    z-index: var(--z-modal, 1000);
  }
  .drawer-stage--modal {
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    align-items: center;
  }
  .drawer {
    position: fixed;
    inset: 0;
    width: 100vw;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    border-left: 0;
    border-radius: 0;
    box-shadow: none;
    animation: none;
  }
  .drawer--modal {
    position: relative;
    inset: auto;
    width: calc(100vw - 32px);
    max-width: calc(100vw - 32px);
    height: auto;
    max-height: calc(100dvh - 64px);
    border-left: 1px solid var(--line);
    border-radius: var(--radius-panel, 10px);
    box-shadow: var(--shadow-overlay);
  }
  .drawer-head { padding: 12px 16px; }
  .drawer-body { padding: 12px 16px; }
  .drawer-foot {
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .drawer-close,
  .drawer-head .create-x {
    min-width: 44px;
    min-height: 44px;
  }
}

   ========================================================================= */
.audit-toggle {
  background: transparent;
  border: 0;
  cursor: pointer;
  color: inherit;
  font: inherit;
  text-align: left;
  display: flex;
  align-items: center;
  gap: var(--space-2, 8px);
  min-height: 44px;
  padding: var(--space-2, 8px) 0;
  width: 100%;
}
.audit-toggle-label { flex: 0 0 auto; }
.audit-chev {
  display: inline-flex;
  align-items: center;
  width: 12px;
  color: var(--fg-mute);
  transform: rotate(-90deg);
  transition: transform 120ms ease;
}
.audit-chev[data-open] { transform: rotate(0deg); }
.audit-count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 var(--space-2, 6px);
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--fg-mute);
  font-weight: 500;
  line-height: 1;
}
.audit-count-badge[data-empty] {
  background: transparent;
  border-style: dashed;
  color: var(--fg-faint);
}
.audit-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2, 6px);
  margin-top: var(--space-1, 4px);
  list-style: none;
  padding: 0;
  margin: var(--space-1, 4px) 0 0 0;
}
.audit-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-1, 4px) var(--space-3, 10px);
  padding: var(--space-2, 6px) var(--space-3, 8px);
  border-radius: 6px;
  background: var(--panel-2, transparent);
  border: 1px solid var(--line-faint, var(--line));
  font-size: 12px;
}
.audit-ts { color: var(--fg-mute); white-space: nowrap; }
.audit-states {
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  gap: var(--space-2, 6px);
}
.audit-from { color: var(--fg-mute); }
.audit-arrow {
  display: inline-flex;
  align-items: center;
  color: var(--fg-faint);
}
.audit-to { color: var(--fg); }
.audit-source-line {
  grid-column: 1 / span 2;
  color: var(--fg-mute);
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.audit-source { color: var(--accent, var(--fg-mute)); }
.audit-detail {
  margin-left: var(--space-2, 6px);
  color: var(--fg-faint);
}
.audit-empty-state {
  display: flex;
  flex-direction: column;
  gap: var(--space-1, 4px);

.audit-empty-title { color: var(--fg); font-size: 13px; font-weight: 500; }
.audit-empty-hint { color: var(--fg-mute); font-size: 12px; line-height: 1.55; }

  color: var(--fg-mute);
  font-size: 11.5px;
  margin: var(--space-2, 8px) 0 var(--space-1, 4px) 0;
}
.audit-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

<script type="text/babel" data-presets="env,react">
/* ── Component code (synced with ticketdrawer.jsx SSOT) ── */

const { useState, useEffect, useId, useRef, useMemo } = React;

// ─── Icon set (verbatim from src/ui/icons.tsx) ───
const RefreshIcon = (p) => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>

);
const ScissorsIcon = (p) => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>

    <circle cx="6" cy="18" r="3" />
    <path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12" />
  </svg>
);
const TrashIcon = (p) => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
    <path d="M10 11v6M14 11v6" />
  </svg>
);
const ChevronIcon = (p) => (
  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="m6 9 6 6 6-6" />
  </svg>
);
const ArrowRightIcon = (p) => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M5 12h14" />
    <path d="m13 6 6 6-6 6" />
  </svg>
);
const WarnIcon = (p) => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M12 3 2 21h20L12 3Z" />
    <path d="M12 9v5" />
    <circle cx="12" cy="17.5" r="0.8" fill="currentColor" />
  </svg>
);

// ─── Const dictionaries (verbatim from shared/types.ts + src/data/pipelines.ts) ───
const MODE_LABELS = {
  iter: "迭代任務",
  step: "單次任務",
  merge: "AI 合併",
  sync: "AI 同步",
};
const TICKET_STATUS_LABEL = {
  draft: "未執行",
  ready: "未執行",
  running: "執行中",
  paused: "暫停",
  done: "完成",
  failed: "失敗",
  failed_iter_limit: "達 iter 上限",
  failed_transient: "暫時錯誤",
};
const STATE_COLOR = {
  paused: "var(--paused)",
  running: "var(--running)",
  queued: "var(--queued)",
  ready: "var(--done)",
  planning: "var(--draft)",
  failed: "var(--failed)",
  merged: "var(--fg-faint)",
  done: "var(--done)",
  draft: "var(--draft)",
  failed_iter_limit: "var(--failed)",
  failed_transient: "var(--failed)",
};
const STATE_ARIA_LABELS = {
  planning: "規劃中",
  queued: "排隊中",
  running: "執行中",
  paused: "已暫停",
  ready: "可合併",
  failed: "失敗",
  merged: "已合併",
  done: "完成",
  draft: "草稿",
};
const SOURCE_LABEL = {
  "user-action": "使用者操作",
  "api-handler-explicit": "API 明確指定",
  "runner-self-detected": "Runner 自動偵測",
  "orchestrator.spawnDirect": "Orchestrator 啟動",
  "ticketWatcher-detected": "Ticket Watcher 偵測",
};
const DETAIL_LABELS = {
  "stop button": "停止按鈕",
  resume: "繼續執行",
  "iter_stop_at_limit": "已達 iter 上限",
  "iter_limit": "已達 iter 上限",
  "iter_limit_reached": "已達 iter 上限",
  "pipeline created": "Pipeline 建立",
  "all tickets done": "所有 ticket 完成",
  "click 合併入 main": "點擊「合併入 main」",
  "tickets added (3)": "新增 3 張 ticket",
  "QA draft created": "建立 QA 草稿",
  "QA draft promoted": "QA 草稿轉正",
  "ticket 2 started": "ticket 2 開始執行",
};
function localizeDetail(raw) {
  if (!raw) return raw;
  return DETAIL_LABELS[raw] ?? raw;
}
function ariaState(s) { return STATE_ARIA_LABELS[s.toLowerCase()] ?? s; }

function fmtElapsed(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}
function normalizeVerdict(v) {
  if (v == null) return "UNKNOWN";
  const k = typeof v === "string" ? v.toUpperCase() : String(v);
  if (k === "PASS" || k === "1") return "PASS";
  if (k === "FAIL" || k === "-1") return "FAIL";
  if (k === "PARTIAL" || k === "0") return "PARTIAL";
  return "UNKNOWN";
}
function fmtTimeShort(ms) {
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtTime(ms) {
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function isTerminalStatus(s) {
  return s === "done" || s === "failed" || s === "failed_iter_limit" || s === "failed_transient";
}
function isModeToggleable(t) {
  if (t.mode !== "step" && t.mode !== "iter") return false;
  return t.status === "draft" || t.status === "ready";
}
function isSplittable(t) {
  if (t.mode === "merge" || t.mode === "sync") return false;
  return t.status === "draft" || t.status === "ready";
}
function isDeletable(t) {
  if (t.mode === "merge" || t.mode === "sync") return false;
  return t.status !== "running";
}

function Overlay({
  role = "dialog",
  onRequestClose,
  labelledBy,
  describedBy,
  stageClassName,
  surfaceClassName,
  scrimClassName,
  children,
}) {
  const surfaceRef = useRef(null);
  useEffect(() => {
    function onKey(e) {
      if (e.key !== "Escape") return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      onRequestClose();
    }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onRequestClose]);
  return (
    <div className={"drawer-stage" + (stageClassName ? " " + stageClassName : "")}>
      <div
        className={"drawer-scrim" + (scrimClassName ? " " + scrimClassName : "")}
        onClick={onRequestClose}
        aria-hidden="true"
      />
      <div
        ref={surfaceRef}
        className={"drawer" + (surfaceClassName ? " " + surfaceClassName : "")}
        role={role}
        aria-modal="true"
        aria-labelledby={labelledBy}
        aria-describedby={describedBy}
        tabIndex={-1}
      >
        {children}
      </div>
    </div>
  );
}

function NumberField({
  label, hint, error, value, onChange,
  min, max, step,
  fieldClassName, inputClassName, labelHidden,
  onBlur, onKeyDown, title, ariaLabel,
}) {
  const reactId = useId();
  const id = `vp-field-${reactId.replace(/[^a-z0-9]/gi, "")}`;
  const describedId = error || hint ? `${id}-desc` : undefined;
  const describedText = error ?? hint;
  return (
    <div className={"form-field" + (fieldClassName ? ` ${fieldClassName}` : "")}>
      <label htmlFor={id} className={"form-label" + (labelHidden ? " form-label--sr" : "")}>
        <span>{label}</span>
      </label>
      <input
        id={id}
        type="number"
        inputMode="numeric"
        className={"form-input" + (inputClassName ? ` ${inputClassName}` : "")}
        value={value === "" ? "" : String(value)}
        onChange={(e) => {
          const raw = e.target.value;
          if (raw === "") { onChange(""); return; }
          const n = Number(raw);
          if (Number.isNaN(n)) return;
          onChange(n);
        }}
        aria-invalid={error ? true : undefined}
        aria-describedby={describedId}
        min={min}
        max={max}
        step={step}
        onBlur={onBlur}
        onKeyDown={onKeyDown}
        title={title}
        aria-label={ariaLabel}
      />
      {describedText !== undefined && describedText !== null && describedText !== "" && (
        <div id={describedId} className={"form-hint" + (error ? " form-hint--error" : "")}>
          {describedText}
        </div>
      )}
    </div>
  );
}

function ConfirmDialog({ open, opts, onResult }) {
  const titleId = useId();
  const descId = useId();
  if (!open || !opts) return null;
  return (
    <Overlay
      role={opts.danger ? "alertdialog" : "dialog"}
      onRequestClose={() => { if (!opts.danger) onResult("cancel"); }}
      labelledBy={titleId}
      describedBy={opts.description ? descId : undefined}
      stageClassName="drawer-stage--modal confirm-stage"
      scrimClassName="confirm-scrim"
      surfaceClassName="drawer--modal confirm-card fade-up"
    >
      <div id={titleId} className="confirm-title">{opts.title}</div>
      {opts.warning && (
        <div className="confirm-warning">
          <span className="confirm-warning-icon" aria-hidden><WarnIcon /></span>
          <span className="confirm-warning-text">{opts.warning}</span>
        </div>
      )}
      {opts.description && (
        <div id={descId} className="confirm-desc">{opts.description}</div>
      )}
      <div className="confirm-actions">
        <button
          type="button"
          className={"btn confirm-cancel" + (opts.danger ? " confirm-cancel--autofocused" : "")}
          onClick={() => onResult("cancel")}
        >
          {opts.cancelLabel ?? "取消"}
        </button>
        <button
          type="button"
          className={"btn " + (opts.danger ? "btn-danger" : "btn-primary")}
          onClick={() => onResult("confirm")}
        >
          {opts.confirmLabel ?? "確認"}
          {!opts.danger && (
            <>
              <span className="kbd-inline mono" aria-hidden="true">↵</span>
              <span className="sr-only">(按 Enter 鍵確認)</span>
            </>
          )}
        </button>
      </div>
    </Overlay>
  );
}

function AuditTimeline({ entries, defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  const panelId = useId();
  const countDisplay = entries === null ? "···" : String(entries.length);
  return (
    <div className="tdrw-section">
      <button
        type="button"
        className="audit-toggle tdrw-section-label"
        onClick={() => setOpen((v) => !v)}
        aria-expanded={open}
        aria-controls={panelId}
      >
        <span className="audit-chev" aria-hidden data-open={open || undefined}>
          <ChevronIcon />
        </span>
        <span className="audit-toggle-label">狀態變動歷史</span>
        <span
          className="audit-count-badge"
          aria-label={entries == null ? "載入中" : `共 ${entries.length} 筆`}
          data-empty={entries?.length === 0 || undefined}
        >
          {countDisplay}
        </span>
      </button>
      {open && (
        <div className="tdrw-section-body" id={panelId} role="region" aria-label="狀態變動歷史">
          {entries === null && (
            <div className="tdrw-empty" role="status" aria-live="polite">
              載入狀態變動歷史中…
            </div>
          )}
          {entries && entries.length === 0 && (
            <div className="audit-empty-state" role="status" aria-live="polite">
              <div className="audit-empty-title">尚無狀態變動</div>
              <div className="audit-empty-hint">
                這個 pipeline 還沒發生過狀態變更(例如:從「規劃中」進入「執行中」、或從「可合併」進入「已合併」)。
              </div>
            </div>
          )}
          {entries && entries.length > 0 && (
            <>
              <div className="audit-sort-hint">
                共 {entries.length} 筆 · 依時間由新到舊
              </div>
              <ol className="audit-list" role="list">
                {entries.map((e, i) => (
                  <AuditRow key={`${e.ts}-${i}`} entry={e} />
                ))}
              </ol>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function AuditRow({ entry }) {
  const srcLabel = SOURCE_LABEL[entry.source] ?? entry.source;
  const detailLabel = localizeDetail(entry.sourceDetail);
  const ariaLabel = `${fmtTime(entry.ts)}:由「${ariaState(entry.from)}」變為「${ariaState(entry.to)}」,來源 ${srcLabel}${detailLabel ? `(${detailLabel})` : ""}`;
  return (
    <li className="audit-row" role="listitem" aria-label={ariaLabel}>
      <span className="audit-ts mono" aria-hidden>{fmtTime(entry.ts)}</span>
      <span className="audit-states" aria-hidden>
        <span className="audit-from mono">{entry.from}</span>
        <span className="audit-arrow" aria-hidden>
          <ArrowRightIcon />
        </span>
        <span className="audit-to mono">{entry.to}</span>
      </span>
      <span className="audit-source-line" aria-hidden>
        <span className="audit-source" title={entry.source}>{srcLabel}</span>
        {detailLabel && (
          <span
            className={DETAIL_LABELS[entry.sourceDetail ?? ""] ? "audit-detail" : "audit-detail mono"}
            title={entry.sourceDetail !== detailLabel ? entry.sourceDetail : undefined}
          >
            {" · "}{detailLabel}
          </span>
        )}
      </span>
    </li>
  );
}

function Section({ label, children }) {
  return (
    <div className="tdrw-section">
      <div className="tdrw-section-label tdrw-section-title mono">{label}</div>
      <div className="tdrw-section-body">{children}</div>
    </div>
  );
}
function ReadOnlyValue({ value }) {
  if (!value) return <span className="tdrw-empty">(空)</span>;
  return <div className="tdrw-text">{value}</div>;
}

function CollapsiblePrompt({ text, defaultCollapsed = false }) {
  const LONG = 400;
  const isLong = text.length > LONG;
  const shouldCollapse = isLong || defaultCollapsed;
  const [expanded, setExpanded] = useState(!shouldCollapse);
  const collapsed = shouldCollapse && !expanded;
  return (
    <div className="tdrw-prompt-collapse">
      {shouldCollapse && collapsed && (
        <span className="sr-only">
          提示詞目前為視覺折疊預覽,共 {text.length} 字,可按下「展開全部」查看完整內容。
        </span>
      )}
      <div
        inert={collapsed ? "" : undefined}
        className={"tdrw-prompt-md" + (collapsed ? " is-collapsed" : "")}
      >
        <p style={{whiteSpace:'pre-wrap', margin:0}}>{text}</p>
        {collapsed && <div className="tdrw-prompt-fade" aria-hidden />}
      </div>
      {shouldCollapse && (
        <button
          type="button"
          className="tdrw-prompt-toggle"
          onClick={() => setExpanded((v) => !v)}
          aria-expanded={expanded}
          aria-label={
            expanded
              ? `收合提示詞,共 ${text.length} 字`
              : `展開提示詞,共 ${text.length} 字(目前折疊預覽)`
          }
        >
          {expanded ? "收合" : `展開全部 · 共 ${text.length} 字`}
        </button>
      )}

  );
}

function IterRounds({ rounds }) {
  return (
    <div className="tdrw-iter-rounds">
      {rounds.map((r) => {
        const n = normalizeVerdict(r.criticVerdict);
        const cls = n === "PASS" ? "is-pass" : n === "FAIL" ? "is-fail" : "is-partial";
        const verdictLabel = n === "PASS" ? "通過" : n === "FAIL" ? "失敗" : r.criticVerdict;
        const dur =
          r.endedAt && r.startedAt
            ? fmtElapsed(Math.round((r.endedAt - r.startedAt) / 1000))
            : "—";
        return (
          <div key={r.n} className="tdrw-iter-round">
            <div className="tdrw-iter-round-head">
              <span className="mono tdrw-iter-round-n">#{r.n}</span>
              <span
                className={"tdrw-iter-verdict " + cls}
                title={r.criticVerdict}
                aria-label={`審核結果 ${verdictLabel}(原值 ${r.criticVerdict})`}
              >
                {verdictLabel}
              </span>
              <span className="mono tdrw-iter-round-dur">{dur}</span>
            </div>
            {r.executorSummary && (
              <div className="tdrw-iter-round-block">
                <div className="tdrw-iter-round-label">執行 AI 摘要</div>
                <div className="tdrw-text">{r.executorSummary}</div>
              </div>
            )}
            <div className="tdrw-iter-round-block">
              <div className="tdrw-iter-round-label">審核 AI 回饋</div>
              {r.criticFeedback ? (
                <div className="tdrw-text">{r.criticFeedback}</div>
              ) : (
                <div className="tdrw-text tdrw-feedback-empty">
                  {n === "PASS" ? "(通過,無補充意見)" : "(無 feedback)"}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Commits({ commits }) {
  const [copied, setCopied] = useState(null);
  useEffect(() => {
    if (!copied) return;
    const id = setTimeout(() => setCopied(null), 1500);
    return () => clearTimeout(id);
  }, [copied]);
  const liveMsg = copied ? `已複製完整 commit hash ${copied.hash} 到剪貼簿` : "";
  async function copy(hash) {
    try {
      await navigator.clipboard.writeText(hash);
      setCopied({ hash, nonce: Date.now() });
    } catch {
      const ta = document.createElement("textarea");
      ta.value = hash;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); setCopied({ hash, nonce: Date.now() }); } catch {}
      document.body.removeChild(ta);
    }
  }
  return (
    <div className="tdrw-commits">
      <span className="sr-only" role="status" aria-live="polite">{liveMsg}</span>
      {commits.map((c) => {
        const isCopied = copied?.hash === c.hash;
        const shortHash = c.hash.slice(0, 7);
        return (
          <div key={c.hash} className="tdrw-commit">
            <button type="button"
              className={"mono tdrw-commit-hash tdrw-commit-hash-btn" + (isCopied ? " is-copied" : "")}
              title={isCopied ? `已複製完整 commit hash:${c.hash}` : `點擊複製完整 commit hash:${c.hash}`}
              aria-label={`複製完整 commit hash ${c.hash}`}
              onClick={() => copy(c.hash)}
            >
              {shortHash}
              <span
                className="tdrw-commit-copied"
                aria-hidden="true"
                data-visible={isCopied || undefined}
                key={isCopied ? copied.nonce : "idle"}
              >
                已複製完整 hash
              </span>
            </button>
            <span className="tdrw-commit-subject">{c.subject}</span>
            <span className="mono tdrw-commit-ts">{fmtTimeShort(c.ts)}</span>
          </div>
        );
      })}
    </div>
  );
}

function IterLimitField({ ticket, value, onChange }) {
  const editable =
    !!onChange &&
    ticket.mode === "iter" &&
    (ticket.status === "draft" || ticket.status === "ready");
  const [draft, setDraft] = useState(String(value));
  useEffect(() => { setDraft(String(value)); }, [value]);
  if (!editable) {
    return <span>上限 {value} 輪</span>;
  }
  const draftNum = Number(draft);
  const invalid =
    draft === "" || !Number.isFinite(draftNum) || draftNum < 1 || draftNum > 5 || !Number.isInteger(draftNum);
  function commit() {
    if (invalid) return;
    if (draftNum !== value) onChange?.(ticket.id, draftNum);
  }
  return (
    <span className={"tdrw-iter-limit-wrap" + (invalid ? " is-invalid" : "")}>
      <span className="tdrw-iter-limit-label">上限</span>
      <NumberField
        label="迭代上限輪數"
        labelHidden
        ariaLabel="迭代上限輪數(1 至 5)"
        title="迭代上限輪數,範圍 1 至 5。按 Enter 送出,按 Esc 還原"
        min={1}
        max={5}
        value={draft === "" ? "" : Number(draft)}
        onChange={(v) => setDraft(v === "" ? "" : String(v))}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === "Enter") { e.stopPropagation(); e.target.blur(); }
          if (e.key === "Escape") {
            e.stopPropagation();
            setDraft(String(value));
            e.target.blur();
          }
        }}
        error={invalid ? "請輸入 1 至 5 的整數。按 Esc 還原" : undefined}
        fieldClassName="tdrw-iter-limit-field"
        inputClassName={"tdrw-iter-limit" + (invalid ? " is-invalid" : "")}
      />
      <span className="tdrw-iter-limit-unit">輪(1 至 5)</span>
    </span>
  );
}

function TicketDrawer({
  ticket,
  pipelineName,
  pipelineBranch,
  pipelineId,
  projectHash,
  auditEntries,
  isSplitting = false,
  onClose,
  onResetTicket,
  onSplitTicket,
  onDeleteTicket,
  onToggleMode,
  onChangeIterLimit,
  onRequestConfirm,
}) {
  const [splitPending, setSplitPending] = useState(false);
  const titleId = useId();
  const splitConfirmId = useId();
  const splitConfirmTitleId = useId();
  const splitConfirmDescId = useId();
  const splitTriggerRef = useRef(null);
  const splitCancelRef = useRef(null);
  useEffect(() => {
    if (splitPending) {
      requestAnimationFrame(() => splitCancelRef.current?.focus());
    } else {
      const t = splitTriggerRef.current;
      if (t && document.contains(t)) requestAnimationFrame(() => t.focus());
    }
  }, [splitPending]);
  const [resetPending, setResetPending] = useState(false);
  const [deletePending, setDeletePending] = useState(false);
  useEffect(() => {
    if (isSplitting) setSplitPending(false);
  }, [isSplitting]);
  function handleRequestClose() {
    if (splitPending) { setSplitPending(false); return; }
    onClose();
  }

  const accent = STATE_COLOR[ticket.status] || "var(--fg-mute)";
  const statusLabel = TICKET_STATUS_LABEL[ticket.status] || ticket.status;
  const modeLabel = MODE_LABELS[ticket.mode] ?? ticket.mode;
  const spec = ticket;
  const isDone = ticket.status === "done";
  const iterLimit = spec.iterLimit ?? 5;
  const iterCurrent = ticket.iter?.current ?? 0;

  const specSections = (
    <>
      <Section label="目標">
        <ReadOnlyValue value={spec.goal} />
      </Section>
      <Section label="驗收">
        {Array.isArray(spec.acceptance) && spec.acceptance.length > 0 ? (
          <ul className="tdrw-list">
            {spec.acceptance.map((a) => (<li key={a}>{a}</li>))}
          </ul>
        ) : (<ReadOnlyValue value={undefined} />)}
      </Section>
      <Section label="提示詞">
        {spec.prompt ? (
          <CollapsiblePrompt text={spec.prompt} defaultCollapsed={isDone} />
        ) : (<span className="tdrw-empty">(空)</span>)}
      </Section>
    </>
  );
  const outcomeSections = (
    <>
      {ticket.iter && (
        <Section label="迭代輪次">
          <div
            className="mono tdrw-iter-summary"
            style={{
              marginBottom: ticket.iter.rounds && ticket.iter.rounds.length > 0 ? 10 : 0,
            }}
          >
            第 {ticket.iter.current} 輪 · {ticket.iter.verdicts.length} 次審核
          </div>
          {ticket.iter.rounds && ticket.iter.rounds.length > 0 && (
            <IterRounds rounds={ticket.iter.rounds} />
          )}
        </Section>
      )}
      {ticket.commits && ticket.commits.length > 0 && (
        <Section label="commit 紀錄">
          <Commits commits={ticket.commits} />
        </Section>
      )}
      {ticket.liveLog && (
        <Section label="即時日誌">
          <pre className="tdrw-prompt" role="log" aria-live="polite" aria-atomic="false">
            {ticket.liveLog}
          </pre>
        </Section>
      )}
      {ticket.reason && (
        <Section label="原因說明">
          <ReadOnlyValue value={ticket.reason} />
        </Section>
      )}
    </>
  );

  const showActions =
    (onResetTicket || onSplitTicket || onDeleteTicket) &&
    (isTerminalStatus(ticket.status) || isSplittable(ticket) || isDeletable(ticket));

  return (
    <Overlay
      role="dialog"
      onRequestClose={handleRequestClose}
      labelledBy={titleId}
      stageClassName="tdrw-stage"
      surfaceClassName={"tdrw-drawer" + (splitPending ? " has-split-confirm" : "")}
    >
      <div className="drawer-head tdrw-head">
        <div className="drawer-crumb tdrw-breadcrumb">
          <span className="mono">{pipelineName}</span>
          <span className="sep" style={{ color: "var(--fg-faint)" }}>›</span>
          {pipelineBranch && (
            <>
              <span className="mono tdrw-crumb-branch" title={`pipeline branch:${pipelineBranch}`}>
                {pipelineBranch}
              </span>
              <span className="sep" style={{ color: "var(--fg-faint)" }}>›</span>
            </>
          )}
          <span className="mono" style={{ color: "var(--fg-mute)" }}>
            Ticket #{String(ticket.n).padStart(2, "0")}
          </span>
          <span className="drawer-crumb-spacer" />
          <button type="button"
            className="create-x tdrw-close"
            onClick={handleRequestClose}
            title="關閉 (Esc)"
            aria-label="關閉 ticket drawer"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" aria-hidden>
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div className="tdrw-mobile-context" aria-hidden="true">
          <span className="mono tdrw-mobile-context-pipeline" title={pipelineName}>
            pipeline/{pipelineName}
          </span>
          <span className="tdrw-mobile-context-sep">·</span>
          <span className="mono tdrw-mobile-context-ticket">
            Ticket #{String(ticket.n).padStart(2, "0")}
          </span>
        </div>
        <div className="drawer-titlerow tdrw-titlerow">
          <div className="drawer-title tdrw-title" id={titleId}>{ticket.title}</div>
        </div>
        <div className="drawer-meta tdrw-status-row mono">
          <span
            className="tdrw-status-chip tdrw-status-pill"
            style={{
              color: accent,
              background: `color-mix(in srgb, ${accent} 14%, transparent)`,
              borderColor: `color-mix(in srgb, ${accent} 35%, transparent)`,
            }}
          >
            <span className="dot" style={{ background: accent }} />
            {statusLabel}
          </span>
          {(() => {
            const canToggle =
              onToggleMode && (ticket.mode === "step" || ticket.mode === "iter") && isModeToggleable(ticket);
            const next = ticket.mode === "iter" ? "step" : "iter";
            const isIter = ticket.mode === "iter";
            const iterFieldEditable =
              isIter && !!onChangeIterLimit && (ticket.status === "draft" || ticket.status === "ready");
            const iterSuffix = isIter
              ? (isDone || ticket.iter
                ? ` · 已跑 ${iterCurrent}/${iterLimit} 輪`
                : iterFieldEditable
                  ? ""
                  : ` · 上限 ${iterLimit} 輪`)
              : "";
            const baseLabel = `${modeLabel}${iterSuffix}`;
            const className =
              "tdrw-meta-chip ticket-mode" +
              (isIter ? " is-iter" : "") +
              (canToggle ? " is-toggle" : "");
            const label = canToggle ? `${baseLabel} ⇄` : baseLabel;
            const title = canToggle
              ? `點擊切換為 ${next === "iter" ? "迭代任務" : "單次任務"}`
              : ticket.mode === "merge" || ticket.mode === "sync"
              ? "synthetic ticket 不可切 mode"
              : "ticket 已跑過 / 在跑,不可切 mode";
            if (canToggle) {
              return (
                <button
                  type="button"
                  className={className}
                  onClick={() => onToggleMode?.(ticket.id, next)}
                  title={title}
                  aria-pressed={isIter}
                  aria-label={`目前 ${baseLabel}。點擊切換為 ${next === "iter" ? "迭代任務" : "單次任務"}`}
                  style={{ cursor: "pointer" }}
                >
                  {label}
                </button>
              );
            }
            return (
              <span
                className={className}
                title={title}
                role="text"
                aria-label={`${baseLabel}(無法切換:${title})`}
              >
                {baseLabel}
              </span>
            );
          })()}
          {ticket.mode === "iter" && onChangeIterLimit && (ticket.status === "draft" || ticket.status === "ready") && (
            <IterLimitField
              ticket={ticket}
              value={iterLimit}
              onChange={onChangeIterLimit}
            />
          )}
        </div>
      </div>

      <div className="drawer-body tdrw-body">
        {isDone ? (
          <>{outcomeSections}{specSections}</>
        ) : (
          <>{specSections}{outcomeSections}</>
        )}
        <AuditTimeline entries={auditEntries} defaultOpen={false} />
      </div>

      {showActions && (
        isSplitting ? (
          <div
            className="tdrw-footer tdrw-actions-running"
            role="status"
            aria-live="polite"
            aria-busy="true"
          >
            <span className="tdrw-spinner" aria-hidden />
            <span className="tdrw-running-label">AI 拆分中…(約 10-30 秒)</span>
          </div>
        ) : splitPending && onSplitTicket && isSplittable(ticket) ? (
          <div
            id={splitConfirmId}
            className="tdrw-footer tdrw-split-confirm"
            role="alertdialog"
            aria-modal="false"
            aria-labelledby={splitConfirmTitleId}
            aria-describedby={splitConfirmDescId}
          >
            <div className="tdrw-split-confirm-head">
              <ScissorsIcon className="tdrw-split-confirm-icon" aria-hidden="true" />
              <div id={splitConfirmTitleId} className="tdrw-split-confirm-title">
                以 AI 拆分並取代這張 ticket
              </div>
            </div>
            <div id={splitConfirmDescId} className="tdrw-split-confirm-desc">
              原 ticket 會被 AI 產生的新 tickets 取代;若 AI 判斷不需拆分則維持原樣。
              執行約 10–30 秒,期間 pipeline 暫不可動。
            </div>
            <div className="tdrw-split-confirm-actions">
              <button
                ref={splitCancelRef}
                type="button"
                className="tdrw-action"
                onClick={() => setSplitPending(false)}
              >
                取消
              </button>
              <button
                type="button"
                className="tdrw-action tdrw-action-danger tdrw-split-confirm-cta"
                onClick={() => {
                  setSplitPending(false);
                  onSplitTicket(ticket.id);
                }}
              >
                <ScissorsIcon aria-hidden="true" /> 拆分並取代原 ticket
              </button>
            </div>
          </div>
        ) : (
          <div className="tdrw-footer tdrw-actions">
            <div className="tdrw-actions-primary">
              {onResetTicket && isTerminalStatus(ticket.status) && (
                <button type="button"
                  className="tdrw-action"
                  disabled={resetPending}
                  aria-busy={resetPending || undefined}
                  aria-label="重開 ticket 並清除目前執行狀態"
                  onClick={async () => {
                    if (resetPending) return;
                    setResetPending(true);
                    const ok = await onRequestConfirm({
                      title: `重開 ticket「${ticket.title}」?`,
                      description:
                        `會清掉:迭代輪次 / 審核結果 / commit 紀錄;但 worktree 內已 commit 的程式碼會留著。\n` +
                        `下次執行 pipeline 會重新跑這張(可能再產生新 commit)。`,
                      confirmLabel: "重開 ticket",
                      danger: true,
                    });
                    if (ok) await onResetTicket(ticket.id);
                    setResetPending(false);
                  }}
                >
                  <RefreshIcon aria-hidden="true" /> 重開 ticket
                </button>
              )}
              {onSplitTicket && isSplittable(ticket) && (
                <button type="button"
                  ref={splitTriggerRef}
                  className="tdrw-action"
                  onClick={() => setSplitPending(true)}
                  title="點擊後會先顯示確認卡,不會立即拆分"
                  aria-label="AI 拆分,點擊後出現確認步驟"
                  aria-haspopup="dialog"
                  aria-controls={splitConfirmId}
                  aria-expanded={splitPending}
                >
                  <ScissorsIcon aria-hidden="true" /> AI 拆分…
                </button>
              )}
            </div>
            {onDeleteTicket && isDeletable(ticket) && (
              <button type="button"
                className="tdrw-action tdrw-action-danger tdrw-delete-btn tdrw-delete-icon"
                disabled={deletePending}
                aria-busy={deletePending || undefined}
                aria-label={`刪除 ticket「${ticket.title}」`}
                title="刪除 ticket"
                onClick={async () => {
                  if (deletePending) return;
                  setDeletePending(true);
                  const ok = await onRequestConfirm({
                    title: `刪除 ticket「${ticket.title}」?`,
                    description:
                      "刪掉這張 ticket(後續 pipeline 不會再跑這張)。\n" +
                      "worktree 上已 commit 的程式碼留著(只是 spec 紀錄消失)。",
                    confirmLabel: "永久刪除",
                    danger: true,
                  });
                  if (ok) await onDeleteTicket(ticket.id);
                  setDeletePending(false);
                }}
              >
                <TrashIcon aria-hidden="true" />
                <span className="tdrw-delete-icon-label">刪除</span>
              </button>
            )}
          </div>
        )
      )}
    </Overlay>
  );
}

function makeBaseTicket() {
  return {
    id: "tkt-001",
    n: 2,
    title: "TicketDrawer iter rounds 顯示優化",
    goal: "讓 user 能在 drawer 內一眼看出每一輪 iter 的執行與審核結果,以及失敗時 feedback 的全文。",
    acceptance: [
      "每一輪 round 顯示 #N、verdict chip、執行時間、執行 AI 摘要、審核 AI 回饋。",
      "PASS / FAIL / PARTIAL 三種 verdict 各用不同 tone 顯色。",
      "空 feedback 時顯 placeholder,不整段隱藏。",
    ],
    prompt: LONG_PROMPT,
    mode: "iter",
    status: "draft",
    iterLimit: 5,
    iterStopAtLimit: true,
  };
}

/* ─── Demo controls (sets every enumerated state branch) ─── */

const STATUS_OPTIONS = ["draft", "ready", "running", "paused", "done", "failed", "failed_iter_limit", "failed_transient"];
const MODE_OPTIONS = ["step", "iter", "merge", "sync"];
const SECTION_PRESETS = ["minimal", "iter-running", "iter-with-rounds", "done-with-commits", "failed-with-reason", "running-with-livelog", "all-fields"];
const AUDIT_OPTIONS = ["none", "loading", "empty", "5 entries"];
const PROMPT_OPTIONS = ["long-markdown", "short", "empty"];
const BRANCH_OPTIONS = ["with-branch", "no-branch"];
const CONFIRM_OPTIONS = ["auto-confirm", "auto-cancel", "real-dialog"];

function App() {
  const [theme, setTheme] = useState("dark");
  useEffect(() => {
    document.documentElement.classList.toggle("light", theme === "light");
  }, [theme]);

  const [status, setStatus] = useState("draft");
  const [mode, setMode] = useState("iter");
  const [sectionPreset, setSectionPreset] = useState("iter-with-rounds");
  const [auditOpt, setAuditOpt] = useState("5 entries");
  const [promptOpt, setPromptOpt] = useState("long-markdown");
  const [branchOpt, setBranchOpt] = useState("with-branch");
  const [iterLimitOverride, setIterLimitOverride] = useState(5);
  const [isSplitting, setIsSplitting] = useState(false);
  const [confirmMode, setConfirmMode] = useState("real-dialog");
  const [enableActions, setEnableActions] = useState(true);
  const [panelCollapsed, setPanelCollapsed] = useState(false);

  const [confirmState, setConfirmState] = useState(null);

  const ticket = useMemo(() => {
    const t = makeBaseTicket();
    t.status = status;
    t.mode = mode;
    t.iterLimit = iterLimitOverride;

    if (promptOpt === "short") {
      t.prompt = "在 IterRounds 內顯每輪 verdict + feedback。";
    } else if (promptOpt === "empty") {
      t.prompt = "";
    } else {
      t.prompt = LONG_PROMPT;
    }

    // section preset → toggle iter / commits / liveLog / reason
    t.iter = undefined;
    t.commits = undefined;
    t.liveLog = undefined;
    t.reason = undefined;

    if (sectionPreset === "minimal") {
      // nothing extra
    } else if (sectionPreset === "iter-running") {
      t.iter = { current: 2, stage: "critic", verdicts: ["FAIL", "PARTIAL"], rounds: FIXTURE_ROUNDS_PASS_AT_3.slice(0, 2) };
    } else if (sectionPreset === "iter-with-rounds") {
      t.iter = { current: 3, stage: "done", verdicts: ["FAIL", "PARTIAL", "PASS"], rounds: FIXTURE_ROUNDS_PASS_AT_3 };
    } else if (sectionPreset === "done-with-commits") {
      t.iter = { current: 3, stage: "done", verdicts: ["FAIL", "PARTIAL", "PASS"], rounds: FIXTURE_ROUNDS_PASS_AT_3 };
      t.commits = FIXTURE_COMMITS;
    } else if (sectionPreset === "failed-with-reason") {
      t.iter = { current: 5, stage: "done", verdicts: ["FAIL","FAIL","PARTIAL","FAIL","FAIL"],
        rounds: [
          { n: 1, startedAt: 1735000000000, endedAt: 1735000080000, executorSummary: "嘗試 commit 但 normalize helper 漏一個 case。", criticVerdict: "FAIL", criticFeedback: "feedback 為空時被隱藏。" },
          { n: 2, startedAt: 1735000080000, endedAt: 1735000180000, executorSummary: "改 placeholder 顯示但 acceptance 第 2 條 colour token 還沒對。", criticVerdict: "FAIL", criticFeedback: "is-partial 應該用 paused token 不是 fg-mute。" },
          { n: 3, startedAt: 1735000180000, endedAt: 1735000300000, executorSummary: "對齊 verdict tone token,但有殘留 inline style。", criticVerdict: "PARTIAL", criticFeedback: "inline style 該抽 class。" },
          { n: 4, startedAt: 1735000300000, endedAt: 1735000400000, executorSummary: "抽 class,但 normalize 還是漏 case=0。", criticVerdict: "FAIL", criticFeedback: "normalize(0) 應 → PARTIAL 不是 UNKNOWN。" },
          { n: 5, startedAt: 1735000400000, endedAt: 1735000520000, executorSummary: "補 case=0,但 e2e snapshot 還沒更新。", criticVerdict: "FAIL", criticFeedback: "e2e 應跟著修。" },
        ],
      };
      t.reason = "達 iter 上限 5 輪審核仍未通過,執行流程暫停,等使用者手動接手。";
    } else if (sectionPreset === "running-with-livelog") {
      t.iter = { current: 2, stage: "doer", verdicts: ["FAIL"], rounds: FIXTURE_ROUNDS_PASS_AT_3.slice(0, 1) };
      t.liveLog =
        "[runner] 第 2 輪 executor 啟動 (claude-opus-4-7 / high)\n" +
        "[runner] 讀取 acceptance + critic feedback...\n" +
        "[runner] worktree git status: clean\n" +
        "[runner] subagent 派出 prompt size=4.2KB\n" +
        "[executor] tool_use=Edit src/features/pipeline/TicketDrawer.tsx\n" +
        "[executor] tool_use=Edit src/features/pipeline/ticketDrawer.css\n" +
        "[runner] elapsed=00:42 — executor 仍在執行...";
    } else if (sectionPreset === "all-fields") {
      t.iter = { current: 3, stage: "done", verdicts: ["FAIL","PARTIAL","PASS"], rounds: FIXTURE_ROUNDS_PASS_AT_3 };
      t.commits = FIXTURE_COMMITS;
      t.liveLog = "[runner] 第 3 輪 critic PASS,ticket done。\n[runner] worktree 仍開,等 pipeline next ticket。";
      t.reason = "iter 通過,所有 acceptance 條件已滿足。";
    }
    return t;
  }, [status, mode, sectionPreset, iterLimitOverride, promptOpt]);

  const auditEntries =
    auditOpt === "none" ? null :
    auditOpt === "loading" ? null :
    auditOpt === "empty" ? [] :
    FIXTURE_AUDIT_NONEMPTY;

  function requestConfirm(opts) {
    if (confirmMode === "auto-confirm") return Promise.resolve(true);
    if (confirmMode === "auto-cancel") return Promise.resolve(false);
    return new Promise((resolve) => {
      setConfirmState({
        opts,
        resolve: (r) => { setConfirmState(null); resolve(r === "confirm"); },
      });
    });
  }

  return (
    <>
      <div className="demo-backdrop" />
      <div className="demo-faux-board">
        <span className="demo-logo">vbpl</span>
        <span className="demo-crumb">scope: TicketDrawer prototype · reverse handoff</span>
      </div>

      <TicketDrawer
        ticket={ticket}
        pipelineName="ui-iter-2026-05-25"
        pipelineBranch={branchOpt === "with-branch" ? "pipeline/ui-iter-2026-05-25-a1b2" : ""}
        pipelineId="p1"
        projectHash="ab12cd34"
        auditEntries={auditEntries}
        isSplitting={isSplitting}
        onClose={() => alert("(demo) drawer onClose — 真實環境會回到 BoardScreen / FocusColumn")}
        onResetTicket={enableActions ? async (id) => { console.log("reset", id); alert("(demo) ticket reset 已派出"); } : undefined}
        onSplitTicket={enableActions ? async (id) => {
          console.log("split", id);
          setIsSplitting(true);
          setTimeout(() => setIsSplitting(false), 2500);
        } : undefined}
        onDeleteTicket={enableActions ? async (id) => { console.log("delete", id); alert("(demo) ticket 已刪除"); } : undefined}
        onToggleMode={enableActions ? async (id, next) => {
          console.log("toggle mode", id, next);
          setMode(next);
        } : undefined}
        onChangeIterLimit={enableActions ? async (id, n) => {
          console.log("change iter limit", id, n);
          setIterLimitOverride(n);
        } : undefined}
        onRequestConfirm={requestConfirm}
      />

      <ConfirmDialog
        open={!!confirmState}
        opts={confirmState?.opts}
        onResult={(r) => confirmState?.resolve(r)}
      />

      <div className={"demo-panel" + (panelCollapsed ? " is-collapsed" : "")}>
        <div className="demo-collapse">
          <strong style={{fontSize:11, letterSpacing:'.06em', color:'var(--fg-mute)'}}>TICKETDRAWER · DEMO STATE</strong>
          <button className="demo-toggle" onClick={() => setPanelCollapsed(v => !v)}>
            {panelCollapsed ? "展開" : "收起"}
          </button>
        </div>

        <div className="demo-section">
          <h3>theme</h3>
          <label className="demo-row">
            <span>theme</span>
            <select value={theme} onChange={(e) => setTheme(e.target.value)}>
              <option value="dark">dark</option>
              <option value="light">light</option>
            </select>
          </label>
        </div>

        <div className="demo-section">
          <h3>ticket.status (8)</h3>
          <label className="demo-row">
            <span>status</span>
            <select value={status} onChange={(e) => setStatus(e.target.value)}>
              {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            terminal: done / failed / failed_iter_limit / failed_transient → 顯「重開 ticket」<br/>
            draft / ready → 顯「AI 拆分」 + iter limit 可編輯<br/>
            running → 不可刪
          </div>
        </div>

        <div className="demo-section">
          <h3>ticket.mode (4)</h3>
          <label className="demo-row">
            <span>mode</span>
            <select value={mode} onChange={(e) => setMode(e.target.value)}>
              {MODE_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            merge / sync = synthetic ticket,不可切 / 不可拆 / 不可刪。<br/>
            iter + draft/ready → 顯 IterLimitField inline input。
          </div>
        </div>

        <div className="demo-section">
          <h3>section content preset</h3>
          <label className="demo-row">
            <span>preset</span>
            <select value={sectionPreset} onChange={(e) => setSectionPreset(e.target.value)}>
              {SECTION_PRESETS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            控制 ticket.iter / ticket.commits / ticket.liveLog / ticket.reason 是否存在。<br/>
            done 狀態下 outcome 排前 spec 排後;否則反過來。
          </div>
        </div>

        <div className="demo-section">
          <h3>prompt 內容</h3>
          <label className="demo-row">
            <span>prompt</span>
            <select value={promptOpt} onChange={(e) => setPromptOpt(e.target.value)}>
              {PROMPT_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            long → CollapsiblePrompt 折疊 + 漸層遮罩 + 「展開全部」<br/>
            short → 不折疊(短於 400 字)<br/>
            empty → 顯「(空)」<br/>
            注意:done 狀態下短 prompt 也預設折疊(td-006)
          </div>
        </div>

        <div className="demo-section">
          <h3>iter limit (1-5)</h3>
          <label className="demo-row">
            <span>iterLimit</span>
            <select value={String(iterLimitOverride)} onChange={(e) => setIterLimitOverride(Number(e.target.value))}>
              {[1,2,3,4,5].map(n => <option key={n} value={String(n)}>{n}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            想看 invalid state:在 drawer 內直接把 input 改 0 / 6 / 空字串。
          </div>
        </div>

        <div className="demo-section">
          <h3>breadcrumb branch</h3>
          <label className="demo-row">
            <span>branch chip</span>
            <select value={branchOpt} onChange={(e) => setBranchOpt(e.target.value)}>
              {BRANCH_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
        </div>

        <div className="demo-section">
          <h3>AuditTimeline entries</h3>
          <label className="demo-row">
            <span>entries</span>
            <select value={auditOpt} onChange={(e) => setAuditOpt(e.target.value)}>
              {AUDIT_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            none / loading → 「···」count badge<br/>
            empty → dashed badge「0」+ 展開後 audit-empty-state<br/>
            5 entries → 展開後 audit-row list
          </div>
        </div>

        <div className="demo-section">
          <h3>footer 狀態</h3>
          <label className="demo-row">
            <span>isSplitting prop</span>
            <input type="checkbox" checked={isSplitting} onChange={(e) => setIsSplitting(e.target.checked)} />
          </label>
          <label className="demo-row">
            <span>actions 可用</span>
            <input type="checkbox" checked={enableActions} onChange={(e) => setEnableActions(e.target.checked)} />
          </label>
          <div className="demo-hint">
            勾 isSplitting → 顯「AI 拆分中…」spinner footer。<br/>
            按 footer「AI 拆分…」會顯 inline 確認卡 (splitPending state)。<br/>
            取消 actions → showActions=false,footer 完全隱藏。
          </div>
        </div>

        <div className="demo-section">
          <h3>ConfirmDialog 行為</h3>
          <label className="demo-row">
            <span>reset / delete 確認</span>
            <select value={confirmMode} onChange={(e) => setConfirmMode(e.target.value)}>
              {CONFIRM_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <div className="demo-hint">
            real-dialog → 真實彈出 alertdialog (danger tone)。<br/>
            auto-confirm / auto-cancel → 跳過彈窗直接回 callback 結果。
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
