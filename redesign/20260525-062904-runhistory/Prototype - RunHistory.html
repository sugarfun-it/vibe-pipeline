<style>
/* ─── tokens (verbatim subset from src/styles/tokens.css) ───────── */
:root {
  --bg: #0c0e12;
  --bg-elevated: #14171c;
  --panel: #161a20;
  --panel-2: #1c2027;
  --hover: rgba(232, 228, 217, 0.04);
  --selected: rgba(216, 162, 90, 0.10);
  --line: rgba(232, 228, 217, 0.06);
  --line-2: rgba(232, 228, 217, 0.12);

  --fg: #e8e3d6;
  --fg-mute: #8b8475;
  --fg-faint: #595448;

  --accent: #d8a25a;
  --accent-soft: rgba(216, 162, 90, 0.12);

  --running: #7e94c8;
  --running-soft: rgba(126, 148, 200, 0.14);
  --iter: #b099d8;
  --iter-soft: rgba(176, 153, 216, 0.14);
  --done: #7eaa7f;
  --done-soft: rgba(126, 170, 127, 0.14);
  --failed: #c47b78;
  --failed-soft: rgba(196, 123, 120, 0.14);
  --paused: #d8a25a;
  --paused-soft: rgba(216, 162, 90, 0.14);
  --queued: #5fb3a8;
  --queued-soft: rgba(95, 179, 168, 0.14);
  --draft: #6e6a5e;

  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --radius-xs: 4px;
  --radius-control: 6px;
  --radius-card: 8px;
  --radius-panel: 10px;
  --control-h: 32px;
  --control-h-sm: 26px;
  --control-pad-x: 12px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-md: 0 12px 32px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
  --shadow-lg: 0 32px 80px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.35);
  --shadow-popover: 0 2px 6px rgba(0,0,0,0.35), 0 12px 28px rgba(0,0,0,0.45);
  --shadow-overlay: var(--shadow-lg);
  --scrim: color-mix(in srgb, #000 45%, transparent);
  --scrim-drawer: color-mix(in srgb, #000 40%, transparent);

  --z-overlay-base: 50;
  --z-popover: 100;
  --z-drawer: 200;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  --accent-fg: rgba(255,255,255,0.95);
  --danger-fg: #fff5f3;
  --danger-bg-soft: var(--failed-soft);
  --danger-border: color-mix(in srgb, var(--failed) 55%, var(--line-2));
  --success-fg: #f1faf1;
  --status-dark-fg: #0c0e12;
  --warning-fg: #1c1208;
  --info-fg: #f1f4fa;
  --banner-success-fg: #0e1f0f;
  --banner-ready-fg: var(--status-dark-fg);
  --qa-thinking-fg: var(--fg-mute);
  --inverse-fg: #1c1916;
  --on-accent-fg: var(--accent-fg);

  --bg-callout: color-mix(in srgb, var(--fg-mute) 6%, var(--panel-2));
  --callout-border: var(--line);
  --bg-warning-soft: color-mix(in srgb, var(--paused) 8%, var(--panel-2));
  --warning-border: color-mix(in srgb, var(--paused) 40%, var(--line-2));
  --bg-success-soft: color-mix(in srgb, var(--done) 8%, var(--panel-2));
  --success-border: color-mix(in srgb, var(--done) 40%, var(--line-2));
  --bg-danger-soft: var(--failed-soft);
  --danger-soft-border: color-mix(in srgb, var(--failed) 40%, var(--line-2));
  --bg-info-soft: color-mix(in srgb, var(--running) 8%, var(--panel-2));
  --info-border: color-mix(in srgb, var(--running) 40%, var(--line-2));

  --focus-ring-offset: 2px;
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --font-ui: "Geist", "Inter Tight", -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}

html.light {
  --bg: #f7f3e8;
  --bg-elevated: #ffffff;
  --panel: #ffffff;
  --panel-2: #faf6ea;
  --hover: rgba(28, 25, 22, 0.04);
  --selected: rgba(181, 117, 26, 0.08);
  --line: rgba(28, 25, 22, 0.07);
  --line-2: rgba(28, 25, 22, 0.14);

  --fg: #1c1916;
  --fg-mute: #6e6658;
  --fg-faint: #a8a292;

  --accent: #b5751a;
  --accent-soft: rgba(181, 117, 26, 0.12);

  --running: #4a6db0;
  --running-soft: rgba(74, 109, 176, 0.10);
  --iter: #7551b8;
  --iter-soft: rgba(117, 81, 184, 0.10);
  --done: #3a8a4a;
  --done-soft: rgba(58, 138, 74, 0.10);
  --failed: #b04040;
  --failed-soft: rgba(176, 64, 64, 0.10);
  --paused: #b5751a;
  --paused-soft: rgba(181, 117, 26, 0.12);
  --queued: #2e8a80;
  --queued-soft: rgba(46, 138, 128, 0.10);
  --draft: #a8a292;

  --shadow-sm: 0 1px 2px rgba(28,25,22,0.08);
  --shadow-md: 0 12px 32px rgba(28,25,22,0.14), 0 2px 6px rgba(28,25,22,0.08);
  --shadow-lg: 0 32px 80px rgba(28,25,22,0.22), 0 4px 12px rgba(28,25,22,0.12);
  --shadow-popover: 0 2px 6px rgba(28,25,22,0.10), 0 12px 28px rgba(28,25,22,0.18);
  --shadow-overlay: var(--shadow-lg);
  --scrim: color-mix(in srgb, #1c1916 35%, transparent);
  --scrim-drawer: color-mix(in srgb, #1c1916 30%, transparent);

  --accent-fg: #ffffff;
  --danger-fg: #ffffff;
  --danger-border: var(--failed);
  --success-fg: #ffffff;
  --status-dark-fg: #1c1916;
  --warning-fg: #1c1208;
  --info-fg: #ffffff;
  --banner-success-fg: #0e1f0f;
  --banner-ready-fg: var(--status-dark-fg);
  --qa-thinking-fg: var(--fg-mute);
  --inverse-fg: #ffffff;
  --on-accent-fg: var(--accent-fg);

  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}

* { box-sizing: border-box; }
html, body, #root {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

.mono { font-family: var(--font-mono); font-feature-settings: "ss01", "cv11"; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--control-h, 32px);
  padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--line-2); color: var(--fg);
  background: var(--panel-2);
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.btn:hover:not(:disabled):not([aria-disabled="true"]):not(.btn-primary):not(.btn-danger):not(.btn-queued):not(.btn-accent) {
  background: var(--hover); border-color: var(--line-2);
}
.btn:active:not(:disabled) { transform: translateY(0.5px); }
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  color: var(--fg-faint);
}
.btn:disabled:hover { background: var(--panel); border-color: var(--line); }

/* drawer shell mock */
.tdrw-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(820px, 100vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  z-index: var(--z-drawer);
}
.tdrw-drawer-head {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}
.tdrw-drawer-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
}
.tdrw-drawer-close {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-mute);
  border-radius: var(--radius-control);
}
.tdrw-drawer-close:hover { background: var(--hover); color: var(--fg); }

.drawer-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: var(--space-4) var(--space-5);
}

.tdrw-empty { color: var(--fg-faint); font-style: italic; }
.tdrw-text { white-space: pre-wrap; word-break: break-word; }

.pipeline-history-top-summary {
  display: flex;
  flex-direction: column;
  gap: var(--space-1, 4px);
  padding: var(--space-2, 8px) var(--space-3, 12px);
  border: 1px solid var(--line);
  border-radius: var(--radius-card, 8px);
  background: var(--panel-2);
  color: var(--fg-mute);
  font-size: 12.5px;
  margin-bottom: var(--space-3, 12px);
}
.pipeline-history-top-summary-line {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: var(--space-1, 4px) var(--space-2, 8px);
}
.pipeline-history-top-summary-line-meta { color: var(--fg-mute); }
.pipeline-history-top-summary-label { color: var(--fg-faint); }
.pipeline-history-top-summary-state { color: var(--fg); font-weight: 500; }
.pipeline-history-top-summary-sep { color: var(--fg-faint); }
.pipeline-history-top-summary-reason { color: var(--fg-mute); }

.rh-empty-state {
  display: flex; flex-direction: column;
  gap: var(--space-2, 8px);
  padding: var(--space-3, 12px) 0 var(--space-4, 16px);
  align-items: flex-start;
}
.rh-empty-state .rh-empty-title {
  color: var(--fg); font-size: 13px; font-weight: 500;
}
.rh-empty-state .rh-empty-hint {
  color: var(--fg-mute); font-size: 12px; line-height: 1.55;
}
.rh-empty-state .rh-empty-actions { margin-top: var(--space-2, 8px); }
.rh-empty-state .rh-empty-cta { font-size: 12.5px; padding: 6px 12px; }

/* Run history */
.tdrw-runs { display: flex; flex-direction: column; gap: var(--space-3, 12px); }
.tdrw-runs-summary {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--space-2, 8px) var(--space-4, 16px);
  padding: var(--space-3, 12px) var(--space-4, 16px);
  border: 1px solid var(--line);
  border-radius: var(--radius-card, 8px);
  background: var(--panel-2);
  font-size: 12.5px;
  color: var(--fg-mute);
  font-family: var(--font-mono);
}
.tdrw-runs-collapse-all { margin-left: auto; }
.tdrw-run-pre-toggle {
  align-self: flex-start;
  font-size: 11.5px;
  padding: 4px 10px;
  min-height: var(--control-h-sm, 26px);
  border-radius: var(--radius-control, 6px);
}
.tdrw-run-pre-toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.tdrw-run-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-card, 8px);
  background: var(--panel);
  overflow: hidden;
}
.tdrw-run-head {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  align-items: center;
  gap: var(--space-2, 8px) var(--space-3, 12px);
  padding: var(--space-2, 8px) var(--space-3, 12px);
  cursor: pointer; user-select: none;
  background: transparent; border: none;
  width: 100%; text-align: left;
  font: inherit; color: inherit;
}
.tdrw-run-head:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}
.tdrw-run-head:hover { background: var(--panel-2); }
.tdrw-run-head-chev {
  font-size: 10px; color: var(--fg-faint);
  width: 10px; text-align: center;
}
.tdrw-run-head-title {
  display: flex; align-items: center;
  gap: var(--space-2, 8px);
  font-size: 12.5px;
  min-width: 0; flex-wrap: wrap;
}
.tdrw-run-head-title .mono {
  color: var(--fg); white-space: nowrap;
  flex: 0 0 auto; font-weight: 500;
}
.tdrw-run-result {
  font-size: 12px; color: var(--fg-mute);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 auto; min-width: 0;
}
.tdrw-run-status {
  display: inline-flex; align-items: center; white-space: nowrap; flex: 0 0 auto;
  font-size: 11px; font-weight: 500;
  padding: 2px var(--space-2, 8px);
  border-radius: var(--radius-control, 6px);
  letter-spacing: 0.02em; text-transform: none;
  border: 1px solid transparent;
}
.tdrw-run-status.is-ok,
.tdrw-run-status[data-state="success"] {
  color: var(--done);
  background: color-mix(in srgb, var(--done) 12%, transparent);
  border-color: color-mix(in srgb, var(--done) 35%, var(--line-2));
}
.tdrw-run-status.is-fail,
.tdrw-run-status[data-state="failed"] {
  color: var(--failed);
  background: color-mix(in srgb, var(--failed) 12%, transparent);
  border-color: color-mix(in srgb, var(--failed) 35%, var(--line-2));
}
.tdrw-run-provider {
  min-width: 0; max-width: 220px;
  overflow: hidden; text-overflow: ellipsis;
  text-transform: none; letter-spacing: 0;
  color: var(--fg-mute);
  background: var(--bg);
  border-color: var(--line-2);
}
.tdrw-run-meta {
  display: flex; flex-wrap: wrap;
  column-gap: var(--space-5, 20px);
  row-gap: var(--space-2, 8px);
  padding: var(--space-3, 12px);
  border-top: 1px solid var(--line);
  background: var(--bg-elevated);
  font-size: 11.5px; color: var(--fg-mute);
  font-family: var(--font-mono);
}
.tdrw-run-meta-item {
  display: inline-flex; align-items: baseline;
  gap: var(--space-1, 4px); min-width: 0;
  white-space: nowrap;
}
.tdrw-run-meta-provider {
  flex: 1 0 100%;
  font-size: 11.5px; color: var(--fg-mute);
  display: inline-flex; align-items: baseline;
  gap: var(--space-2, 8px); flex-wrap: wrap;
}
.tdrw-run-meta-provider .tdrw-run-meta-label { flex: 0 0 auto; }
.tdrw-run-meta-provider-value {
  font-family: var(--font-mono);
  color: var(--fg); word-break: break-all;
}
.tdrw-run-detail-error {
  display: flex; align-items: center; gap: 8px; color: var(--failed);
}

.tdrw-run-meta-ticket-diff {
  flex: 1 0 100%;
  display: grid;
  grid-template-columns: max-content 1fr;
  align-items: start;
  column-gap: var(--space-2, 8px);
  row-gap: var(--space-1, 4px);
  min-width: 0;
}
.tdrw-run-meta-ticket-diff .tdrw-run-meta-label { white-space: nowrap; }
.tdrw-run-meta-ticket-diff-list {
  display: flex; flex-wrap: wrap;
  gap: 2px var(--space-2, 8px);
  min-width: 0;
  color: var(--fg); font-weight: 500;
}
.tdrw-run-meta-ticket-diff-item {
  display: inline-flex; align-items: center; white-space: nowrap;
}
@media (max-width: 540px) {
  .tdrw-run-meta-ticket-diff {
    display: flex; flex-direction: column;
    gap: var(--space-1, 4px);
  }
  .tdrw-run-meta-ticket-diff-list {
    flex-direction: column; gap: var(--space-1, 4px); align-items: flex-start;
  }
  .tdrw-run-meta-ticket-diff-item {
    padding: 2px 6px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 11.5px;
  }
}

.tdrw-run-meta-fail { max-width: 360px; min-width: 0; }
.tdrw-run-meta-fail strong {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.tdrw-run-meta-item strong { color: var(--fg); font-weight: 500; }
.tdrw-run-meta-label {
  font-family: var(--font-sans, inherit); white-space: nowrap;
  color: var(--fg-mute); font-size: 11px; font-weight: 500;
}
.tdrw-run-meta-partial {
  font-size: 11.5px; color: var(--fg-faint); margin-left: 4px;
}
.tdrw-run-detail {
  border-top: 1px solid var(--line);
  padding: var(--space-4, 16px) var(--space-3, 12px);
  display: flex; flex-direction: column;
  gap: var(--space-3, 12px);
}
.tdrw-run-detail-label {
  font-size: 12px; font-weight: 600;
  text-transform: none; letter-spacing: 0.02em;
  color: var(--fg-mute); margin: 0;
  display: flex; align-items: center; gap: var(--space-2, 8px);
}
.tdrw-run-detail-section {
  display: flex; flex-direction: column;
  gap: var(--space-2, 8px); margin: 0;
}
.tdrw-run-pre {
  margin: 0;
  padding: var(--space-2, 8px) var(--space-3, 12px);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-control, 6px);
  font-family: var(--font-mono);
  font-size: 11.5px; line-height: 1.55; color: var(--fg);
  white-space: pre; word-break: normal; overflow-wrap: normal;
  max-height: 300px; overflow: auto;
}
.tdrw-run-detail-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--fg-faint);
  background: var(--panel-2);
  border: 1px solid var(--line);
  text-transform: lowercase; letter-spacing: 0.04em;
}
.tdrw-run-pre.is-oneline {
  max-height: none; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.tdrw-run-pre.is-nowrap { white-space: pre; }
.tdrw-run-session-id {
  display: block; margin: 0;
  font-family: var(--font-mono); font-size: 11.5px;
  padding: var(--space-2, 8px) var(--space-3, 12px);
  background: var(--bg);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-control, 6px);
  color: var(--fg);
  word-break: break-all; user-select: all;
}

.tdrw-run-pre-tools {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--space-2, 8px);
}
.tdrw-run-pre-placeholder-meta {
  font-family: var(--font-mono); font-size: 11.5px;
  color: var(--fg-mute);
  margin-right: var(--space-1, 4px);
}

.tdrw-run-detail-result code,
.tdrw-text code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg);
  border: 1px solid var(--line-2);
  color: var(--fg);
}

@media (max-width: 767.98px) {
  .tdrw-run-head-hint {
    display: inline-block; font-size: 10.5px; color: var(--fg-faint);
  }
  .tdrw-run-head { gap: 8px; padding: 8px 10px; }
  .tdrw-run-head-title { flex-wrap: wrap; gap: 6px; }
  .tdrw-run-head-title .mono { flex-basis: 100%; }
  .tdrw-run-provider { max-width: 160px; }
  .tdrw-run-result { flex-basis: 100%; }
  .tdrw-run-meta { gap: 6px 10px; padding: 8px 10px; }
}

/* demo control panel — bottom-left to avoid the right-side drawer */
.demo-panel {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 9999;
  width: 320px;
  max-height: calc(100vh - 32px);
  overflow: auto;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-popover);
  font-family: var(--font-ui);
  font-size: 12px;
}
.demo-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
  cursor: pointer; user-select: none;
}
.demo-panel-title { font-weight: 600; font-size: 12px; color: var(--fg); }
.demo-panel-toggle { color: var(--fg-mute); font-size: 11px; }
.demo-panel-body {
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 12px;
}
.demo-row { display: flex; flex-direction: column; gap: 4px; }
.demo-row-label {
  font-size: 11px; color: var(--fg-mute);
  font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase;
}
.demo-row-controls { display: flex; flex-wrap: wrap; gap: 4px; }
.demo-chip {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--fg-mute);
  border: 1px solid var(--line);
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font-mono);
}

// ─── helpers (verbatim from RunHistory.tsx + src/data/pipelines.ts) ───
function fmtDuration(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const sec = s % 60;
  if (m < 60) return sec ? `${m}m ${sec}s` : `${m}m`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}
function fmtNum(n) {
  if (n < 1000) return String(n);
  if (n < 1_000_000) return `${(n / 1000).toFixed(1)}k`;
  return `${(n / 1_000_000).toFixed(2)}M`;
}
function fmtTime(ms) {
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function formatFailureReason(raw) {
  const trimmed = raw.trim();
  let display = trimmed;
  if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
    try {
      const parsed = JSON.parse(trimmed);
      const message =
        (typeof parsed.message === "string" && parsed.message) ||
        (typeof parsed.error === "string" && parsed.error) ||
        (typeof parsed.error?.message === "string" && parsed.error.message) ||
        (typeof parsed.code === "string" && parsed.code) ||
        (typeof parsed.api_error_status === "number" && `API ${parsed.api_error_status}`) ||
        (typeof parsed.subtype === "string" && parsed.subtype) ||
        "";
      if (message) display = message;
    } catch {}
  }
  return display.length > 120 ? `${display.slice(0, 120)}…` : display;
}
function localizeResult(raw) {
  let s = raw;
  s = s.replace(/全\s*PASS/gi, "全數通過");
  s = s.replace(/(\d+)\s*commit(?![=:\-])/gi, "$1 個 commit");
  s = s.replace(/可\s*merge/gi, "可合併");
  s = s.replace(/,(?=\S)/g, ", ");
  s = s.replace(/state=([a-z_]+)/gi, (_, k) => {
    const lc = k.toLowerCase();
    return STATE_LABELS[lc] != null ? `狀態:${STATE_LABELS[lc]}` : `state=${k}`;
  });
  s = s.replace(/pipeline\.狀態/g, "pipeline 狀態");
  s = s.replace(/(可合併)\s*[,，、]\s*可合併/g, "$1");
  s = s.replace(/, (?=[一-鿿])/g, ",");
  s = s.replace(/, (?=[一-鿿])/g, ",");
  s = s.replace(/([一-鿿])(\d|[A-Za-z])/g, "$1 $2");
  s = s.replace(/(\d|[A-Za-z])([一-鿿])/g, "$1 $2");
  s = s.replace(/([a-z_]+)\s*(?:→|->)\s*([a-z_]+)/gi, (m, fromK, toK) => {
    const f = fromK.toLowerCase();
    const t = toK.toLowerCase();
    const from = TICKET_STATUS_LABELS[f];
    const to = TICKET_STATUS_LABELS[t];
    return from != null && to != null ? `${from}→${to}` : m;
  });
  return s;
}
function renderResult(raw) {
  let s = raw;
  s = s.replace(/全\s*PASS/gi, "全數通過");
  s = s.replace(/(\d+)\s*commit(?![=:\-])/gi, "$1 個 commit");
  s = s.replace(/可\s*merge/gi, "可合併");
  s = s.replace(/pipeline\.狀態/g, "pipeline 狀態");
  s = s.replace(/,(?=\S)/g, ", ");
  s = localizeResult(s);
  const parts = [];
  const re = /([a-z_][a-z0-9_.]*=[a-z0-9_\-]+)/gi;
  let lastIndex = 0;
  let m;
  let key = 0;
  while ((m = re.exec(s)) !== null) {
    if (m.index > lastIndex) parts.push(s.slice(lastIndex, m.index));
    parts.push(<code key={`c${key++}`}>{m[0]}</code>);
    lastIndex = m.index + m[0].length;
  }
  if (lastIndex < s.length) parts.push(s.slice(lastIndex));
  return <>{parts.length > 0 ? parts : s}</>;
}
function computeTicketDiff(before, after) {
  if (!before || !after) return [];
  const beforeMap = new Map(before.map((t) => [t.id, t.status]));
  const out = [];
  for (const t of after) {
    const from = beforeMap.get(t.id) ?? "(新)";
    if (from !== t.status) out.push({ id: t.id, from, to: t.status });
  }
  return out;
}

function useCopiedFeedback() {
  const [copied, setCopied] = useState(false);
  const tref = useRef(null);
  const flash = () => {
    setCopied(true);
    if (tref.current) clearTimeout(tref.current);
    tref.current = setTimeout(() => setCopied(false), 1400);
  };
  return { copied, flash };
}

function buildLongStdout() {
  const lines = [];
  for (let i = 1; i <= 220; i++) {
    if (i === 1) lines.push(`{"type":"system","subtype":"init","model":"claude-opus-4-7","cwd":"/repo"}`);
    else if (i % 18 === 0) lines.push(`{"type":"assistant","message":{"content":[{"type":"text","text":"checkpoint ${i}"}]}}`);
    else if (i % 9 === 0) lines.push(`{"type":"tool_use","tool":"bash","input":{"command":"git status --porcelain"}}`);
    else if (i % 7 === 0) lines.push(`{"type":"tool_result","is_error":false,"content":"ok (${i})"}`);
    else lines.push(`{"type":"progress","step":${i},"detail":"scanning candidate ${i.toString(16)}"}`);
  }
  return lines.join("\n");
}

}

// ─── RunHistory (DOM verbatim from src/features/pipeline/RunHistory.tsx) ───
function RunHistory({ projectHash, pipelineId, onCloseDrawer, fetchRuns, fetchDetail, initialRuns }) {
  const [runs, setRuns] = useState(initialRuns !== undefined ? initialRuns : null);

  useEffect(() => {
    if (initialRuns !== undefined) {
      setRuns(initialRuns);
      return;
    }
    setRuns(null);
    let cancelled = false;
    Promise.resolve(fetchRuns ? fetchRuns(projectHash, pipelineId) : []).then((arr) => {
      if (cancelled) return;
      setRuns(arr);
    });
    return () => { cancelled = true; };
  }, [projectHash, pipelineId, initialRuns, fetchRuns]);

  const summary = useMemo(() => {
    if (!runs || runs.length === 0) return null;
    let totalCost = 0;
    let totalDuration = 0;
    let costCount = 0;
    let durCount = 0;
    let missingCost = 0;
    for (const r of runs) {
      if (r.costUsd != null) { totalCost += r.costUsd; costCount++; } else { missingCost++; }
      if (r.durationMs != null) { totalDuration += r.durationMs; durCount++; }
    }
    return {
      count: runs.length,
      totalCost: costCount > 0 ? totalCost : null,
      totalDuration: durCount > 0 ? totalDuration : null,
      costPartial: costCount > 0 && missingCost > 0,
    };
  }, [runs]);

  if (runs === null) {
    return (
      <div className="tdrw-empty" role="status" aria-live="polite">
        載入執行紀錄中…
      </div>
    );
  }
  if (runs.length === 0) {
    return (
      <div className="rh-empty-state">
        <div className="rh-empty-title">這個 pipeline 還沒被執行過</div>
        <div className="rh-empty-hint">
          這裡會列出每次執行後 runner 留下的紀錄,包含耗時、成本與結果。目前還沒有任何一筆。
        </div>
        {onCloseDrawer && (
          <div className="rh-empty-actions">
            <button type="button" className="btn rh-empty-cta" onClick={onCloseDrawer}>
              關閉執行紀錄
            </button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="tdrw-runs">
      {summary && (
        <div className="tdrw-runs-summary">
          <span className="tdrw-run-meta-item">
            <span className="tdrw-run-meta-label">執行次數</span>
            <strong>{summary.count}</strong>
          </span>
          <span className="tdrw-run-meta-item">
            <span className="tdrw-run-meta-label">總時間</span>
            <strong>
              {summary.totalDuration != null ? fmtDuration(summary.totalDuration) : "—"}
            </strong>
          </span>
          <span
            className="tdrw-run-meta-item"
            title={summary.costPartial ? "部分執行(如 codex)未回報成本,僅累計有資料的執行" : undefined}
          >
            <span className="tdrw-run-meta-label">總成本</span>
            <strong>
              {summary.totalCost != null ? `$${summary.totalCost.toFixed(2)}` : "—"}
            </strong>
            {summary.costPartial && (
              <span className="tdrw-run-meta-partial">(部分)</span>
            )}
          </span>
        </div>
      )}
      {runs.map((r) => (
        <RunCard
          key={`${projectHash}/${pipelineId}/${r.filename}`}
          run={r}
          projectHash={projectHash}
          pipelineId={pipelineId}
          fetchDetail={fetchDetail}
        />
      ))}
    </div>
  );
}

function RunCard({ run, projectHash, pipelineId, fetchDetail }) {
  const [open, setOpen] = useState(!!run._initialOpen);
  const [detail, setDetail] = useState(run._initialDetail ?? null);
  const [detailLoading, setDetailLoading] = useState(!!run._initialDetailLoading);
  const [detailFailed, setDetailFailed] = useState(!!run._initialDetailFailed);
  const headId = useId();
  const detailId = useId();

  const loadDetail = async () => {
    setDetailFailed(false);
    setDetailLoading(true);
    try {
      const d = await (fetchDetail
        ? fetchDetail(projectHash, pipelineId, run.filename)
        : Promise.resolve(null));
      setDetail(d);
    } catch (e) {
      setDetailFailed(true);
    } finally {
      setDetailLoading(false);
    }
  };

  const handleToggle = () => {
    const next = !open;
    setOpen(next);
    if (next && !detail && !detailLoading) {
      loadDetail();
    }
  };

  const ok = run.exitCode === 0;
  const exitText = run.exitCode != null ? `退出碼 ${run.exitCode}` : "退出碼 ?";
  const outcomeLabel = ok ? "成功" : "失敗";
  const chipText = ok ? outcomeLabel : `${outcomeLabel} · ${exitText}`;
  const cost = run.costUsd != null ? `$${run.costUsd.toFixed(2)}` : "—";
  const dur = run.durationMs != null ? fmtDuration(run.durationMs) : "—";
  const turns = run.numTurns != null ? `${run.numTurns}` : "—";
  const tokens = run.tokens
    ? `輸入 ${fmtNum(run.tokens.input)} · 輸出 ${fmtNum(run.tokens.output)} · 快取 ${fmtNum(run.tokens.cacheRead)}${
        run.tokens.reasoning != null && run.tokens.reasoning > 0
          ? ` · 推理 ${fmtNum(run.tokens.reasoning)}`
          : ""
      }`
    : "—";
  const isCodex = run.provider === "codex";
  const ticketDiff = computeTicketDiff(run.ticketsBefore, run.ticketsAfter);
  const fullProvider = run.provider || run.model
    ? `${run.provider ?? "—"} · ${run.model ?? "—"}`
    : "—";
  const toggleAria = `${open ? "收合" : "展開"} ${fmtTime(run.startedAt)} 的執行明細(${outcomeLabel}・${exitText})`;
  const toggleHint = open ? "收合輸出" : "查看輸出";

  return (
    <div className={"tdrw-run-card" + (ok ? "" : " is-fail")}>
      <button
        type="button"
        id={headId}
        className="tdrw-run-head"
        onClick={handleToggle}
        aria-expanded={open}
        aria-controls={detailId}
        aria-label={toggleAria}
        title={open ? "收合此執行紀錄" : "展開此執行紀錄"}
        style={{
          display: "grid",
          gridTemplateColumns: "auto minmax(0, 1fr) auto",
          alignItems: "center",
          columnGap: "8px",
          width: "100%",
        }}
      >
        <span style={visuallyHidden}>{open ? "收合" : "展開"}</span>
        <span
          className="tdrw-run-head-chev"
          aria-hidden="true"
          style={{
            display: "inline-flex",
            transform: open ? "rotate(0deg)" : "rotate(-90deg)",
            transition: "transform 120ms ease",
          }}
        >
          <ChevronIcon />
        </span>
        <div className="tdrw-run-head-title">
          <span className="mono">{fmtTime(run.startedAt)}</span>
          <span
            className={"tdrw-run-status " + (ok ? "is-ok" : "is-fail")}
            data-state={ok ? "success" : "failed"}
            title={`${outcomeLabel} · ${exitText}`}
          >
            {chipText}
          </span>
          {run.result && (
            <span
              className="tdrw-run-result"
              title={run.result}
              style={{
                whiteSpace: "normal",
                display: "-webkit-box",
                WebkitLineClamp: 2,
                WebkitBoxOrient: "vertical",
                overflow: "hidden",
              }}
            >
              {localizeResult(run.result)}
            </span>
          )}
        </div>
        <span
          aria-hidden="true"
          className="tdrw-run-head-hint"
          style={{ fontSize: 11, color: "var(--fg-faint)", whiteSpace: "nowrap" }}
        >
          {toggleHint}
        </span>
      </button>
      <div className="tdrw-run-meta">
        <span className="tdrw-run-meta-item">
          <span className="tdrw-run-meta-label">耗時</span>
          <strong>{dur}</strong>
        </span>
        {!isCodex && (
          <>
            <span className="tdrw-run-meta-item">
              <span className="tdrw-run-meta-label">成本</span>
              <strong>{cost}</strong>
            </span>
            <span className="tdrw-run-meta-item">
              <span className="tdrw-run-meta-label">回合</span>
              <strong>{turns}</strong>
            </span>
            <span className="tdrw-run-meta-item">
              <span className="tdrw-run-meta-label">權杖數</span>
              <strong>{tokens}</strong>
            </span>
          </>
        )}
        {(run.provider || run.model) && (
          <span className="tdrw-run-meta-provider">
            <span className="tdrw-run-meta-label">執行器</span>
            <span className="tdrw-run-meta-provider-value">{fullProvider}</span>
          </span>
        )}
        {run.failureReason && (
          <span
            className="tdrw-run-meta-item tdrw-run-meta-fail"
            title={run.failureReason}
          >
            <span className="tdrw-run-meta-label">失敗原因</span>
            <strong>{formatFailureReason(run.failureReason)}</strong>
          </span>
        )}
        {ticketDiff.length > 0 && (
          <span className="tdrw-run-meta-item tdrw-run-meta-ticket-diff">
            <span className="tdrw-run-meta-label">Ticket 進度</span>
            <span className="tdrw-run-meta-ticket-diff-list">
              {ticketDiff.map((d) => (
                <span key={d.id} className="tdrw-run-meta-ticket-diff-item">
                  {d.id}: {TICKET_STATUS_LABELS[d.from] ?? d.from}→{TICKET_STATUS_LABELS[d.to] ?? d.to}
                </span>
              ))}
            </span>
          </span>
        )}
      </div>

      {open && (
        <div id={detailId} role="region" aria-labelledby={headId} className="tdrw-run-detail">
          {detailLoading && <div className="tdrw-empty">載入執行明細中…</div>}
          {detailFailed && !detailLoading && !detail && (
            <div className="tdrw-empty tdrw-run-detail-error">
              <button type="button" className="btn tdrw-run-pre-toggle" onClick={() => loadDetail()}>
                重試
              </button>
            </div>
          )}
          {detail && !detailLoading && (
            <>
              {detail.result && (
                <section className="tdrw-run-detail-section tdrw-run-detail-result">
                  <h4 className="tdrw-run-detail-label">結果</h4>
                  <div className="tdrw-text">{renderResult(detail.result)}</div>
                </section>
              )}
              {detail.sessionId && (
                <section className="tdrw-run-detail-section">
                  <h4 className="tdrw-run-detail-label">工作階段 ID</h4>
                  <CopyableBlock
                    text={detail.sessionId}
                    oneLine
                    readonlyStyle
                    copyAriaLabel="複製工作階段 ID"
                  />
                </section>
              )}
              <section className="tdrw-run-detail-section">
                <h4 className="tdrw-run-detail-label">
                  原始輸出{" "}
                  <span className="tdrw-run-detail-tag">stdout</span>
                </h4>
                <StdoutBlock text={detail.stdout || ""} />
              </section>
              {detail.stderr && (
                <section className="tdrw-run-detail-section">
                  <h4 className="tdrw-run-detail-label">
                    錯誤輸出{" "}
                    <span className="tdrw-run-detail-tag">stderr</span>
                  </h4>
                  <CopyableBlock text={detail.stderr} copyAriaLabel="複製錯誤輸出" />
                </section>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function StdoutBlock({ text }) {
  const [expanded, setExpanded] = useState(false);
  const lines = useMemo(() => text.split(/\r?\n/), [text]);
  const charCount = text.length;
  const isEmpty = charCount === 0;
  const overLimit = lines.length > STDOUT_PREVIEW_LINES;
  const showFull = expanded || !overLimit;
  const previewText = showFull ? text : lines.slice(0, STDOUT_PREVIEW_LINES).join("\n");
  return (
    <>
      <pre className="tdrw-run-pre" aria-label="原始輸出 stdout">
        {isEmpty ? "(空)" : previewText}
      </pre>
      {overLimit && (
        <div className="tdrw-run-pre-tools">
          <button
            type="button"
            className="btn tdrw-run-pre-toggle"
            onClick={() => setExpanded((v) => !v)}
            aria-expanded={expanded}
          >
            {expanded
              ? `收合(全 ${lines.length} 行)`
              : `展開全部(+${lines.length - STDOUT_PREVIEW_LINES} 行 / 全 ${lines.length} 行)`}
          </button>
        </div>
      )}
    </>
  );
}

function CopyableBlock({ text, oneLine, readonlyStyle, copyAriaLabel }) {
  const { copied, flash: flashCopied } = useCopiedFeedback();
  const handleCopy = () => {
    if (!text) return;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => flashCopied(), () => flashCopied());
    } else {
      flashCopied();
    }
  };
  const preClass = readonlyStyle
    ? "tdrw-run-session-id"
    : "tdrw-run-pre" + (oneLine ? " is-oneline" : "");
  return (
    <>
      <pre className={preClass}>{text || "(空)"}</pre>
      <div className="tdrw-run-pre-tools">
        <button
          type="button"
          className="btn tdrw-run-pre-toggle"
          onClick={handleCopy}
          disabled={!text}
          aria-label={copyAriaLabel || "複製"}
          title={copyAriaLabel || "複製到剪貼簿"}
        >
          {copied ? "已複製" : "複製"}
        </button>
        <span style={visuallyHidden} aria-live="polite">{copied ? "已複製" : ""}</span>
      </div>
    </>
  );
}

// ─── App shell ──────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState("dark");
  const [rootState, setRootState] = useState("populated"); // loading | empty | populated
  const [dataset, setDataset] = useState("rich");
  const [forceOpenAll, setForceOpenAll] = useState(false);
  const [detailMode, setDetailMode] = useState("loaded"); // loaded | loading | error
  const [stdoutMode, setStdoutMode] = useState("long"); // empty | short | long
  const [stderrMode, setStderrMode] = useState("short"); // empty | short | long
  const [panelOpen, setPanelOpen] = useState(true);

  useEffect(() => {
    document.documentElement.className = theme === "light" ? "light" : "";
  }, [theme]);

  // build runs list with per-card initial state injected based on demo controls
  const baseRuns = FIXTURE_SETS[dataset];
  const runs = useMemo(() => {
    if (rootState === "loading") return null;
    if (rootState === "empty") return [];
    return baseRuns.map((r, idx) => {
      // open first card by default so design sees expanded state out of the box
      const openByDefault = forceOpenAll || idx === 0;
      const initialDetail =
        openByDefault && detailMode === "loaded" ? buildDetail(r, { stdoutMode, stderrMode }) : null;
      return {
        ...r,
        _initialOpen: openByDefault,
        _initialDetail: initialDetail,
        _initialDetailLoading: openByDefault && detailMode === "loading",
        _initialDetailFailed: openByDefault && detailMode === "error",
      };
    });
  }, [rootState, baseRuns, forceOpenAll, detailMode, stdoutMode, stderrMode]);

  const fetchDetail = async (_h, _p, filename) => {
    const r = baseRuns.find((x) => x.filename === filename);
    if (!r) throw new Error("not found");
    if (detailMode === "error") {
      await new Promise((res) => setTimeout(res, 300));
      throw new Error("backend 5xx");
    }
    await new Promise((res) => setTimeout(res, detailMode === "loading" ? 4000 : 350));
    return buildDetail(r, { stdoutMode, stderrMode });
  };

  return (
    <>
      <div
        className="tdrw-drawer"
        role="dialog"
        aria-label="pipeline 執行紀錄"
      >
        <div className="tdrw-drawer-head">
          <div>
            <div className="tdrw-drawer-title">執行紀錄</div>
            <div className="pipeline-history-scope" style={{ color: "var(--fg-mute)", fontSize: 12, marginTop: 2 }}>
              pipeline · <span className="mono">019e36fbea63-phase8</span>
            </div>
          </div>
          <button
            type="button"
            className="tdrw-drawer-close"
            aria-label="關閉抽屜"
            onClick={() => alert("(prototype) close drawer")}
          >
            <XIcon />
          </button>
        </div>
        <div className="drawer-body">
          <div className="pipeline-history-top-summary">
            <div className="pipeline-history-top-summary-line">
              <span className="pipeline-history-top-summary-label">目前狀態</span>
              <span className="pipeline-history-top-summary-state">執行中 · 第 4 輪</span>
              <span className="pipeline-history-top-summary-sep">·</span>
              <span className="pipeline-history-top-summary-line-meta">
                最後變動於 <span className="mono">2026-05-25 08:21</span>
              </span>
            </div>
            <div className="pipeline-history-top-summary-line">
              <span className="pipeline-history-top-summary-label">最後動作</span>
              <span className="pipeline-history-top-summary-reason">critic PASS → executor 接續 t2</span>
            </div>
          </div>
          <RunHistory
            projectHash="proj-demo"
            pipelineId="019e36fbea63"
            onCloseDrawer={() => alert("(prototype) close drawer from empty state")}
            fetchRuns={async () => runs}
            fetchDetail={fetchDetail}
            initialRuns={runs}
          />
        </div>
      </div>

      <DemoPanel
        open={panelOpen}
        onToggle={() => setPanelOpen((v) => !v)}
        theme={theme} setTheme={setTheme}
        rootState={rootState} setRootState={setRootState}
        dataset={dataset} setDataset={setDataset}
        forceOpenAll={forceOpenAll} setForceOpenAll={setForceOpenAll}
        detailMode={detailMode} setDetailMode={setDetailMode}
        stdoutMode={stdoutMode} setStdoutMode={setStdoutMode}
        stderrMode={stderrMode} setStderrMode={setStderrMode}
      />
    </>
  );
}

function DemoPanel(props) {
  const {
    open, onToggle,
    theme, setTheme,
    rootState, setRootState,
    dataset, setDataset,
    forceOpenAll, setForceOpenAll,
    detailMode, setDetailMode,
    stdoutMode, setStdoutMode,
    stderrMode, setStderrMode,
  } = props;
  return (
    <div className="demo-panel">
      <div className="demo-panel-head" onClick={onToggle}>
        <span className="demo-panel-title">RunHistory · demo</span>
        <span className="demo-panel-toggle">{open ? "收合 ▾" : "展開 ▸"}</span>
      </div>
      {open && (
        <div className="demo-panel-body">
          <Row label="主題">
            {["dark", "light"].map((v) => (
              <Chip key={v} active={theme === v} onClick={() => setTheme(v)}>{v}</Chip>
            ))}
          </Row>
          <hr className="demo-divider" />
          <Row label="root state">
            {[
              ["populated", "populated"],
              ["empty", "empty"],
              ["loading", "loading"],
            ].map(([v, label]) => (
              <Chip key={v} active={rootState === v} onClick={() => setRootState(v)}>{label}</Chip>
            ))}
          </Row>
          <Row label="dataset">
            {[
              ["rich", "rich (6 runs · mixed)"],
              ["single", "single"],
              ["failHeavy", "fail-heavy"],
              ["codexOnly", "codex-only"],
            ].map(([v, label]) => (
              <Chip key={v} active={dataset === v} onClick={() => setDataset(v)}>{label}</Chip>
            ))}
          </Row>
          <label className="demo-toggle">
            <input
              type="checkbox"
              checked={forceOpenAll}
              onChange={(e) => setForceOpenAll(e.target.checked)}
            />
            展開全部 run cards
          </label>
          <hr className="demo-divider" />
          <Row label="detail state">
            {[
              ["loaded", "loaded"],
              ["loading", "loading"],
              ["error", "error + retry"],
            ].map(([v, label]) => (
              <Chip key={v} active={detailMode === v} onClick={() => setDetailMode(v)}>{label}</Chip>
            ))}
          </Row>
          <Row label="stdout">
            {[
              ["empty", "empty"],
              ["short", "short (8 行)"],
              ["long", "long (220 行)"],
            ].map(([v, label]) => (
              <Chip key={v} active={stdoutMode === v} onClick={() => setStdoutMode(v)}>{label}</Chip>
            ))}
          </Row>
          <Row label="stderr (僅 hasStderr=true 顯示)">
            {[
              ["empty", "empty"],
              ["short", "short"],
              ["long", "long"],
            ].map(([v, label]) => (
              <Chip key={v} active={stderrMode === v} onClick={() => setStderrMode(v)}>{label}</Chip>
            ))}
          </Row>
          <div className="demo-hint">
            data shape 對齊 shared/types.ts 的 RunSummary / RunDetail。codex run 沒成本/回合/權杖,
            UI 自動隱藏對應欄(見 isCodex 分支)。
          </div>
        </div>
      )}
    </div>
  );
}

function Row({ label, children }) {
  return (
    <div className="demo-row">
      <div className="demo-row-label">{label}</div>
      <div className="demo-row-controls">{children}</div>
    </div>
  );
}
function Chip({ active, onClick, children }) {
  return (
    <button type="button" className={"demo-chip" + (active ? " is-active" : "")} onClick={onClick}>
      {children}
    </button>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
